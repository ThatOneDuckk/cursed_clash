<body>
<canvas id="c"></canvas>
<div id="hint">
  P1: A/D move · W jump · F attack &nbsp;&nbsp;|&nbsp;&nbsp; P2: ←/→ move · ↑ jump · ; attack
</div>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 960, H = 520;

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const GND    = 430;
const GRAV   = 0.52;
const JUMP_V = -13.5;
const SPD    = 3.7;

const HEAD_R = 10;
const BODY_H = 25;
const LEG_H  = 23;
const LIMB_W = 2.3;
const PW     = 28;
const PH     = HEAD_R*2 + 6 + BODY_H + LEG_H + 4;

const ATK_START   = 85;
const ATK_ACT     = 130;
const ATK_REC     = 100;
const ATK_RANGE   = 88;
const STUN_MS     = 530;
const RAGD_MS     = 1250;
const SLAM_MS     = 1600;
const COMBO_RESET = 2600;
const DMG_HIT  = 2;
const DMG_KB   = 5;
const DMG_SLAM = 15;

const S = { IDLE:'idle', WALK:'walk', AIR:'air', ATCK:'atck',
            DIVE:'dive', STUN:'stun', RAGD:'ragd', SLAM:'slam', DEAD:'dead',
            CLEAVE:'cleave', DISMANTLE:'dismantle', FUGA:'fuga', LAPSE:'lapse',
            REVERSAL:'reversal', HOLLOW:'hollow', DOMAIN:'domain',
            BLACKFLASH:'blackflash', BLACKBLUR:'blackblur', YUJIULT:'yujiult',
            YUTASLICE:'yutaslice', YUTAFIST:'yutafist' };

const YUTAFIST_SHEATHE_DUR = 400;   // ms sword disappears
const YUTAFIST_AIM_DUR     = 1200;  // ms to aim arc
const YUTAFIST_SLAM_SPD    = 22;    // downward slam speed
const YUTAFIST_AIM_SPD     = 4.5;  // horizontal aim px/ms
const YUTAFIST_DMG         = 28;    // explosion damage
const YUTAFIST_RADIUS      = 80;    // blast radius px (~8 blocks)
const YUTAFIST_COOLDOWN    = 4500;
const YUTA_COPY_ULT_REQ   = 40;   // damage charge needed (like hollow purple)
const YUTA_COPY_ULT_RANGE = 90;   // close-range touch distance px
const YUTA_COPY_ULT_DMG   = 8;    // touch damage

const YUTA_SLICE_COUNT   = 5;
const YUTA_SLICE_DMG     = 4;
const YUTA_SLICE_DUR     = 200;
const YUTA_SLICE_LUNGE   = 5;     // reduced lunge
const YUTA_SLICE_COOLDOWN= 3000;
const YUTA_COMBO_DIST    = 3 * 9.6; // 3 blocks (BLOCK=9.6)


const YUJI_ULT_COST      = 100;  // damage dealt to unlock
const YUJI_ULT_HOOD_DUR  = 1400; // ms standing menacingly pulling hood
const YUJI_ULT_BUBBLE_DUR= 900;  // ms speech bubble shows
const YUJI_ULT_CLEAVE_GAP= 350;  // ms between successive giant cleaves
const YUJI_ULT_CLEAVE_DMG= 70;   // damage for the single giant cleave
const YUJI_ULT_CLEAVE_W  = 3.8;  // size multiplier vs normal cleave
const YUJI_ULT_COOLDOWN  = 8000;

// Black Blur constants
const BB_LUNGE_DIST  = 10 * 9.6;  // 10 blocks (1 block = BLOCK px)
const BB_LUNGE_SPD   = 18;         // px per frame during lunge
const BB_PUNCH1_DUR  = 420;        // ms first punch (longer wind-up)
const BB_PUNCH2_DUR  = 420;        // ms second punch
const BB_SLOW_DUR    = 600;        // ms of slow motion before kick (shorter = tighter window)
const BB_KICK_DUR    = 320;        // ms kick animation
const BB_DMG_HIT     = 8;          // each punch
const BB_DMG_KICK    = 9;          // kick without BF (total ~25)
const BB_DMG_BF_KICK = 24;         // kick with BF (total ~40)
const BB_COOLDOWN    = 4000;
const BB_LINE_SPEED  = 3.8;        // px/ms factor — one pass across 140px bar in ~330ms real time

const BF_MINIGAME_DUR  = 2500;  // ms minigame is active
const BF_LINE_SPEED    = 2.2;   // px/ms across bar
const BF_BAR_W         = 140;   // minigame bar width
const BF_GOAL_W        = 18;    // goal zone width (narrower = harder)
const BF_WINDOW        = 600;   // ms window to hit F after winning
const BF_DMG           = 30;    // black flash damage

// Piercing Blood (Yuji ability)
const PB_RANGE         = W * 0.5;
const PB_CHARGE_MAX    = 3000;
const PB_DMG_1         = 10;
const PB_DMG_2         = 20;
const PB_DMG_3         = 30;
const PB_COOLDOWN      = 2200;

const piercingBeams = [];
function addPiercingBeam(x, y, dir, owner, dmg){
  piercingBeams.push({ x, y, dir, owner, dmg, life:1, length:0 });
}
function tickPiercingBeams(dt, p1, p2){
  for(let i=piercingBeams.length-1;i>=0;i--){
    const b=piercingBeams[i];
    b.length = Math.min(PB_RANGE, b.length + 28*(dt/16.67));
    if(!b.hit){
      const def = b.owner===p1 ? p2 : p1;
      if(def.hittable){
        const db=def.bodyBox();
        const bx=b.dir===1 ? b.x : b.x-b.length;
        const hitBox={x:bx, y:b.y-12, w:b.length, h:24};
        if(overlaps(hitBox,db)){
          b.hit=true;
          const mx=def.x+PW/2, my=def.y+PH/2;
          def.hp=Math.max(0,def.hp-b.dmg); def.flash=250;
          addParts(mx,my,'#8b0000',10,4); addRing(mx,my,'#cc1111',45);
          addDmg(mx,def.y-14,b.dmg,'#cc1111'); doShake(7);
          b.owner.domainCharge=Math.min(DOMAIN_CHARGE_REQ,b.owner.domainCharge+b.dmg);
          if(b.owner.type==='yuji') b.owner.yujiUltCharge=Math.min(YUJI_ULT_COST,b.owner.yujiUltCharge+b.dmg);
          if(def.hp<=0){ def._initRd(b.dir*8,-5,.1*b.dir); def.ss(S.DEAD); }
          else { def._initRd(b.dir*7,-4,.09*b.dir); def.ss(S.RAGD,RAGD_MS); }
        }
      }
    }
    b.life -= dt*0.0018;
    if(b.life<=0) piercingBeams.splice(i,1);
  }
}
function drawPiercingBeams(){
  const t=Date.now();
  for(const b of piercingBeams){
    ctx.save();
    ctx.translate(b.x, b.y);
    const endX = b.dir * b.length;
    const a = b.life;
    ctx.lineCap='round';
    // Outer dark glow
    ctx.globalAlpha=a*0.3;
    ctx.strokeStyle='rgba(80,0,0,0.7)'; ctx.lineWidth=20;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(endX,0); ctx.stroke();
    // Core dark blood beam
    ctx.globalAlpha=a*0.95;
    ctx.strokeStyle='#3a0000'; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(endX,0); ctx.stroke();
    // Mid layer
    ctx.strokeStyle='#8b0000'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(endX,0); ctx.stroke();
    // Bright center streak
    ctx.strokeStyle='#cc1111'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(endX,0); ctx.stroke();
    // Helical wrap — dark crimson sinusoid
    const steps=Math.max(2,Math.floor(b.length/3));
    ctx.globalAlpha=a*0.85;
    ctx.strokeStyle='#660000'; ctx.lineWidth=2;
    ctx.beginPath();
    for(let s=0;s<=steps;s++){
      const px=b.dir*(s/steps)*b.length;
      const py=Math.sin(s*0.5+t*0.009)*6;
      s===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke();
    // Second helix offset π — brighter red accent
    ctx.strokeStyle='#ff2222'; ctx.lineWidth=1.2;
    ctx.globalAlpha=a*0.55;
    ctx.beginPath();
    for(let s=0;s<=steps;s++){
      const px=b.dir*(s/steps)*b.length;
      const py=Math.sin(s*0.5+t*0.009+Math.PI)*6;
      s===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha=1;
  }
}

const FUGA_WINDUP    = 2200;  // ms bow-draw (long, deliberate)
const FUGA_SPEED     = 12;
const FUGA_DMG       = 55;
const FUGA_CHARGE_REQ = 40;
const FUGA_EXPLOSION_R = 90;

// Flame trail particles attached to fuga shots
const flameTrails = [];
function spawnFlameTrail(x, y){
  // Spawn multiple particles per call for density
  for(let i=0;i<3;i++){
    const spread = (Math.random()-0.5)*14;
    flameTrails.push({
      x: x + (Math.random()-0.5)*8,
      y: y + spread,
      vx: (Math.random()-0.5)*1.8,
      vy: -1.8 - Math.random()*3.2,
      life: 1,
      decay: 0.022 + Math.random()*0.018,
      r: 7 + Math.random()*11,
      hue: 10 + Math.random()*40
    });
  }
}
function tickFlameTrails(dt){
  const f=dt/16.67;
  for(let i=flameTrails.length-1;i>=0;i--){
    const p=flameTrails[i];
    p.x+=p.vx*f; p.y+=p.vy*f; p.vy-=0.04*f;
    p.life-=p.decay*(dt/16.67);
    if(p.life<=0) flameTrails.splice(i,1);
  }
}
function drawFlameTrails(){
  for(const p of flameTrails){
    ctx.save();
    ctx.globalAlpha = p.life * 0.75;
    const r = p.r * p.life;
    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    grad.addColorStop(0, `hsla(${p.hue+30},100%,90%,1)`);
    grad.addColorStop(0.4, `hsla(${p.hue},100%,55%,0.8)`);
    grad.addColorStop(1, `hsla(${p.hue-10},100%,30%,0)`);
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// Explosions — fiery pillar
const explosions = [];
function addExplosion(x, y){
  // Dense burst of flame particles spread across full pillar height
  for(let j=0;j<90;j++){
    const upward = Math.random() < 0.6;
    flameTrails.push({
      x: x + (Math.random()-0.5)*55,
      y: upward ? y - Math.random()*y : y + Math.random()*(H-y),
      vx: (Math.random()-0.5)*5,
      vy: upward ? -5 - Math.random()*10 : 4 + Math.random()*8,
      life: 1,
      decay: 0.007 + Math.random()*0.010,
      r: 14 + Math.random()*24,
      hue: 10 + Math.random()*40
    });
  }
  explosions.push({x, y, r:6, maxR:FUGA_EXPLOSION_R*1.6, life:1, pillarLife:1});
}
function tickExplosions(dt){
  for(let i=explosions.length-1;i>=0;i--){
    const e=explosions[i];
    e.r += (e.maxR-e.r)*0.16;
    e.life -= dt*0.0016;
    e.pillarLife -= dt*0.0011;
    if(e.life<=0) explosions.splice(i,1);
  }
}
function drawExplosions(){
  for(const e of explosions){
    ctx.save();

    // Pillar upward — impact point to top of arena
    if(e.pillarLife>0){
      const pw = 80 + (1-e.pillarLife)*60;

      // Upper pillar (top of arena down to impact)
      const upGrad = ctx.createLinearGradient(0, e.y, 0, 0);
      upGrad.addColorStop(0,   `rgba(255,255,180,${e.pillarLife*1.0})`);
      upGrad.addColorStop(0.08,`rgba(255,200,40,${e.pillarLife*0.95})`);
      upGrad.addColorStop(0.3, `rgba(255,80,10,${e.pillarLife*0.75})`);
      upGrad.addColorStop(0.7, `rgba(180,20,0,${e.pillarLife*0.4})`);
      upGrad.addColorStop(1,   `rgba(80,0,0,0)`);
      ctx.fillStyle = upGrad;
      ctx.fillRect(e.x - pw/2, 0, pw, e.y);

      // Lower pillar (impact point to bottom of arena)
      const downGrad = ctx.createLinearGradient(0, e.y, 0, H);
      downGrad.addColorStop(0,   `rgba(255,255,180,${e.pillarLife*1.0})`);
      downGrad.addColorStop(0.08,`rgba(255,200,40,${e.pillarLife*0.95})`);
      downGrad.addColorStop(0.3, `rgba(255,80,10,${e.pillarLife*0.75})`);
      downGrad.addColorStop(0.7, `rgba(180,20,0,${e.pillarLife*0.4})`);
      downGrad.addColorStop(1,   `rgba(80,0,0,0)`);
      ctx.fillStyle = downGrad;
      ctx.fillRect(e.x - pw/2, e.y, pw, H - e.y);

      // Blazing white-hot core streak (full height)
      const coreGrad = ctx.createLinearGradient(0, 0, 0, H);
      coreGrad.addColorStop(0,   `rgba(255,255,255,0)`);
      coreGrad.addColorStop(0.3, `rgba(255,255,220,${e.pillarLife*0.7})`);
      coreGrad.addColorStop(0.5, `rgba(255,255,255,${e.pillarLife*0.95})`);
      coreGrad.addColorStop(0.7, `rgba(255,255,220,${e.pillarLife*0.7})`);
      coreGrad.addColorStop(1,   `rgba(255,255,255,0)`);
      ctx.fillStyle = coreGrad;
      ctx.fillRect(e.x - pw*0.12, 0, pw*0.24, H);
    }

    // Multiple expanding shockwave rings at impact point
    for(let ring=0;ring<3;ring++){
      const rScale = 1 + ring*0.35;
      const rAlpha = Math.max(0, e.life - ring*0.22);
      ctx.globalAlpha = rAlpha * 0.9;
      ctx.strokeStyle = ring===0 ? `hsl(50,100%,85%)` : ring===1 ? `hsl(30,100%,60%)` : `hsl(15,100%,45%)`;
      ctx.lineWidth = (5-ring*1.2)*e.life;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r*rScale, 0, Math.PI*2); ctx.stroke();
    }

    // Hot core flash at impact
    ctx.globalAlpha = e.life * 0.5;
    const coreFlash = ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.maxR*0.55);
    coreFlash.addColorStop(0,'rgba(255,255,230,1)');
    coreFlash.addColorStop(0.4,'rgba(255,160,20,0.7)');
    coreFlash.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=coreFlash;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.maxR*0.55,0,Math.PI*2); ctx.fill();

    ctx.restore();
    ctx.globalAlpha=1;
  }
}

// Fuga projectiles
const fugaShots = [];
function addFugaShot(x,y,dir,owner){
  fugaShots.push({x,y,dir,owner,hit:false,trailTimer:0});
}
function triggerFugaExplosion(x,y){
  addExplosion(x,y);
  addRing(x,y,'#f60',FUGA_EXPLOSION_R);
  doShake(18);
}
function tickFugaShots(dt){
  for(let i=fugaShots.length-1;i>=0;i--){
    const s=fugaShots[i];
    s.x += s.dir * FUGA_SPEED * (dt/16.67);
    // Spawn flame trail
    s.trailTimer+=dt;
    if(s.trailTimer>10){ s.trailTimer=0; spawnFlameTrail(s.x,s.y); spawnFlameTrail(s.x,s.y); }
    // Wall hit — explode
    if(s.x < 10 || s.x > W-10){
      triggerFugaExplosion(s.x, s.y);
      addParts(s.x,s.y,'#f80',16,6);
      fugaShots.splice(i,1);
    }
  }
}
function drawFugaShots(){
  for(const s of fugaShots){
    ctx.save();
    ctx.translate(s.x, s.y);

    // Elongated flame body — pointed tip forward, fading tail behind
    const tipX  = s.dir * 28;   // front tip
    const tailX = -s.dir * 48;  // back of tail
    const bodyH = 7;             // half-height at widest point

    // Main flame body gradient (horizontal)
    const grad = ctx.createLinearGradient(tailX, 0, tipX, 0);
    grad.addColorStop(0,   'rgba(150,20,0,0)');
    grad.addColorStop(0.35,'rgba(230,60,0,0.85)');
    grad.addColorStop(0.7, 'rgba(255,160,20,1)');
    grad.addColorStop(1,   'rgba(255,250,200,1)');

    // Arrow/teardrop path: pointed at front tip, tapering at tail
    ctx.beginPath();
    ctx.moveTo(tipX, 0);                          // front tip
    ctx.bezierCurveTo(
      tipX - s.dir*14, -bodyH,
      s.dir*4,         -bodyH,
      tailX,            0
    );
    ctx.bezierCurveTo(
      s.dir*4,          bodyH,
      tipX - s.dir*14,  bodyH,
      tipX,             0
    );
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Hot white core streak down the center
    const coreGrad = ctx.createLinearGradient(tailX*0.4, 0, tipX, 0);
    coreGrad.addColorStop(0, 'rgba(255,200,100,0)');
    coreGrad.addColorStop(0.5,'rgba(255,255,220,0.9)');
    coreGrad.addColorStop(1, 'rgba(255,255,255,1)');
    ctx.beginPath();
    ctx.moveTo(tipX, 0);
    ctx.bezierCurveTo(tipX-s.dir*10, -2.5, s.dir*2, -2.5, tailX*0.4, 0);
    ctx.bezierCurveTo(s.dir*2, 2.5, tipX-s.dir*10, 2.5, tipX, 0);
    ctx.closePath();
    ctx.fillStyle = coreGrad;
    ctx.fill();

    // Flickering outer glow
    ctx.globalAlpha = 0.3 + 0.2*Math.sin(Date.now()*0.03);
    const glowGrad = ctx.createLinearGradient(tailX, 0, tipX, 0);
    glowGrad.addColorStop(0, 'rgba(200,40,0,0)');
    glowGrad.addColorStop(1, 'rgba(255,120,0,0.4)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.ellipse(s.dir*(tipX-s.dir*20)*0.5, 0, Math.abs(tipX - tailX)*0.55, bodyH+5, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

const BLOCK = 960 / 100;

// ── LAPSE BLUE & REVERSAL RED — Controllable Orbs ──────────
const ORB_SPAWN_DIST   = 10 * BLOCK;  // spawn 10 blocks ahead
const BLUE_ORB_MAX_DIST = 7 * BLOCK;  // tight radius around Gojo
const ORB_DURATION     = 3000;        // 3 seconds control time
const ORB_EFFECT_RAD   = 20 * BLOCK;  // 20 block effect radius
const ORB_MOVE_SPD     = 5.5;         // px per frame while moving orb
const ORB_DMG          = 20;
const LAPSE_COOLDOWN   = 4000;
const REVERSAL_COOLDOWN= 4000;
const REVERSAL_WINDUP  = 380;
const REVERSAL_SPEED   = 42;  // matches cleave speed
const REVERSAL_DMG     = 14;
const REVERSAL_KB      = 13;
const LAPSE_SPAWN_DIST = 2 * BLOCK;   // keep for hollow nuke compatibility

// Blue orbs (attract) — now controllable
const lapseOrbs = [];
function addLapseOrb(x, y, owner){
  lapseOrbs.push({ x, y, owner, life:1, timer:ORB_DURATION, rot:0, hit:false, controllable:false });
}
function addControllableBlueOrb(x, y, owner){
  lapseOrbs.push({ x, y, owner, life:1, timer:ORB_DURATION, rot:0, hit:false, controllable:true });
}
function tickLapseOrbs(dt, p1, p2){
  for(let i=lapseOrbs.length-1;i>=0;i--){
    const orb=lapseOrbs[i];
    orb.timer -= dt;
    orb.life = Math.max(0, orb.timer / ORB_DURATION);
    orb.rot += dt * 0.005;

    // Controllable: move with owner's movement keys
    if(orb.controllable){
      const c = orb.owner.ctrl;
      if(keys[c.left])  orb.x -= ORB_MOVE_SPD * (dt/16.67);
      if(keys[c.right]) orb.x += ORB_MOVE_SPD * (dt/16.67);
      if(keys[c.jmp])   orb.y -= ORB_MOVE_SPD * (dt/16.67);
      // Down key
      if(orb.owner.playerNum===1 && keys['KeyS'])    orb.y += ORB_MOVE_SPD * (dt/16.67);
      if(orb.owner.playerNum===2 && keys['ArrowDown']) orb.y += ORB_MOVE_SPD * (dt/16.67);
      // Clamp to radius around Gojo
      const owCX = orb.owner.x + PW/2, owCY = orb.owner.y + PH/2;
      const ddx = orb.x - owCX, ddy = orb.y - owCY;
      const dd = Math.sqrt(ddx*ddx + ddy*ddy);
      if(dd > BLUE_ORB_MAX_DIST){
        orb.x = owCX + (ddx/dd)*BLUE_ORB_MAX_DIST;
        orb.y = owCY + (ddy/dd)*BLUE_ORB_MAX_DIST;
      }
      orb.x = Math.max(20, Math.min(W-20, orb.x));
      orb.y = Math.max(20, Math.min(GND,  orb.y));
    }

    if(orb.timer<=0 || orb.explode){
      // EXPLODE: attract everything in radius
      _explodeBlueOrb(orb, p1, p2);
      lapseOrbs.splice(i,1); continue;
    }
    // Old-style lapse orb: gradual pull
    if(!orb.controllable){
      const def = orb.owner===p1 ? p2 : p1;
      if(def.hittable){
        const dx=orb.x-(def.x+PW/2), dy=orb.y-(def.y+PH/2);
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<LAPSE_PULL_RADIUS && dist>0.1){
          const pullStr=0.38*(1-dist/LAPSE_PULL_RADIUS)*(dt/16.67);
          def.vx+=(dx/dist)*pullStr*4.5; def.vy+=(dy/dist)*pullStr*2.8;
          if(dist<22 && !orb.hit){
            orb.hit=true;
            def.hp=Math.max(0,def.hp-12); def.flash=350;
            addDmg(orb.x,orb.y-18,12,'#4af');
            addParts(orb.x,orb.y,'#06f',14,5); addRing(orb.x,orb.y,'#4af',55); doShake(8);
            if(orb.owner.type==='gojo') orb.owner.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,orb.owner.hollowCharge+12);
            orb.owner.domainCharge=Math.min(DOMAIN_CHARGE_REQ,orb.owner.domainCharge+12);
            if(def.hp<=0){ def._initRd(0,-5,0.08); def.ss(S.DEAD); }
            else { def.vx=0; def.vy=-4; def.ss(S.STUN,900); }

function _explodeBlueOrb(orb, p1, p2){

function addControllableRedOrb(x, y, owner){

    orb.x += orb.vx * f;
    orb.y += orb.vy * f;

    if(orb.x < -60 || orb.x > W+60){ redOrbs.splice(i,1); continue; }

        }
      }
    }
  }
}
function _explodeRedOrb(orb, p1, p2){
  const def = orb.owner===p1 ? p2 : p1;
  if(!def.hittable) return;
  const dx=(def.x+PW/2)-orb.x, dy=(def.y+PH/2)-orb.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist < ORB_EFFECT_RAD){
    def.hp=Math.max(0,def.hp-ORB_DMG); def.flash=400;

    addParts(orb.x,orb.y,'#f44',22,8); addRing(orb.x,orb.y,'#f44',ORB_EFFECT_RAD*0.5); doShake(14);
    if(orb.owner.type==='gojo') orb.owner.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,orb.owner.hollowCharge+ORB_DMG);
    orb.owner.domainCharge=Math.min(DOMAIN_CHARGE_REQ,orb.owner.domainCharge+ORB_DMG);
    if(def.hp<=0){ def._initRd(def.vx*0.5,def.vy*0.5,0.1); def.ss(S.DEAD); }
    else { def._initRd(def.vx, def.vy, 0.08); def.ss(S.RAGD, RAGD_MS*1.2); }
  } else {
    addParts(orb.x,orb.y,'#f44',14,5); addRing(orb.x,orb.y,'#f44',80); doShake(7);
  }
}
function drawRedOrbs(){
  for(const orb of redOrbs){

const DOMAIN_CHARGE_REQ = 150;  // total damage to charge domain
const DOMAIN_HANDSIGN   = 1800; // ms hand sign before shrine rises
const DOMAIN_SHRINE_RISE= 1200; // ms for shrine to rise
const DOMAIN_DURATION   = 10000;// ms domain is active
const YUTA_DOMAIN_DUR   = 15000; // 3/2 of Infinity (10s * 1.5)
const JACOB_LADDER_REQ  = 4;    // 4 katana charges to fill Jacob's Ladder
const JACOB_LADDER_DMG_FRAC = 0.8; // 4/5 of opponent max HP
const DOMAIN_SLASH_DMG  = 5;    // damage per second (applied continuously)
const DOMAIN_SLASH_INT  = 100;  // ms between slash mark spawns during domain

// Active domain state (global — only one can be active)
let activeDomain = null;
// type: 'shrine' (Sukuna) or 'void' (Gojo)
let domainFlash = 0; // 0=none, >0=fading to black then back (total 1000ms)

function startDomain(owner){
  const type = owner.type === 'sukuna' ? 'shrine' : owner.type === 'yuta' ? 'love' : 'void';
  const duration = type === 'love' ? YUTA_DOMAIN_DUR : DOMAIN_DURATION;
  activeDomain = {
    owner, type,
    timer: duration,
    totalDuration: duration,
    // shrine fields
    shrineRise: 0, slashTimer: 0, slashDmgAccum: 0,
    // void fields
    voidRise: 0, voidRot: 0, debrisAngle: [],
    inkSplatters: [],
    // love (Yuta) fields
    loveRise: 0,
    katanas: [],    // ground katanas to grab
    ruinPillars: [] // stone pillars
  };
  // Spawn debris/splatter for void
  for(let i=0;i<18;i++) activeDomain.debrisAngle.push({a:Math.random()*Math.PI*2, r:60+Math.random()*55, size:2+Math.random()*6, spd:0.3+Math.random()*0.5, drift:(Math.random()-0.5)*0.015});
  for(let i=0;i<6;i++) activeDomain.inkSplatters.push({x:(Math.random()<0.5?0:W) + (Math.random()-0.5)*80, y:Math.random()*H, r:50+Math.random()*80, side: i<3?-1:1});
  // Spawn katanas on the ground for Yuta's domain
  if(type==='love'){
    for(let i=0;i<6;i++){
      activeDomain.katanas.push({ x: 80+i*(W-160)/5, angle: -0.2+(Math.random()-0.5)*0.6, grabbed: false });
    }
    for(let i=0;i<8;i++){
      activeDomain.ruinPillars.push({ x: 40+Math.random()*(W-80), h: 60+Math.random()*120, w: 18+Math.random()*22 });
    }
    // Reset Jacob's Ladder charge
    owner.jacobLadderCharge = 0;
    owner.jacobReady = false;
  }
  domainFlash = 1000;
}

function tickDomain(dt, p1, p2){
  if(!activeDomain) return;
  const d = activeDomain;
  d.timer -= dt;

  if(d.type === 'shrine'){
    d.shrineRise = Math.min(1, d.shrineRise + dt/DOMAIN_SHRINE_RISE);
    d.slashTimer -= dt;
    if(d.slashTimer <= 0){
      d.slashTimer = DOMAIN_SLASH_INT;
      if(d.shrineRise >= 0.5){
        const count = 6 + Math.floor(Math.random()*4);
        for(let i=0;i<count;i++){
          const sx = 20 + Math.random()*(W-40);
          addSlashMark(sx, 0, (Math.random()-0.5)*0.5, true);
        }
        const def = d.owner===p1 ? p2 : p1;
        if(def.hittable){
          addSlashMark(def.x+4+Math.random()*(PW-8), def.y+6+Math.random()*(PH-12), (Math.random()-0.5)*Math.PI*0.8);
          addSlashMark(def.x+4+Math.random()*(PW-8), def.y+6+Math.random()*(PH-12), (Math.random()-0.5)*Math.PI*0.8);
        }
      }
    }
    if(d.shrineRise >= 1){
      const def = d.owner===p1 ? p2 : p1;
      if(def.hittable){
        d.slashDmgAccum += DOMAIN_SLASH_DMG * (dt/1000);
        if(d.slashDmgAccum >= 1){
          const dmg = Math.floor(d.slashDmgAccum);
          d.slashDmgAccum -= dmg;
          def.hp = Math.max(0, def.hp - dmg);
          def.flash = 80;
          if(def.hp <= 0 && def.state !== S.DEAD){ def._initRd(0,-3,0.05); def.ss(S.DEAD); }
        }
      }
    }
  } else {
    // GOJO VOID DOMAIN
    d.voidRise = Math.min(1, d.voidRise + dt/DOMAIN_SHRINE_RISE);
    d.voidRot += dt * 0.0012;
    // Drift debris
    for(const db of d.debrisAngle){ db.a += db.spd * (dt/1000); db.r += db.drift*dt*0.1; db.r=Math.max(40,Math.min(120,db.r)); }
    // Keep enemy stunned the entire time
    const def = d.owner===p1 ? p2 : p1;
    if(d.voidRise >= 0.4 && def.hittable && def.state !== S.STUN && def.state !== S.DEAD){
      def.vx=0; def.vy=0; def.ss(S.STUN, 800);
    }
    if(def.state === S.STUN) def.sTimer = 0; // keep refreshing stun
  }

  if(d.timer <= 0){ activeDomain = null; return; }

  if(d.type === 'love'){
    d.loveRise = Math.min(1, d.loveRise + dt/1200);
    // Katana grab check: Yuta punch near a katana grabs it
    // (handled in landHit for Yuta inside domain)
  }
}

function drawDomain(){
  if(!activeDomain) return;
  if(activeDomain.type === 'shrine') drawShrineDomain();
  else if(activeDomain.type === 'love') drawLoveDomain();
  else drawVoidDomain();
}

function drawVoidDomain(){
  const d = activeDomain;
  const rise = d.voidRise;
  const fade = Math.min(1, d.timer/1000);
  const cx = W/2, cy = H/2 - 20;
  const t = Date.now();

  ctx.save();

  // Deep dark blue background
  ctx.globalAlpha = rise * fade * 0.88;
  const bgGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.7);
  bgGrad.addColorStop(0,'rgba(4,8,22,1)');
  bgGrad.addColorStop(0.5,'rgba(2,10,28,0.95)');
  bgGrad.addColorStop(1,'rgba(0,5,15,0.85)');
  ctx.fillStyle=bgGrad;
  ctx.fillRect(0,0,W,H);

  ctx.globalAlpha = rise * fade;

  // --- INK SPLATTERS at edges ---
  for(const sp of d.inkSplatters){
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.globalAlpha = rise * fade * 0.9;
    // Main splat blob
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(0,0,sp.r*0.6,sp.r*0.4,sp.side*0.3,0,Math.PI*2); ctx.fill();
    // Drip tendrils
    for(let i=0;i<5;i++){
      const ang = (i/5)*Math.PI*2 + sp.side*0.5;
      const len = sp.r*0.3 + Math.random()*sp.r*0.4;
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.ellipse(Math.cos(ang)*len*0.6, Math.sin(ang)*len*0.4, 4+Math.random()*8, 3+Math.random()*5, ang, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // --- CONCENTRIC GLOWING RINGS ---
  const ringCount = 7;
  for(let i=0;i<ringCount;i++){
    const baseR = 55 + i*22;
    const wobble = Math.sin(t*0.001*(i+1)*0.7 + i) * 3 * rise;
    const r = (baseR + wobble) * rise;
    const alpha = (1 - i/ringCount) * 0.65 * fade;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = i < 2
      ? `rgba(160,210,240,${0.9-i*0.1})`  // inner rings brighter
      : `rgba(80,150,200,${0.7-i*0.08})`; // outer rings dimmer
    ctx.lineWidth = i < 2 ? 2.5 - i*0.4 : 1.5 - i*0.1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  }

  // --- ORBITING DEBRIS particles ---
  ctx.globalAlpha = rise * fade;
  for(const db of d.debrisAngle){
    const dx = cx + Math.cos(db.a + d.voidRot)*db.r*rise;
    const dy = cy + Math.sin(db.a + d.voidRot)*db.r*rise*0.6;
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.ellipse(dx, dy, db.size*rise, db.size*0.6*rise, db.a, 0, Math.PI*2);
    ctx.fill();
    // Bright edge highlight on debris
    ctx.fillStyle='rgba(140,190,220,0.5)';
    ctx.beginPath();
    ctx.ellipse(dx-db.size*0.3*rise, dy-db.size*0.2*rise, db.size*0.3*rise, db.size*0.2*rise, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // --- OUTER GLOW ring halo ---
  ctx.globalAlpha = rise * fade * 0.5;
  const haloGrad = ctx.createRadialGradient(cx,cy,60*rise,cx,cy,180*rise);
  haloGrad.addColorStop(0,'rgba(60,130,200,0)');
  haloGrad.addColorStop(0.4,'rgba(60,150,220,0.35)');
  haloGrad.addColorStop(0.7,'rgba(40,100,180,0.2)');
  haloGrad.addColorStop(1,'rgba(0,20,60,0)');
  ctx.fillStyle=haloGrad;
  ctx.beginPath(); ctx.arc(cx,cy,180*rise,0,Math.PI*2); ctx.fill();

  // --- BLACK VOID SPHERE center ---
  ctx.globalAlpha = rise * fade;
  const voidGrad = ctx.createRadialGradient(cx-8*rise,cy-8*rise,0,cx,cy,52*rise);
  voidGrad.addColorStop(0,'rgba(0,0,0,1)');
  voidGrad.addColorStop(0.75,'rgba(0,0,0,1)');
  voidGrad.addColorStop(0.88,'rgba(30,60,100,0.6)');
  voidGrad.addColorStop(1,'rgba(60,120,180,0)');
  ctx.fillStyle=voidGrad;
  ctx.beginPath(); ctx.arc(cx,cy,52*rise,0,Math.PI*2); ctx.fill();

  // Subtle inner ring right at sphere edge
  ctx.globalAlpha = rise * fade * 0.8;
  ctx.strokeStyle='rgba(120,190,230,0.7)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,52*rise,0,Math.PI*2); ctx.stroke();

  // Domain timer bar
  ctx.globalAlpha = fade;
  const barW=200,barH=5,barX=cx-barW/2,barY=8;
  const timerPct=d.timer/DOMAIN_DURATION;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle=`rgba(80,160,220,1)`; ctx.fillRect(barX,barY,barW*timerPct,barH);
  ctx.strokeStyle='rgba(80,150,220,0.5)'; ctx.lineWidth=1; ctx.strokeRect(barX,barY,barW,barH);
  ctx.fillStyle='rgba(140,200,240,0.9)'; ctx.font=`700 8px 'Rajdhani',sans-serif`;
  ctx.textAlign='center'; ctx.fillText('INFINITE VOID', cx, barY+16);

  ctx.restore();
  ctx.globalAlpha=1;
}

function drawLoveDomain(){
  if(!activeDomain) return;
  const d = activeDomain;
  const rise = d.loveRise;
  const fade = Math.min(1, d.timer/1500);
  const t = Date.now();

  ctx.save();

  // ── Magenta/purple sky background ──
  ctx.globalAlpha = rise * fade * 0.88;
  const skyGrad = ctx.createLinearGradient(0,0,0,GND);
  skyGrad.addColorStop(0,   '#1a001a');
  skyGrad.addColorStop(0.3, '#3d005c');
  skyGrad.addColorStop(0.7, '#8800cc');
  skyGrad.addColorStop(1,   '#cc44ff');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, GND);

  // ── Floating particles / starfield ──
  ctx.globalAlpha = rise * fade * 0.6;
  for(let i=0;i<20;i++){
    const px = ((i*137+t*0.02*(i%3===0?1:-1)) % W + W) % W;
    const py = ((i*89 + t*0.015) % GND + GND) % GND;
    const pr = 1.5 + Math.sin(t*0.003+i)*1.2;
    ctx.fillStyle = i%3===0 ? '#ff88ff' : i%3===1 ? '#ffffff' : '#cc66ff';
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2); ctx.fill();
  }

  // ── Ruined stone pillars ──
  ctx.globalAlpha = rise * fade * 0.85;
  for(const p of d.ruinPillars){
    const py = GND - p.h;
    // Pillar body — cracked white/grey stone
    const pg = ctx.createLinearGradient(p.x, py, p.x+p.w, py);
    pg.addColorStop(0, 'rgba(220,210,230,0.9)');
    pg.addColorStop(0.5,'rgba(255,255,255,0.95)');
    pg.addColorStop(1, 'rgba(180,170,200,0.85)');
    ctx.fillStyle = pg;
    ctx.fillRect(p.x, py, p.w, p.h);
    // Crack lines
    ctx.strokeStyle='rgba(100,90,110,0.5)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(p.x+p.w*0.3, py+p.h*0.1);
    ctx.lineTo(p.x+p.w*0.5, py+p.h*0.4);
    ctx.lineTo(p.x+p.w*0.4, py+p.h*0.6);
    ctx.stroke();
    // Top cap
    ctx.fillStyle='rgba(200,195,215,0.95)';
    ctx.fillRect(p.x-3, py-6, p.w+6, 8);
  }

  // ── Ground katanas ──
  ctx.globalAlpha = rise * fade;
  for(const k of d.katanas){
    if(k.grabbed) continue;
    ctx.save();
    ctx.translate(k.x, GND);
    ctx.rotate(k.angle);
    // Blade
    const bg = ctx.createLinearGradient(0, -55, 0, 0);
    bg.addColorStop(0,'rgba(220,220,240,1)');
    bg.addColorStop(0.6,'rgba(180,180,200,0.9)');
    bg.addColorStop(1,'rgba(120,100,80,0.8)');
    ctx.fillStyle=bg;
    ctx.fillRect(-1.5, -55, 3, 55);
    // Guard
    ctx.fillStyle='rgba(80,60,40,0.9)';
    ctx.fillRect(-6, -6, 12, 5);
    // Handle wrap
    ctx.strokeStyle='rgba(60,40,20,0.8)'; ctx.lineWidth=1.5;
    for(let w=0;w<4;w++){
      ctx.beginPath(); ctx.moveTo(-3, w*4); ctx.lineTo(3, w*4+2); ctx.stroke();
    }
    ctx.restore();
  }

  // ── Jacob's Ladder beam (if firing) ──
  if(d.jacobFiring){
    d.jacobTimer = (d.jacobTimer||0) + 16.67;
    const prog = Math.min(1, d.jacobTimer/800);
    const tx = d.jacobTargetX;
    const beamW = 40 + Math.sin(t*0.02)*8;
    ctx.globalAlpha = (1-prog)*0.95;
    // Outer glow
    const bg2 = ctx.createLinearGradient(tx-beamW, 0, tx+beamW, 0);
    bg2.addColorStop(0,'rgba(180,0,255,0)');
    bg2.addColorStop(0.4,'rgba(255,180,255,0.7)');
    bg2.addColorStop(0.5,'rgba(255,255,255,1)');
    bg2.addColorStop(0.6,'rgba(255,180,255,0.7)');
    bg2.addColorStop(1,'rgba(180,0,255,0)');
    ctx.fillStyle=bg2;
    ctx.fillRect(tx-beamW, 0, beamW*2, GND);
    // Core
    ctx.globalAlpha = (1-prog)*1.0;
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.fillRect(tx-5, 0, 10, GND);
    if(prog>=1){ d.jacobFiring=false; }
  }

  // ── HUD: Jacob's Ladder charge indicator (inside domain) ──
  if(rise > 0.5){
    const owner = d.owner;
    const bx = owner.playerNum===1 ? 22 : W-22-150;
    const jy = 160;
    ctx.globalAlpha = rise * fade * 0.9;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx,jy,150,14);
    const jPct = owner.jacobLadderCharge / JACOB_LADDER_REQ;
    ctx.fillStyle = jPct>=1 ? `rgba(255,180,255,${0.7+0.3*Math.abs(Math.sin(t*0.006))})` : 'rgba(180,80,255,0.7)';
    ctx.fillRect(bx, jy, Math.floor(150*jPct), 14);
    ctx.strokeStyle='rgba(200,100,255,0.4)'; ctx.lineWidth=1; ctx.strokeRect(bx,jy,150,14);
    ctx.fillStyle = jPct>=1 ? '#ffccff' : '#cc88ff';
    ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
    ctx.fillText(jPct>=1 ? "JACOB'S LADDER — READY [T/Y]" : `JACOB'S LADDER  ${Math.floor(jPct*100)}%`, bx+75, jy+10);
  }

  ctx.restore();
  ctx.globalAlpha=1;
}

function drawShrineDomain(){
  if(!activeDomain) return;
  const d = activeDomain;
  const rise = d.shrineRise;
  const fade = Math.min(1, d.timer/1000);
  const cx = W/2;
  const baseY = GND;
  const t = Date.now();

  ctx.save();

  // Dark tinted overlay
  if(rise > 0.3){
    ctx.globalAlpha = (rise-0.3)/0.7 * 0.22 * fade;
    ctx.fillStyle = '#080310';
    ctx.fillRect(0,0,W,H);
  }

  ctx.globalAlpha = rise * fade;

  // ── SHRINE ──────────────────────────────────────────────
  const sX = cx;
  const platH = 28 * rise;   // platform height
  const platW = 160 * rise;  // platform width
  const platY = baseY;       // platform sits on the ground
  // Everything above the platform is offset up by platH
  const floorY = platY - platH;  // effective "ground" for shrine elements

  const roofBot = floorY - 70*rise;
  const roofTop = floorY - 220*rise;

  // --- Platform (tiered stone) ---
  // Bottom tier (widest)
  ctx.fillStyle='#2a1a0a';
  ctx.fillRect(sX - platW/2 - 14*rise, platY - platH*0.38, (platW+28*rise), platH*0.38);
  // Middle tier
  ctx.fillStyle='#342010';
  ctx.fillRect(sX - platW/2, platY - platH*0.72, platW, platH*0.34);
  // Top tier (narrowest, this is where shrine stands)
  ctx.fillStyle='#3e2614';
  ctx.fillRect(sX - platW/2 + 12*rise, floorY, platW - 24*rise, platH*0.28);
  // Edge highlight
  ctx.strokeStyle='rgba(100,60,20,0.6)'; ctx.lineWidth=1.5;
  ctx.strokeRect(sX - platW/2 - 14*rise, platY - platH*0.38, platW+28*rise, platH*0.38);
  ctx.strokeRect(sX - platW/2, platY - platH*0.72, platW, platH*0.34);
  ctx.strokeRect(sX - platW/2 + 12*rise, floorY, platW - 24*rise, platH*0.28);

  // --- Animal skulls scattered around platform base ---
  const skullPositions = [-110,-84,-60,60,84,110];
  for(let i=0;i<skullPositions.length;i++){
    const skx = sX + skullPositions[i]*rise;
    const sky = platY - 6*rise;
    ctx.fillStyle='rgba(220,210,190,0.85)';
    ctx.beginPath(); ctx.ellipse(skx,sky-6*rise,9*rise,7*rise,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(skx,sky,5*rise,3.5*rise,0,0,Math.PI); ctx.fill();
    ctx.strokeStyle='rgba(180,150,80,0.9)'; ctx.lineWidth=2.5*rise;
    ctx.beginPath(); ctx.moveTo(skx-6*rise,sky-10*rise);
    ctx.quadraticCurveTo(skx-18*rise,sky-26*rise,skx-13*rise,sky-30*rise); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(skx+6*rise,sky-10*rise);
    ctx.quadraticCurveTo(skx+18*rise,sky-26*rise,skx+13*rise,sky-30*rise); ctx.stroke();
  }

  // --- Dark posts on sides (standing on platform) ---
  for(const px of [sX-98, sX+98]){
    ctx.fillStyle='#1a0828';
    ctx.fillRect(px-5*rise, floorY-52*rise, 10*rise, 52*rise);
    const og = ctx.createRadialGradient(px, floorY-55*rise, 0, px, floorY-55*rise, 10*rise);
    og.addColorStop(0,'rgba(80,40,180,0.9)');
    og.addColorStop(1,'rgba(20,5,60,0)');
    ctx.fillStyle=og;
    ctx.beginPath(); ctx.arc(px, floorY-55*rise, 10*rise, 0, Math.PI*2); ctx.fill();
  }

  // --- Main shrine body (red pillars, on platform) ---
  for(const px of [sX-38, sX+24]){
    ctx.fillStyle='#8a1010';
    ctx.fillRect(px*rise+(1-rise)*sX, roofBot, 14*rise, floorY-roofBot);
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
    for(let g=0;g<3;g++){
      const gy = roofBot+(floorY-roofBot)*g/3;
      ctx.beginPath(); ctx.moveTo(px*rise+(1-rise)*sX, gy);
      ctx.lineTo(px*rise+(1-rise)*sX+14*rise, gy); ctx.stroke();
    }
  }

  // --- UPPER MOUTH / TEETH (high up, attached under roof) ---
  const upperMouthY = roofBot - 10*rise;   // hangs under roof
  const lowerMouthY = floorY;              // bottom teeth touch the platform floor
  const mouthW = 88*rise;

  // Upper gums
  ctx.fillStyle='rgba(210,80,100,0.92)';
  ctx.beginPath();
  ctx.ellipse(sX, upperMouthY, mouthW*0.5, 22*rise, 0, Math.PI, 0);
  ctx.fill();
  // Upper teeth
  ctx.fillStyle='rgba(240,235,225,0.97)';
  const toothCount = 8;
  for(let i=0;i<toothCount;i++){
    const tx = sX - mouthW*0.44 + (i+0.5)*(mouthW*0.88/toothCount);
    const tw = mouthW*0.88/toothCount*0.72;
    const th = 30*rise * (i===0||i===toothCount-1 ? 0.55 : 1);
    ctx.beginPath();
    ctx.moveTo(tx-tw/2, upperMouthY);
    ctx.lineTo(tx-tw/2+2, upperMouthY+th);
    ctx.lineTo(tx+tw/2-2, upperMouthY+th);
    ctx.lineTo(tx+tw/2, upperMouthY);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(180,170,155,0.4)'; ctx.lineWidth=0.8; ctx.stroke();
  }

  // Inner glow between teeth sets (cyan like the anime)
  const innerGlow = ctx.createLinearGradient(0, upperMouthY+30*rise, 0, lowerMouthY-30*rise);
  innerGlow.addColorStop(0,'rgba(60,200,210,0.7)');
  innerGlow.addColorStop(0.5,'rgba(40,180,200,0.4)');
  innerGlow.addColorStop(1,'rgba(60,200,210,0.7)');
  ctx.fillStyle=innerGlow;
  ctx.fillRect(sX-mouthW*0.45, upperMouthY+28*rise, mouthW*0.9, lowerMouthY-upperMouthY-58*rise);

  // Lower gums — touching the floor
  ctx.fillStyle='rgba(210,80,100,0.92)';
  ctx.beginPath();
  ctx.ellipse(sX, lowerMouthY, mouthW*0.5, 22*rise, 0, 0, Math.PI);
  ctx.fill();
  // Lower teeth pointing UP from floor
  ctx.fillStyle='rgba(240,235,225,0.97)';
  for(let i=0;i<toothCount-1;i++){
    const tx = sX - mouthW*0.38 + (i+0.5)*(mouthW*0.76/(toothCount-1));
    const tw = mouthW*0.76/(toothCount-1)*0.68;
    const th = 26*rise * (i===0||i===toothCount-2 ? 0.5 : 1);
    ctx.beginPath();
    ctx.moveTo(tx-tw/2, lowerMouthY);
    ctx.lineTo(tx-tw/2+1.5, lowerMouthY-th);
    ctx.lineTo(tx+tw/2-1.5, lowerMouthY-th);
    ctx.lineTo(tx+tw/2, lowerMouthY);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(180,170,155,0.4)'; ctx.lineWidth=0.8; ctx.stroke();
  }

  // --- Roof (dark tiled Japanese-style) ---
  ctx.fillStyle='#2a2838';
  ctx.beginPath();
  ctx.moveTo(sX-92*rise, roofBot);
  ctx.lineTo(sX+92*rise, roofBot);
  ctx.lineTo(sX+75*rise, roofTop+25*rise);
  ctx.lineTo(sX, roofTop);
  ctx.lineTo(sX-75*rise, roofTop+25*rise);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(50,45,65,1)'; ctx.lineWidth=1.5;
  for(let row=0;row<6;row++){
    const ry = roofBot - (roofBot-roofTop)*row/6;
    const hw = 92*rise*(1-row*0.16);
    ctx.beginPath(); ctx.moveTo(sX-hw, ry); ctx.lineTo(sX+hw, ry); ctx.stroke();
  }
  ctx.fillStyle='#3d2a10';
  ctx.fillRect(sX-94*rise, roofBot-5*rise, 188*rise, 5*rise);

  // --- BLADE/CLAW spikes erupting from roof ---
  const bladeColor = '#7ab8c8';
  const bladePositions = [
    {x:sX,         y:roofTop,         h:72, ang:0},
    {x:sX-36*rise, y:roofTop+16*rise, h:55, ang:-0.28},
    {x:sX+36*rise, y:roofTop+16*rise, h:55, ang:0.28},
    {x:sX-64*rise, y:roofBot-28*rise, h:42, ang:-0.5},
    {x:sX+64*rise, y:roofBot-28*rise, h:42, ang:0.5},
    {x:sX-82*rise, y:roofBot-8*rise,  h:28, ang:-0.72},
    {x:sX+82*rise, y:roofBot-8*rise,  h:28, ang:0.72},
    {x:sX-50*rise, y:roofTop+38*rise, h:35, ang:-0.18},
    {x:sX+50*rise, y:roofTop+38*rise, h:35, ang:0.18},
  ];
  for(const b of bladePositions){
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    const bh = b.h * rise;
    const bw = bh * 0.22;
    ctx.fillStyle = bladeColor;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-bw*1.5, -bh*0.5, -bw*0.3, -bh);
    ctx.quadraticCurveTo(bw*0.3, -bh*0.7, bw*0.5, -bh*0.3);
    ctx.quadraticCurveTo(bw*0.8, 0, 0, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(180,220,235,0.5)';
    ctx.beginPath();
    ctx.moveTo(-bw*0.1, -bh*0.1);
    ctx.quadraticCurveTo(-bw*0.8, -bh*0.5, -bw*0.2, -bh*0.85);
    ctx.quadraticCurveTo(0, -bh*0.6, bw*0.1, -bh*0.2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // --- Skull on roof peak ---
  ctx.fillStyle='rgba(220,215,200,0.9)';
  ctx.beginPath(); ctx.ellipse(sX, roofTop-10*rise, 10*rise, 9*rise, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sX, roofTop-3*rise, 6*rise, 4*rise, 0, 0, Math.PI); ctx.fill();

  // --- Eerie glow ---
  ctx.globalAlpha = rise*0.22*fade*(0.6+0.4*Math.sin(t*0.002));
  const shrGlow = ctx.createRadialGradient(sX, floorY-80*rise, 10, sX, floorY-80*rise, 130*rise);
  shrGlow.addColorStop(0,'rgba(100,40,200,0.4)');
  shrGlow.addColorStop(1,'rgba(100,40,200,0)');
  ctx.fillStyle=shrGlow;
  ctx.fillRect(sX-140*rise, floorY-220*rise, 280*rise, 220*rise);

  // Domain timer bar
  ctx.globalAlpha = fade;
  const barW=200, barH=5, barX=cx-barW/2, barY=8;
  const timerPct = d.timer/DOMAIN_DURATION;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle=`hsl(${20+timerPct*20},100%,50%)`;
  ctx.fillRect(barX,barY,barW*timerPct,barH);
  ctx.strokeStyle='rgba(200,100,0,0.4)'; ctx.lineWidth=1; ctx.strokeRect(barX,barY,barW,barH);
  ctx.fillStyle='rgba(200,150,100,0.85)'; ctx.font=`700 8px 'Rajdhani',sans-serif`;
  ctx.textAlign='center'; ctx.fillText('MALEVOLENT SHRINE', cx, barY+16);

  ctx.restore();
  ctx.globalAlpha=1;
}

const DISMANTLE_RANGE     = 2 * BLOCK;  // very close — nearly touching
const DISMANTLE_SLASH_N   = 6;      // number of slash marks
const DISMANTLE_SLASH_INT = 130;    // ms between slash marks
const DISMANTLE_DELAY     = 1000;   // ms before first slash mark appears
const DISMANTLE_CAST      = DISMANTLE_DELAY + DISMANTLE_SLASH_N * DISMANTLE_SLASH_INT + 200; // arm stays raised through all slashes
const DISMANTLE_STUN      = DISMANTLE_CAST + 100; // enemy stunned for full cast duration
const DISMANTLE_SLASH_DMG = 5;      // 5 × 6 = 30 total damage
const DISMANTLE_COOLDOWN  = 5000;

// Slash marks (body hits for Dismantle)
const slashMarks = [];
function addSlashMark(x, y, angle, domain=false){
  slashMarks.push({ x, y, angle, life: 1, domain: !!domain });
}
function tickSlashMarks(dt){
  for(let i=slashMarks.length-1;i>=0;i--){
    slashMarks[i].life -= dt * (slashMarks[i].domain ? 0.0015 : 0.0022);
    if(slashMarks[i].life <= 0) slashMarks.splice(i,1);
  }
}
function drawSlashMarks(){
  for(const m of slashMarks){
    ctx.save();
    if(m.domain){
      // Full arena-height slash with curved, swept ends
      ctx.globalAlpha = m.life * 0.9;
      ctx.save();
      ctx.translate(m.x, H/2);
      ctx.rotate(m.angle);

      const slashH = H * 1.15;
      const curlAmt = 18 + Math.abs(m.x - W/2) * 0.04; // more curl near edges

      // Main slash stroke — curves inward at top and bottom
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.8 * m.life;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-curlAmt, -slashH/2);          // top tip curves left
      ctx.bezierCurveTo(
        -curlAmt*0.3, -slashH*0.25,             // ease out
         curlAmt*0.3,  slashH*0.25,             // ease in
         curlAmt,      slashH/2                 // bottom tip curves right
      );
      ctx.stroke();

      // Bright core streak (thinner, brighter)
      ctx.strokeStyle = `rgba(255,255,255,${m.life * 0.6})`;
      ctx.lineWidth = 1.2 * m.life;
      ctx.beginPath();
      ctx.moveTo(-curlAmt*0.5 - 3, -slashH/2 + 10);
      ctx.bezierCurveTo(
        -curlAmt*0.1 - 3, -slashH*0.2,
         curlAmt*0.1 - 3,  slashH*0.2,
         curlAmt*0.5 - 3,  slashH/2 - 10
      );
      ctx.stroke();

      // Faint glow echo
      ctx.strokeStyle = `rgba(200,220,255,${m.life * 0.18})`;
      ctx.lineWidth = 8 * m.life;
      ctx.beginPath();
      ctx.moveTo(-curlAmt, -slashH/2);
      ctx.bezierCurveTo(-curlAmt*0.3, -slashH*0.25, curlAmt*0.3, slashH*0.25, curlAmt, slashH/2);
      ctx.stroke();

      ctx.restore();
    } else {
      // Normal short slash mark (dismantle etc.)
      ctx.globalAlpha = m.life;
      ctx.translate(m.x, m.y);
      ctx.rotate(m.angle);
      const len = 30 + (1 - m.life) * 10;
      const curl = 7;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.2 * m.life;
      ctx.beginPath();
      ctx.moveTo(-len/2, 0);
      ctx.bezierCurveTo(-len/4, -curl, len/4, -curl, len/2, 0);
      ctx.stroke();
      ctx.globalAlpha = m.life * 0.35;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-len/2 + 2, -4);
      ctx.bezierCurveTo(-len/4 + 2, -curl - 4, len/4 + 2, -curl - 4, len/2 + 2, -4);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

// Scheduled dismantle events
const dismantleEvents = [];
function scheduleDismantleSlashes(target, caster){
  for(let i=0;i<DISMANTLE_SLASH_N;i++){
    dismantleEvents.push({
      delay: DISMANTLE_DELAY + i * DISMANTLE_SLASH_INT,
      target, caster,
      fired: false
    });
  }
}
function tickDismantleEvents(dt){
  for(let i=dismantleEvents.length-1;i>=0;i--){
    const e = dismantleEvents[i];
    e.delay -= dt;
    if(e.delay <= 0 && !e.fired){
      e.fired = true;
      if(e.target.state !== S.DEAD){
        // random position on body
        const bx = e.target.x + 4 + Math.random() * (PW - 8);
        const by = e.target.y + 6 + Math.random() * (PH - 12);
        const angle = (Math.random() - 0.5) * Math.PI * 0.7;
        addSlashMark(bx, by, angle);
        addParts(bx, by, '#ddd', 4, 2);
        e.target.hp = Math.max(0, e.target.hp - DISMANTLE_SLASH_DMG);
        e.target.flash = 120;
        addDmg(bx, by - 10, DISMANTLE_SLASH_DMG, '#eee');
        doShake(3);
        // Charge caster's fuga
        if(e.caster && e.caster.type==='sukuna')
          e.caster.fugaCharge = Math.min(FUGA_CHARGE_REQ, e.caster.fugaCharge + DISMANTLE_SLASH_DMG);
        if(e.caster) e.caster.domainCharge = Math.min(DOMAIN_CHARGE_REQ, e.caster.domainCharge + DISMANTLE_SLASH_DMG);
        if(e.target.hp <= 0){
          e.target._initRd(0, -3, 0.06);
          e.target.ss(S.DEAD);
        }
      }
      dismantleEvents.splice(i,1);
    }
  }
}

// Cleave projectiles
const cleaves = [];
const CLEAVE_WINDUP   = 520;   // ms before slice fires
const CLEAVE_SPEED    = 42;
const CLEAVE_DMG      = 18;
const CLEAVE_COOLDOWN = 3500;
const AIR_CLEAVE_AIM  = 1000;  // ms to aim during air variant
const AIR_CLEAVE_AIM_SPEED = Math.PI / 1400; // rad per ms when holding key
function addCleave(x, y, dir, owner, angle=0){
  const spd = CLEAVE_SPEED;
  cleaves.push({ x, y, dir, owner, w: 90, h: 14, life: 1, hit: false,
                 angle,
                 vx: Math.cos(angle) * spd * dir,
                 vy: Math.sin(angle) * spd });
}

// Giant cleave for Yuji's ultimate
const giantCleaves = [];
function addGiantCleave(x, y, dir, owner){
  giantCleaves.push({ x, y, dir, owner, life:1, hit:false,
    vx: dir * CLEAVE_SPEED * 1.15, vy: 0 });
}
function tickGiantCleaves(dt, p1, p2){
  for(let i=giantCleaves.length-1;i>=0;i--){
    const c=giantCleaves[i];
    const f=dt/16.67;
    c.x += c.vx * f; c.y += c.vy * f;
    if(!c.hit){
      const def = c.owner===p1 ? p2 : p1;
      if(def.hittable){
        const db=def.bodyBox();
        const S2=90*YUJI_ULT_CLEAVE_W;
        const cb={x:c.x-S2*0.6,y:c.y-S2*0.6,w:S2*1.2,h:S2*1.2};
        if(overlaps(cb,db)){
          c.hit=true;
          const mx=def.x+PW/2,my=def.y+PH/2;
          def.hp=Math.max(0,def.hp-YUJI_ULT_CLEAVE_DMG); def.flash=350;
          addParts(mx,my,'#fff',18,7); addRing(mx,my,'#fff',90);
          addDmg(mx,def.y-22,YUJI_ULT_CLEAVE_DMG,'#eee'); doShake(14);
          c.owner.domainCharge=Math.min(DOMAIN_CHARGE_REQ,c.owner.domainCharge+YUJI_ULT_CLEAVE_DMG);
          if(def.hp<=0){ def._initRd(c.dir*12,-9,.16*c.dir); def.ss(S.DEAD); }
          else { def._initRd(c.dir*11,-7,.13*c.dir); def.ss(S.RAGD,RAGD_MS*1.5); }
        }
      }
    }
    c.life -= dt*0.0012;
    if(c.x<-300||c.x>W+300||c.life<=0) giantCleaves.splice(i,1);
  }
}
function drawGiantCleaves(){
  const scale = YUJI_ULT_CLEAVE_W;
  for(const c of giantCleaves){
    ctx.save();
    ctx.globalAlpha = Math.min(1, c.life * 1.8);
    ctx.translate(c.x, c.y);
    ctx.scale(scale, scale);

    const d=c.dir;
    const cx2=-d*28, cy2=14;
    const Rmid=42, halfThickMax=3.43, halfThickTip=1;
    const aMid=d===1?0:Math.PI, aSpan=Math.PI/2, STEPS=48;
    const outerPts=[], innerPts=[];
    for(let i=0;i<=STEPS;i++){
      const t=i/STEPS, a=(aMid-aSpan)+t*aSpan*2;
      const env=Math.sin(t*Math.PI);
      const thick=halfThickTip+(halfThickMax-halfThickTip)*env;
      outerPts.push([cx2+Math.cos(a)*(Rmid+thick), cy2+Math.sin(a)*(Rmid+thick)]);
      innerPts.push([cx2+Math.cos(a)*(Rmid-thick), cy2+Math.sin(a)*(Rmid-thick)]);
    }
    ctx.beginPath();
    ctx.moveTo(outerPts[0][0],outerPts[0][1]);
    for(let i=1;i<=STEPS;i++) ctx.lineTo(outerPts[i][0],outerPts[i][1]);
    for(let i=STEPS;i>=0;i--) ctx.lineTo(innerPts[i][0],innerPts[i][1]);
    ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,1)'; ctx.fill();
    // Thick glow
    ctx.shadowColor='#fff'; ctx.shadowBlur=18/scale;
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.5/scale; ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
    ctx.globalAlpha=1;
  }
}
function tickCleaves(dt){
  for(let i=cleaves.length-1;i>=0;i--){
    const c=cleaves[i];
    const f=dt/16.67;
    c.x += c.vx * f;
    c.y += c.vy * f;
    if(c.x<-180||c.x>W+180||c.y<-180||c.y>H+180) cleaves.splice(i,1);
  }
}
function drawCleaves(){
  for(const c of cleaves){
    ctx.save();
    ctx.globalAlpha = 1;

    const d = c.dir;
    // Translate to the cleave centre, rotate by angle, then draw in local space
    ctx.translate(c.x, c.y);
    ctx.rotate(c.angle);

    const cx2 = -d * 28;
    const cy2 = 14;
    const Rmid = 42;
    const halfThickMax = 3.43;
    const halfThickTip = 1;

    const aMid   = d===1 ? 0 : Math.PI;
    const aSpan  = Math.PI / 2;
    const STEPS  = 48;

    const outerPts = [];
    const innerPts = [];
    for(let i=0;i<=STEPS;i++){
      const t  = i/STEPS;
      const a  = (aMid - aSpan) + t * aSpan*2;
      const env = Math.sin(t * Math.PI);
      const thick = halfThickTip + (halfThickMax - halfThickTip) * env;
      const rOut = Rmid + thick;
      const rIn  = Rmid - thick;
      outerPts.push([cx2 + Math.cos(a)*rOut, cy2 + Math.sin(a)*rOut]);
      innerPts.push([cx2 + Math.cos(a)*rIn,  cy2 + Math.sin(a)*rIn]);
    }

    ctx.beginPath();
    ctx.moveTo(outerPts[0][0], outerPts[0][1]);
    for(let i=1;i<=STEPS;i++) ctx.lineTo(outerPts[i][0], outerPts[i][1]);
    for(let i=STEPS;i>=0;i--) ctx.lineTo(innerPts[i][0], innerPts[i][1]);
    ctx.closePath();

    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,1)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Motion trail
    for(let t=1;t<=2;t++){
      ctx.globalAlpha = 0.12 - t*0.04;
      ctx.beginPath();
      for(let i=0;i<=STEPS;i++){
        const a   = (aMid - aSpan) + (i/STEPS)*aSpan*2;
        const env = Math.sin((i/STEPS)*Math.PI);
        const rT  = Rmid - t*5 + (halfThickMax*0.5)*env;
        const px  = cx2 - d*t*10 + Math.cos(a)*rT;
        const py  = cy2 + t*2   + Math.sin(a)*rT;
        i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.strokeStyle='rgba(255,255,255,1)';
      ctx.lineWidth = 2.5 - t*0.8;
      ctx.stroke();
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

let shakeMag = 0;
const doShake = s => { shakeMag = Math.max(shakeMag, s); };

// ── BLACK FLASH EFFECT ─────────────────────────────────────
const blackFlashes = [];
function addBlackFlash(x, y){
  // Each flash stores fixed branch geometry so it doesn't shimmer randomly every frame
  const branches = [];
  for(let i=0;i<18;i++){
    const ang = Math.random()*Math.PI*2;
    const len = 55 + Math.random()*110;
    const segs = [];
    let cx2=0, cy2=0;
    for(let s=0;s<6;s++){
      const t=(s+1)/6;
      cx2 = Math.cos(ang)*len*t + (Math.random()-0.5)*28;
      cy2 = Math.sin(ang)*len*t + (Math.random()-0.5)*28;
      segs.push({x:cx2,y:cy2});
    }
    branches.push({ang, len, segs, thick:1.5+Math.random()*3.5, dark:Math.random()<0.5});
  }
  // Sub-branches
  const subBranches = [];
  for(let i=0;i<12;i++){
    const ang=Math.random()*Math.PI*2;
    const len=25+Math.random()*55;
    subBranches.push({ang,len,segs:[
      {x:Math.cos(ang)*len*0.4+(Math.random()-0.5)*10, y:Math.sin(ang)*len*0.4+(Math.random()-0.5)*10},
      {x:Math.cos(ang)*len+(Math.random()-0.5)*18,     y:Math.sin(ang)*len+(Math.random()-0.5)*18}
    ]});
  }
  blackFlashes.push({ x, y, life:1, branches, subBranches });
  blackFlashes._screenFlash = 800;
}
blackFlashes._screenFlash = 0;
function tickBlackFlashes(dt){
  if(blackFlashes._screenFlash>0) blackFlashes._screenFlash=Math.max(0,blackFlashes._screenFlash-dt);
  for(let i=blackFlashes.length-1;i>=0;i--){
    blackFlashes[i].life -= dt*0.00115; // slow decay — lingers longer
    if(blackFlashes[i].life<=0) blackFlashes.splice(i,1);
  }
}
function drawBlackFlashes(){
  for(const b of blackFlashes){
    ctx.save();
    ctx.translate(b.x, b.y);
    const a = b.life;

    // Huge dark red/black outer glow — fills the surrounding area
    ctx.globalAlpha = a * 0.65;
    const outerGlow = ctx.createRadialGradient(0,0,0, 0,0,130);
    outerGlow.addColorStop(0,  'rgba(140,0,0,0.9)');
    outerGlow.addColorStop(0.3,'rgba(80,0,0,0.7)');
    outerGlow.addColorStop(0.6,'rgba(30,0,0,0.4)');
    outerGlow.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle=outerGlow;
    ctx.beginPath(); ctx.arc(0,0,130,0,Math.PI*2); ctx.fill();

    // Primary jagged BLACK branches (thick, like cursed energy tendrils)
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(const br of b.branches){
      ctx.globalAlpha = a * (br.dark ? 0.95 : 0.75);
      ctx.strokeStyle = br.dark ? '#000' : '#1a0000';
      ctx.lineWidth = br.thick * a * 1.2;
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const seg of br.segs) ctx.lineTo(seg.x, seg.y);
      ctx.stroke();
      // Red outline along each branch for depth
      ctx.globalAlpha = a * 0.35;
      ctx.strokeStyle = '#cc0000';
      ctx.lineWidth = (br.thick * a * 0.4);
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const seg of br.segs) ctx.lineTo(seg.x, seg.y);
      ctx.stroke();
    }

    // Sub-branches (thinner, more chaotic)
    for(const sb of b.subBranches){
      ctx.globalAlpha = a * 0.7;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5*a;
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const seg of sb.segs) ctx.lineTo(seg.x,seg.y);
      ctx.stroke();
    }

    // Dark black void core — flat black circle punched into center
    ctx.globalAlpha = a * 0.95;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fill();

    // Deep red ring around the void core
    ctx.globalAlpha = a * 0.9;
    ctx.strokeStyle = '#cc0000';
    ctx.lineWidth = 4*a;
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#ff2200';
    ctx.lineWidth = 1.5*a;
    ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.stroke();

    // Bright white-red flash at the very center
    ctx.globalAlpha = a * 0.85;
    const core = ctx.createRadialGradient(0,0,0, 0,0,12);
    core.addColorStop(0,  'rgba(255,255,255,1)');
    core.addColorStop(0.3,'rgba(255,80,0,0.9)');
    core.addColorStop(0.7,'rgba(200,0,0,0.4)');
    core.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle=core;
    ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // Full-screen dark flash — bright red, sudden and erratic
  if(blackFlashes._screenFlash>0){
    const prog=blackFlashes._screenFlash/800;
    // Sudden harsh cutoff: bright for first 40%, then abrupt drop
    const alpha = prog > 0.6
      ? Math.pow((prog-0.6)/0.4, 0.3) * 1.0   // spike hard at start
      : prog > 0.2
      ? 0.9 + Math.sin(Date.now()*0.05)*0.1     // erratic flicker mid
      : prog/0.2 * 0.5;                          // fade out
    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha);
    // Flat full-screen intense red
    ctx.fillStyle='#440000';
    ctx.fillRect(0,0,W,H);
    // Bright center bloom
    ctx.globalAlpha = Math.min(1, alpha*0.6);
    const sg = ctx.createRadialGradient(W/2,H/2,0, W/2,H/2,W*0.55);
    sg.addColorStop(0,  'rgba(160,0,0,1)');
    sg.addColorStop(0.3,'rgba(100,0,0,0.7)');
    sg.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle=sg;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// Particles
const parts = [];
function addParts(x,y,col,n,pwr){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(.4+Math.random())*pwr;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:1,decay:.026+Math.random()*.024,r:1.5+Math.random()*2.5,col});
  }
}
function tickParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.13; p.life-=p.decay;
    if(p.life<=0) parts.splice(i,1);
  }
}
function drawParts(){
  for(const p of parts){ ctx.globalAlpha=p.life*.9; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
}

// Rings
const rings=[];
function addRing(x,y,col,maxR){ rings.push({x,y,col,r:4,maxR,life:1}); }
function tickRings(){
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.r+=(r.maxR-r.r)*.18; r.life-=.042;
    if(r.life<=0) rings.splice(i,1);
  }
}
function drawRings(){
  for(const r of rings){ ctx.globalAlpha=r.life*.6; ctx.strokeStyle=r.col; ctx.lineWidth=3*r.life; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.lineWidth=1;
}

const dmgNums=[];
function addDmg(x,y,val,col){ dmgNums.push({x,y,vy:-2,val,col,life:1}); }
function tickDmgNums(){

}

// ── PLAYER ─────────────────────────────────────────────────
class Player {
  constructor(cfg){
    this.name   = cfg.name;
    this.type   = cfg.type;
    this.startX = cfg.x;
    this.startF = cfg.facing;
    this.ctrl   = cfg.ctrl;
    this.charColor    = cfg.charColor    || '#ff6666';
    this.charDimColor = cfg.charDimColor || '#dd3333';
    this.playerNum    = cfg.playerNum    || 1;
    // Ability keys derived from player number, not character type
    // P1: 1=ab1, 2=ab2, 3=ab3, Q=domain/ult
    // P2: ,=ab1, .=ab2, /=ab3, '=domain/ult
    this.ab1Key  = this.playerNum===1 ? 'Digit1'    : 'Comma';
    this.ab2Key  = this.playerNum===1 ? 'Digit2'    : 'Period';
    this.ab3Key  = this.playerNum===1 ? 'Digit3'    : 'Slash';
    this.domainKey = this.playerNum===1 ? 'KeyQ'    : 'Quote';
    // Legacy aliases for code that still uses these names
    this.abilityUseKey   = this.ab1Key;
    this.abilityCycleKey = this.ab2Key;
    this._init();
  }

  _init(){
    this.x = this.startX; this.y = GND-PH;
    this.vx=0; this.vy=0;
    this.facing = this.startF;
    this.hp=100; this.maxHp=100;
    this.state=S.IDLE; this.sTimer=0; this.sDur=0;
    this.atkPhase=0; this.atkTimer=0; this.atkHit=false; this.atkAnim=0;
    this.combo=0; this.comboTimer=0;
    this.onGround=true;
    this.atkDown=false; this.jmpDown=false;
    this.rdX=this.startX; this.rdY=GND-PH;
    this.rdVx=0; this.rdVy=0; this.rdRot=0; this.rdAngV=0;
    this.flash=0; this.walkT=0; this.diveVy=0;
    // Cleave
    this.cleaveDown=false; this.cleaveTimer=0; this.cleaveWindup=0;
    this.cleaveCooldown=0; this.cleaveArm=0;
    this.cleaveAir=false; this.cleaveAimAngle=0; this.cleaveAimTime=0;
    // Dismantle
    this.dismantleDown=false; this.dismantleCooldown=0;
    this.dismantleOutline=0;
    this.dismantleArm=0;
    // Fuga
    this.fugaWindup=0; this.fugaArm=0; this.fugaCooldown=0;
    // Ability system
    this.selectedAbility = 0;
    this.abilityDown=false; this.nextAbilityDown=false;
    this.ab1Down=false; this.ab2Down=false; this.ab3Down=false; this.domDown=false;
    this.fugaCharge=0;
    // Gojo abilities
    this.lapseDown=false; this.lapseCooldown=0;
    this.reversalCooldown=0; this.reversalWindup=0; this.reversalArm=0;
    this.reversalAir=false; this.reversalAimAngle=0; this.reversalAimTime=0;
    this.gojoAbility=0;
    this.nextGojoAbilityDown=false;
    this.hollowCharge=0; // initialized for all characters (needed for orb explosions)
    this.hollowWindup=0; this.hollowArm=0;
    // Domain
    if(this.domainCharge===undefined) this.domainCharge=0; // persists across rounds
    if(this.yujiUltCharge===undefined) this.yujiUltCharge=0; // persists across rounds
    this.yujiUltCooldown=0;
    // Yuta Slice & Dice
    this.yutaSliceCooldown=0; this.yutaSliceIdx=0; this.yutaSliceTimer=0;
    this.yutaSliceAnim=0; this.yutaSliceHits=[]; this.yutaComboTarget=null;
    this.yutaFistCooldown=0; this.yutaFistPhase=0; this.yutaFistTimer=0;
    this.yutaFistAimX=0; this.yutaFistY=0; this.yutaFistGlowAnim=0;
    this.yutaFistDown=false; this.yutaSwordVisible=true;
    if(this.yutaCopyUltCharge===undefined) this.yutaCopyUltCharge=0; // persists
    this.yutaCopiedUlt=null;
    this.yutaDomainDown=false;
    this.jacobLadderCharge=0;  // 0-4, charges from katana grabs
    this.hasKatana=false;       // currently holding a grabbed katana
    this.jacobReady=false;      // Jacob's Ladder fully charged and ready
    // Rika Combo
    this.domainDown=false;
    this.domainHandsign=0;
    this.gojoDomainDown=false;
    // Yuji Black Flash minigame
    this.bfActive=false; this.bfLinePos=0; this.bfLineDir=1;
    this.bfTimer=0; this.bfGoalPos=0;
    this.bfWon=false; this.bfWindowTimer=0;
    this.bfStunnedEnemy=null; this.bfAtkDown=false;
    // Yuji Black Blur
    this.bbCooldown=0; this.bbPhase=0; this.bbTimer=0; this.bbAnimProg=0;
    // Yuji Ultimate
    this.yujiUltCooldown=0;
    this.yujiUltPhase=0; this.yujiUltTimer=0; this.yujiUltCleavesFired=0;
    this.yujiUltDown=false;
    this.bbTarget=null; this.bbHitTarget=false;
    this.bbGotBF=false; this.bbStartX=0;
    // Yuji Piercing Blood
    this.pbChargeTime=0; this.pbCooldown=0; this.pbDown=false;
  }

  reset(){ this._init(); }

  get hittable(){ return ![S.RAGD,S.SLAM,S.DEAD].includes(this.state); }
  get hitboxOn(){ return (this.state===S.ATCK&&this.atkPhase===1)||this.state===S.DIVE; }

  atkBox(){
    if(this.state===S.ATCK){ const hx=this.facing===1?this.x+PW:this.x-ATK_RANGE; return{x:hx,y:this.y+4,w:ATK_RANGE,h:PH-8}; }
    if(this.state===S.DIVE) return{x:this.x-22,y:this.y+PH-28,w:PW+44,h:32};
    return null;
  }
  bodyBox(){ return{x:this.x,y:this.y,w:PW,h:PH}; }
  ss(s,dur=0){ this.state=s; this.sTimer=0; this.sDur=dur; }

  update(dt,other){
    const c=this.ctrl;
    this.sTimer+=dt; this.comboTimer+=dt; this.flash=Math.max(0,this.flash-dt);
    if(this.cleaveCooldown>0) this.cleaveCooldown=Math.max(0,this.cleaveCooldown-dt);
    if(this.dismantleCooldown>0) this.dismantleCooldown=Math.max(0,this.dismantleCooldown-dt);
    if(this.dismantleOutline>0) this.dismantleOutline=Math.max(0,this.dismantleOutline-dt);

    // ── ABILITY SYSTEM (player-number keyed, not character keyed) ──
    const ab1Key = this.ab1Key;
    const ab2Key = this.ab2Key;
    const ab3Key = this.ab3Key;
    const domKey = this.domainKey;

    // Edge detectors for ability keys
    const ab1Edge = keys[ab1Key] && !this.ab1Down;
    const ab2Edge = keys[ab2Key] && !this.ab2Down;
    const ab3Edge = keys[ab3Key] && !this.ab3Down;
    const domEdge = keys[domKey] && !this.domDown;
    if(!keys[ab1Key]) this.ab1Down=false; else this.ab1Down=true;
    if(!keys[ab2Key]) this.ab2Down=false; else this.ab2Down=true;
    if(!keys[ab3Key]) this.ab3Down=false; else this.ab3Down=true;
    if(!keys[domKey]) this.domDown=false;  else this.domDown=true;

    const abilityBlocked = [S.STUN,S.RAGD,S.SLAM,S.DEAD].includes(this.state);

    // ── YUJI: 1=Piercing Blood(hold), 2=Black Blur, Q=Dismantle Ult ──
    if(this.type==='yuji'){
      if(this.pbCooldown>0) this.pbCooldown=Math.max(0,this.pbCooldown-dt);
      if(this.bbCooldown>0) this.bbCooldown=Math.max(0,this.bbCooldown-dt);
      if(this.yujiUltCooldown>0) this.yujiUltCooldown=Math.max(0,this.yujiUltCooldown-dt);
      // 1 = Piercing Blood (hold)
      const pbKey = keys[ab1Key];
      const canCharge = !abilityBlocked && ![S.BLACKFLASH,S.BLACKBLUR,S.YUJIULT].includes(this.state) && this.pbCooldown<=0;
      if(pbKey && canCharge){
        this.pbChargeTime = Math.min(PB_CHARGE_MAX, this.pbChargeTime + dt);
        this.vx = 0;
      } else if(!pbKey && this.pbChargeTime > 0 && canCharge){
        const dmg = this.pbChargeTime >= 2000 ? PB_DMG_3 : this.pbChargeTime >= 1000 ? PB_DMG_2 : PB_DMG_1;
        const sx = this.x + (this.facing===1 ? PW+4 : -4);
        const sy = this.y + PH*0.32;
        addPiercingBeam(sx, sy, this.facing, this, dmg);
        addParts(sx, sy, '#8b0000', 8, 4); doShake(4);
        this.pbCooldown = PB_COOLDOWN; this.pbChargeTime = 0;
      }
      // 2 = Black Blur
      if(ab2Edge && this.bbCooldown<=0 && !abilityBlocked && ![S.BLACKFLASH,S.BLACKBLUR,S.YUJIULT].includes(this.state)){
        this._startBlackBlur(other);
      }
      // Q = Dismantle Ult
      if(domEdge && this.yujiUltCharge>=YUJI_ULT_COST && this.yujiUltCooldown<=0 && !abilityBlocked && ![S.BLACKFLASH,S.BLACKBLUR,S.YUJIULT].includes(this.state)){
        this._startYujiUlt();
      }
    }

    // ── YUTA: 1=Slice&Dice, 2=Cursed Fist, 3=Copy, Q=Domain/Jacob's Ladder ──
    if(this.type==='yuta'){
      if(this.yutaSliceCooldown>0) this.yutaSliceCooldown=Math.max(0,this.yutaSliceCooldown-dt);
      if(this.yutaFistCooldown>0) this.yutaFistCooldown=Math.max(0,this.yutaFistCooldown-dt);
      // 1 = Slice & Dice
      if(ab1Edge && this.yutaSliceCooldown<=0 && !abilityBlocked && ![S.YUTASLICE,S.YUTAFIST].includes(this.state)){
        this._startYutaSlice();
      }
      // 2 = Cursed Fist
      if(ab2Edge && this.yutaFistCooldown<=0 && !abilityBlocked && ![S.YUTASLICE,S.YUTAFIST].includes(this.state)){
        this._startYutaFist();
      }
      // Launch during Cursed Fist aim
      if(this.state===S.YUTAFIST && this.yutaFistPhase===1 && ab1Edge){
        this.yutaFistPhase=2; this.yutaFistTimer=0;
      }
      // 3 = Copy touch (if charged) or use copied ult
      if(ab3Edge && !abilityBlocked && ![S.YUTASLICE,S.YUTAFIST].includes(this.state)){
        if(this.yutaCopiedUlt){
          this._fireYutaCopiedUlt(other);
        } else if(this.yutaCopyUltCharge>=YUTA_COPY_ULT_REQ){
          this._startYutaCopyTouch(other);
        }
      }
      // Q = Domain or Jacob's Ladder
      if(domEdge && !abilityBlocked && ![S.YUTASLICE,S.YUTAFIST,S.DOMAIN].includes(this.state)){
        const inDomain = activeDomain && activeDomain.owner===this && activeDomain.type==='love';
        if(inDomain && this.jacobReady){
          this._fireJacobLadder(other);
        } else if(!inDomain && this.domainCharge>=DOMAIN_CHARGE_REQ && !activeDomain){
          this._startDomain();
        }
      }
    }

    // ── Katana grab (Yuta in domain): SEPARATE from combat — uses atkEdge, checked BEFORE it triggers combat ──
    const inLoveDom = this.type==='yuta' && activeDomain && activeDomain.owner===this && activeDomain.type==='love';

    // ── SUKUNA: 1=Cleave, 2=Dismantle, 3=Fuga(charged), Q=Domain ──
    if(this.type==='sukuna'){
      if(this.cleaveCooldown>0)    this.cleaveCooldown=Math.max(0,this.cleaveCooldown-dt);
      if(this.dismantleCooldown>0) this.dismantleCooldown=Math.max(0,this.dismantleCooldown-dt);
      if(!abilityBlocked){
        if(ab1Edge && this.cleaveCooldown<=0)                           this._startCleave();
        if(ab2Edge && this.dismantleCooldown<=0)                        this._startDismantle(other);
        if(ab3Edge && this.fugaCharge>=FUGA_CHARGE_REQ)                 this._startFuga();
        if(domEdge && this.domainCharge>=DOMAIN_CHARGE_REQ && !activeDomain) this._startDomain();
      }
    }

    // ── GOJO: 1=Lapse Blue, 2=Reversal Red, 3=Hollow Purple(charged), Q=Domain ──
    if(this.type==='gojo'){
      if(this.lapseCooldown>0)    this.lapseCooldown=Math.max(0,this.lapseCooldown-dt);
      if(this.reversalCooldown>0) this.reversalCooldown=Math.max(0,this.reversalCooldown-dt);
      if(!abilityBlocked){
        if(ab1Edge && this.lapseCooldown<=0)                               this._startLapseBlue();
        if(ab2Edge && this.reversalCooldown<=0)                            this._startReversalRed();
        if(ab3Edge && this.hollowCharge>=HOLLOW_CHARGE_REQ)                this._startHollowPurple();
        if(domEdge && this.domainCharge>=DOMAIN_CHARGE_REQ && !activeDomain) this._startDomain();
      }
    }

    const atkEdge=keys[c.atk]&&!this.atkDown;
    const jmpEdge=keys[c.jmp]&&!this.jmpDown;
    if(!keys[c.atk]) this.atkDown=false; else this.atkDown=true;
    if(!keys[c.jmp]) this.jmpDown=false; else this.jmpDown=true;
    if(this.comboTimer>COMBO_RESET) this.combo=0;
    if(this.state===S.WALK) this.walkT+=dt*.012;

    // Katana grab (Yuta in domain): ab1 key, checked independently of punch
    // Uses ab1Edge which was already computed and consumed above for slice — but
    // inside the domain Slice is not useful, so we check ab1 directly here
    if(inLoveDom && atkEdge && !abilityBlocked){
      let grabbed = false;
      for(const k of activeDomain.katanas){
        if(!k.grabbed && Math.abs((this.x+PW/2)-k.x)<55 && this.onGround){
          k.grabbed=true;
          this.jacobLadderCharge=Math.min(JACOB_LADDER_REQ,this.jacobLadderCharge+1);
          if(this.jacobLadderCharge>=JACOB_LADDER_REQ) this.jacobReady=true;
          addParts(k.x,GND,'#cc88ff',10,5); addRing(k.x,GND,'#cc88ff',35); doShake(3);
          // Throw at enemy for small damage
          const def2=other;
          if(def2.hittable && Math.abs((def2.x+PW/2)-k.x)<200){
            def2.hp=Math.max(0,def2.hp-6); def2.flash=150;
            addDmg(def2.x+PW/2,def2.y-14,6,'#cc88ff');
            this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+6);
          }
          grabbed=true; break;
        }
      }
      // If grabbed, skip the normal punch this frame
      if(grabbed) { this.atkDown=true; }
    }
    switch(this.state){
      case S.IDLE: case S.WALK: case S.AIR:
        if(keys[c.left]){this.vx=-SPD;this.facing=-1;}
        else if(keys[c.right]){this.vx=SPD;this.facing=1;}
        else{this.vx*=.7; if(Math.abs(this.vx)<.15) this.vx=0;}
        if(jmpEdge&&this.onGround){this.vy=JUMP_V;this.onGround=false;this.jmpDown=true;}
        if(atkEdge){this.atkDown=true;this._doAttack();}
        this._phys(dt); break;
      case S.ATCK: this._tickAtk(dt,atkEdge); if(this.type==='yuji'||this.type==='sukuna'||this.type==='gojo'||this.type==='yuta') this.vx=0; this._phys(dt); break;
      case S.DIVE: this._tickDive(dt); break;
      case S.STUN: this.vx*=.82; this._phys(dt); if(this.sTimer>=this.sDur) this.ss(S.IDLE); break;
      case S.RAGD: case S.SLAM: this._rdPhys(dt); if(this.sTimer>=this.sDur) this._exitRd(); break;
      case S.DEAD: this._rdPhys(dt); break;
      case S.CLEAVE:
        this._tickCleave(dt,other);
        if(!this.cleaveAir) this._phys(dt);
        break;
      case S.DISMANTLE: this._tickDismantle(dt); this._phys(dt); break;
      case S.FUGA: this._tickFuga(dt); break;
      case S.LAPSE: this._tickLapseBlue(dt); this._phys(dt); break;
      case S.REVERSAL:
        this._tickReversalRed(dt);
        if(!this.reversalAir) this._phys(dt);
        break;
      case S.HOLLOW: this._tickHollowPurple(dt); break;
      case S.DOMAIN: this._tickDomain(dt); break;
      case S.BLACKFLASH: this._tickBlackFlash(dt, other); this._phys(dt); break;
      case S.BLACKBLUR:  this._tickBlackBlur(dt, other); break;
      case S.YUJIULT:    this._tickYujiUlt(dt, other); break;
      case S.YUTASLICE:  this._tickYutaSlice(dt, other); break;
      case S.YUTAFIST:   this._tickYutaFist(dt, other); break;
    }
  }

  _startDomain(){
    if([S.STUN,S.RAGD,S.SLAM,S.DEAD,S.DOMAIN].includes(this.state)) return;
    this.ss(S.DOMAIN);
    this.domainHandsign = 0;
    this.vx = 0;
  }

  _tickDomain(dt){
    if(this.state===S.STUN){ this.domainHandsign=0; return; }
    this.vx=0;
    if(this.onGround) this.vy=0;
    this.domainHandsign = Math.min(1, this.domainHandsign + dt/DOMAIN_HANDSIGN);
    if(this.domainHandsign >= 1 && !activeDomain){
      startDomain(this);
      doShake(12);
      domainFlash = 1200;
      this.domainCharge = 0;
      addRing(W/2, GND, '#8a3000', 120);
      this.ss(S.IDLE);
    }
  }

  _startHollowPurple(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.LAPSE,S.REVERSAL,S.HOLLOW].includes(this.state)) return;
    this.ss(S.HOLLOW);
    this.hollowWindup = HOLLOW_WINDUP;
    this.hollowArm = 0;
    this.vx = 0;
  }

  _tickHollowPurple(dt){
    if(this.state===S.STUN){ this.hollowArm=0; return; }
    this.vx = 0; this.vy += 0; // freeze in place
    if(this.onGround) this.vy = 0;
    this.hollowWindup -= dt;
    this.hollowArm = Math.max(0, 1 - this.hollowWindup/HOLLOW_WINDUP);
    if(this.hollowWindup <= 0){
      const sx = this.x + (this.facing===1 ? PW+HOLLOW_BALL_R : -HOLLOW_BALL_R);
      const sy = this.y + PH*0.3;
      addHollowShot(sx, sy, this.facing, this);
      addParts(sx, sy, '#c060ff', 16, 6);
      addRing(sx, sy, '#c060ff', 55);
      doShake(8);
      this.hollowArm = 0;
      this.hollowCharge = 0;
      this.ss(S.IDLE);
    }
  }

  _startReversalRed(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.LAPSE,S.REVERSAL].includes(this.state)) return;
    this.ss(S.REVERSAL);
    this.reversalWindup = REVERSAL_WINDUP; // full windup before fire
    this.reversalArm = 0;
    this.reversalAir = false;
    this.vx = 0;
  }

  _tickReversalRed(dt){
    if(this.state===S.STUN){ this.reversalArm=0; return; }
    this.vx = 0;
    if(this.onGround) this.vy = 0;
    this.reversalWindup -= dt;
    this.reversalArm = Math.min(1, 1 - this.reversalWindup/REVERSAL_WINDUP);
    if(this.reversalWindup <= 0 && this.reversalArm >= 0){
      // Fire!
      const ox = this.x + (this.facing===1 ? PW+6 : -6);
      const oy = this.y + PH * 0.38;
      addControllableRedOrb(ox, oy, this);
      addParts(ox, oy, '#f44', 8, 4);
      addRing(ox, oy, '#f44', 36);
      doShake(4);
      this.reversalCooldown = REVERSAL_COOLDOWN;
      this.reversalArm = 0;
      this.ss(this.onGround ? S.IDLE : S.AIR);
    }
  }

  _startLapseBlue(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD].includes(this.state)) return;

    // If a blue orb is already active, detonate it
    const existing = lapseOrbs.find(o => o.owner===this && o.controllable);
    if(existing){ existing.explode=true; return; }
    // Spawn controllable blue orb 10 blocks ahead, lock Gojo for full duration
    const ox = this.x + PW/2 + this.facing * ORB_SPAWN_DIST;
    const oy = this.y + PH * 0.38;
    addControllableBlueOrb(ox, Math.max(30, Math.min(GND, oy)), this);
    addParts(ox, oy, '#06f', 10, 4);
    addRing(ox, oy, '#4af', 40);
    doShake(4);
    this.lapseCooldown = LAPSE_COOLDOWN;
    this.vx = 0; this.vy = 0;
    this.ss(S.LAPSE, ORB_DURATION + 100); // locked for full orb lifetime
  }

  _tickLapseBlue(dt){
    // Check if orb expired/detonated — if so, exit early
    const orb = lapseOrbs.find(o => o.owner===this && o.controllable);
    if(!orb){ this.ss(this.onGround ? S.IDLE : S.AIR); return; }
    // Keep frozen in place
    this.vx = 0;
    if(this.onGround) this.vy = 0;
    if(this.sTimer >= this.sDur) this.ss(this.onGround ? S.IDLE : S.AIR);
  }

  _startDismantle(other){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.CLEAVE,S.DISMANTLE].includes(this.state)) return;
    const dist = Math.abs((this.x + PW/2) - (other.x + PW/2));
    if(dist > DISMANTLE_RANGE) { this.dismantleOutline = 700; return; } // too far — flash red outline
    // Stun the enemy immediately
    other.vx = 0;
    other.ss(S.STUN, DISMANTLE_STUN);
    // Schedule the slash marks
    scheduleDismantleSlashes(other, this);
    // Lock Sukuna briefly in cast pose
    this.ss(S.DISMANTLE, DISMANTLE_CAST);
    this.dismantleCooldown = DISMANTLE_COOLDOWN;
    this.dismantleArm = 0;
    this.vx = 0;
    doShake(4);
  }

  _tickDismantle(dt){
    this.dismantleArm = Math.min(1, this.sTimer / DISMANTLE_CAST);
    if(this.sTimer >= this.sDur){ this.dismantleArm = 0; this.ss(S.IDLE); }
  }

  _startFuga(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.CLEAVE,S.DISMANTLE,S.FUGA].includes(this.state)) return;
    this.ss(S.FUGA);
    this.fugaWindup = FUGA_WINDUP;
    this.fugaArm = 0;
    this.vx = 0;
  }

  _tickFuga(dt){
    if(this.state===S.STUN) return; // cancelled by hit
    this.vx=0;
    if(this.fugaWindup>0){
      this.fugaWindup -= dt;
      this.fugaArm = Math.min(1, 1 - this.fugaWindup/FUGA_WINDUP);
    } else {
      // Fire
      const sx = this.x + (this.facing===1 ? PW+10 : -10);
      const sy = this.y + PH*0.28;
      addFugaShot(sx, sy, this.facing, this);
      addParts(sx, sy, '#fff', 14, 6);
      addRing(sx, sy, '#fff', 60);
      doShake(8);
      this.fugaArm = 0;
      this.fugaCharge = 0; // reset charge — need 40 more to use again
      this.ss(S.IDLE);
    }
  }

  _startBlackBlur(other){
    if([S.STUN,S.RAGD,S.SLAM,S.DEAD,S.BLACKFLASH,S.BLACKBLUR].includes(this.state)) return;
    this.ss(S.BLACKBLUR);
    this.bbPhase = 0;      // 0=lunge, 1=punch1, 2=punch2, 3=slow+minigame, 4=kick, 5=done
    this.bbTimer = 0;
    this.bbTarget = other;
    this.bbHitTarget = false;
    this.bbGotBF = false;
    this.bbStartX = this.x;
    this.bfActive = false; this.bfWon = false; this.bfWindowTimer = 0;
    this.bfAtkDown = true;
    this.vy = 0;
    addParts(this.x+PW/2, this.y+PH/2, '#111', 12, 6);
  }

  _tickBlackBlur(dt, other){
    if(this.state===S.STUN || this.state===S.RAGD || this.state===S.DEAD){
      timeScale = 1; this.bbPhase=5; return;
    }
    const def = this.bbTarget || other;
    this.bbTimer += dt;

    if(this.bbPhase === 0){
      // LUNGE — dash, lean forward
      this.bbAnimProg = Math.min(1, this.bbTimer / 200);
      const targetX = def.x + (this.facing===1 ? 0 : PW) - (this.facing===1 ? PW+4 : 4);
      const dist = Math.abs(this.x - this.bbStartX);
      this.vx = this.facing * BB_LUNGE_SPD;
      this.y = Math.max(10, Math.min(GND-PH, this.y)); // stay grounded-ish
      // Apply gravity lightly
      this.vy = Math.min(this.vy + 0.4, 8);
      this.y = Math.min(GND-PH, this.y + this.vy*(dt/16.67));
      if(this.y >= GND-PH){ this.y=GND-PH; this.vy=0; }
      this.x += this.vx * (dt/16.67);
      this.x = Math.max(10, Math.min(W-PW-10, this.x));

      // Hit check during lunge
      if(!this.bbHitTarget && def.hittable){
        const myBox = {x:this.x, y:this.y, w:PW, h:PH};
        if(overlaps(myBox, def.bodyBox())){
          this.bbHitTarget = true;
          this.vx = 0;
          // Stun enemy for combo duration
          def.vx = 0;
          def.ss(S.STUN, BB_PUNCH1_DUR + BB_PUNCH2_DUR + BB_SLOW_DUR + BB_KICK_DUR + 300);
          addParts(def.x+PW/2, def.y+PH/2, '#f5a623', 10, 5);
          doShake(5);
          this.bbPhase = 1; this.bbTimer = 0;
          return;
        }
      }
      // If lunged far enough or reached wall without hit, cancel
      if(dist >= BB_LUNGE_DIST || this.x <= 10 || this.x >= W-PW-10){
        this.bbPhase = 5; this.bbTimer = 0;
      }

    } else if(this.bbPhase === 1){
      // PUNCH 1 — right jab
      this.bbAnimProg = Math.min(1, this.bbTimer / BB_PUNCH1_DUR);
      this.vx = 0;
      if(this.bbTimer >= BB_PUNCH1_DUR){
        if(def.hittable){
          def.hp = Math.max(0, def.hp - BB_DMG_HIT); def.flash=180;
          addDmg(def.x+PW/2, def.y-12, BB_DMG_HIT, '#f5a623'); doShake(4);
          addParts(def.x+PW/2, def.y+PH/2, '#f5a623', 6, 3);
          this.yujiUltCharge=Math.min(YUJI_ULT_COST,this.yujiUltCharge+BB_DMG_HIT);
        }
        this.bbPhase = 2; this.bbTimer = 0;
      }

    } else if(this.bbPhase === 2){
      // PUNCH 2 — left hook
      this.bbAnimProg = Math.min(1, this.bbTimer / BB_PUNCH2_DUR);
      this.vx = 0;
      if(this.bbTimer >= BB_PUNCH2_DUR){
        if(def.hittable){
          def.hp = Math.max(0, def.hp - BB_DMG_HIT); def.flash=180;
          addDmg(def.x+PW/2, def.y-14, BB_DMG_HIT, '#f5a623'); doShake(4);
          addParts(def.x+PW/2, def.y+PH/2, '#f5a623', 6, 3);
