// ── BLACK FLASH EFFECT ─────────────────────────────────────
const blackFlashes = [];
function addBlackFlash(x, y){
  // Each flash stores fixed branch geometry so it doesn't shimmer randomly every frame
  const branches = [];
  for(let i=0;i<18;i++){
    const ang = Math.random()*Math.PI*2;
    const len = 55 + Math.random()*110;
    const segs = [];
    let cx2=0, cy2=0;
    for(let s=0;s<6;s++){
      const t=(s+1)/6;
      cx2 = Math.cos(ang)*len*t + (Math.random()-0.5)*28;
      cy2 = Math.sin(ang)*len*t + (Math.random()-0.5)*28;
      segs.push({x:cx2,y:cy2});
    }
    branches.push({ang, len, segs, thick:1.5+Math.random()*3.5, dark:Math.random()<0.5});
  }
  // Sub-branches
  const subBranches = [];
  for(let i=0;i<12;i++){
    const ang=Math.random()*Math.PI*2;
    const len=25+Math.random()*55;
    subBranches.push({ang,len,segs:[
      {x:Math.cos(ang)*len*0.4+(Math.random()-0.5)*10, y:Math.sin(ang)*len*0.4+(Math.random()-0.5)*10},
      {x:Math.cos(ang)*len+(Math.random()-0.5)*18,     y:Math.sin(ang)*len+(Math.random()-0.5)*18}
    ]});
  }
  blackFlashes.push({ x, y, life:1, branches, subBranches });
  blackFlashes._screenFlash = 800;
}
blackFlashes._screenFlash = 0;
function tickBlackFlashes(dt){
  if(blackFlashes._screenFlash>0) blackFlashes._screenFlash=Math.max(0,blackFlashes._screenFlash-dt);
  for(let i=blackFlashes.length-1;i>=0;i--){
    blackFlashes[i].life -= dt*0.00115; // slow decay — lingers longer
    if(blackFlashes[i].life<=0) blackFlashes.splice(i,1);
  }
}
function drawBlackFlashes(){
  for(const b of blackFlashes){
    ctx.save();
    ctx.translate(b.x, b.y);
    const a = b.life;

    // Huge dark red/black outer glow — fills the surrounding area
    ctx.globalAlpha = a * 0.65;
    const outerGlow = ctx.createRadialGradient(0,0,0, 0,0,130);
    outerGlow.addColorStop(0,  'rgba(140,0,0,0.9)');
    outerGlow.addColorStop(0.3,'rgba(80,0,0,0.7)');
    outerGlow.addColorStop(0.6,'rgba(30,0,0,0.4)');
    outerGlow.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle=outerGlow;
    ctx.beginPath(); ctx.arc(0,0,130,0,Math.PI*2); ctx.fill();

    // Primary jagged BLACK branches (thick, like cursed energy tendrils)
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(const br of b.branches){
      ctx.globalAlpha = a * (br.dark ? 0.95 : 0.75);
      ctx.strokeStyle = br.dark ? '#000' : '#1a0000';
      ctx.lineWidth = br.thick * a * 1.2;
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const seg of br.segs) ctx.lineTo(seg.x, seg.y);
      ctx.stroke();
      // Red outline along each branch for depth
      ctx.globalAlpha = a * 0.35;
      ctx.strokeStyle = '#cc0000';
      ctx.lineWidth = (br.thick * a * 0.4);
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const seg of br.segs) ctx.lineTo(seg.x, seg.y);
      ctx.stroke();
    }

    // Sub-branches (thinner, more chaotic)
    for(const sb of b.subBranches){
      ctx.globalAlpha = a * 0.7;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5*a;
      ctx.beginPath(); ctx.moveTo(0,0);
      for(const seg of sb.segs) ctx.lineTo(seg.x,seg.y);
      ctx.stroke();
    }

    // Dark black void core — flat black circle punched into center
    ctx.globalAlpha = a * 0.95;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fill();

    // Deep red ring around the void core
    ctx.globalAlpha = a * 0.9;
    ctx.strokeStyle = '#cc0000';
    ctx.lineWidth = 4*a;
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#ff2200';
    ctx.lineWidth = 1.5*a;
    ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.stroke();

    // Bright white-red flash at the very center
    ctx.globalAlpha = a * 0.85;
    const core = ctx.createRadialGradient(0,0,0, 0,0,12);
    core.addColorStop(0,  'rgba(255,255,255,1)');
    core.addColorStop(0.3,'rgba(255,80,0,0.9)');
    core.addColorStop(0.7,'rgba(200,0,0,0.4)');
    core.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle=core;
    ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // Full-screen dark flash — bright red, sudden and erratic
  if(blackFlashes._screenFlash>0){
    const prog=blackFlashes._screenFlash/800;
    // Sudden harsh cutoff: bright for first 40%, then abrupt drop
    const alpha = prog > 0.6
      ? Math.pow((prog-0.6)/0.4, 0.3) * 1.0   // spike hard at start
      : prog > 0.2
      ? 0.9 + Math.sin(Date.now()*0.05)*0.1     // erratic flicker mid
      : prog/0.2 * 0.5;                          // fade out
    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha);
    // Flat full-screen intense red
    ctx.fillStyle='#440000';
    ctx.fillRect(0,0,W,H);
    // Bright center bloom
    ctx.globalAlpha = Math.min(1, alpha*0.6);
    const sg = ctx.createRadialGradient(W/2,H/2,0, W/2,H/2,W*0.55);
    sg.addColorStop(0,  'rgba(160,0,0,1)');
    sg.addColorStop(0.3,'rgba(100,0,0,0.7)');
    sg.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle=sg;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// Particles
const parts = [];
function addParts(x,y,col,n,pwr){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(.4+Math.random())*pwr;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:1,decay:.026+Math.random()*.024,r:1.5+Math.random()*2.5,col});
  }
}
function tickParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.13; p.life-=p.decay;
    if(p.life<=0) parts.splice(i,1);
  }
}
function drawParts(){
  for(const p of parts){ ctx.globalAlpha=p.life*.9; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
}

// Rings
const rings=[];
function addRing(x,y,col,maxR){ rings.push({x,y,col,r:4,maxR,life:1}); }
function tickRings(){
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.r+=(r.maxR-r.r)*.18; r.life-=.042;
    if(r.life<=0) rings.splice(i,1);
  }
}
function drawRings(){
  for(const r of rings){ ctx.globalAlpha=r.life*.6; ctx.strokeStyle=r.col; ctx.lineWidth=3*r.life; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.lineWidth=1;
}

// Damage numbers
const dmgNums=[];
function addDmg(x,y,val,col){ dmgNums.push({x,y,vy:-2,val,col,life:1}); }
function tickDmgNums(){
  for(let i=dmgNums.length-1;i>=0;i--){
    const d=dmgNums[i]; d.y+=d.vy; d.vy*=.88; d.life-=.018;
    if(d.life<=0) dmgNums.splice(i,1);
  }
}
function drawDmgNums(){
  ctx.textAlign='center';
  for(const d of dmgNums){ ctx.globalAlpha=d.life; ctx.fillStyle=d.col; ctx.font=`700 ${14+(1-d.life)*6}px 'Rajdhani',sans-serif`; ctx.fillText(`-${d.val}`,d.x,d.y); }
  ctx.globalAlpha=1;
}

// ── PLAYER ─────────────────────────────────────────────────
class Player {
  constructor(cfg){
    this.name   = cfg.name;
    this.type   = cfg.type;
    this.startX = cfg.x;
    this.startF = cfg.facing;
    this.ctrl   = cfg.ctrl;
    this.charColor    = cfg.charColor    || '#ff6666';
    this.charDimColor = cfg.charDimColor || '#dd3333';
    this.playerNum    = cfg.playerNum    || 1;
    // Ability keys derived from player number, not character type
    this.abilityUseKey   = this.playerNum===1 ? 'KeyG'        : 'KeyP';
    this.abilityCycleKey = this.playerNum===1 ? 'KeyH'        : 'BracketLeft';
    this.domainKey       = this.playerNum===1 ? 'KeyT'        : 'KeyY';
    this._init();
  }

  _init(){
    this.x = this.startX; this.y = GND-PH;
    this.vx=0; this.vy=0;
    this.facing = this.startF;
    this.hp=100; this.maxHp=100;
    this.state=S.IDLE; this.sTimer=0; this.sDur=0;
    this.atkPhase=0; this.atkTimer=0; this.atkHit=false; this.atkAnim=0;
    this.combo=0; this.comboTimer=0;
    this.onGround=true;
    this.atkDown=false; this.jmpDown=false;
    this.rdX=this.startX; this.rdY=GND-PH;
    this.rdVx=0; this.rdVy=0; this.rdRot=0; this.rdAngV=0;
    this.flash=0; this.walkT=0; this.diveVy=0;
    // Cleave
    this.cleaveDown=false; this.cleaveTimer=0; this.cleaveWindup=0;
    this.cleaveCooldown=0; this.cleaveArm=0;
    this.cleaveAir=false; this.cleaveAimAngle=0; this.cleaveAimTime=0;
    // Dismantle
    this.dismantleDown=false; this.dismantleCooldown=0;
    this.dismantleOutline=0;
    this.dismantleArm=0;
    // Fuga
    this.fugaWindup=0; this.fugaArm=0; this.fugaCooldown=0;
    // Ability system
    this.selectedAbility = 0;
    this.abilityDown=false; this.nextAbilityDown=false;
    this.fugaCharge=0;
    // Gojo abilities
    this.lapseDown=false; this.lapseCooldown=0;
    this.reversalCooldown=0; this.reversalWindup=0; this.reversalArm=0;
    this.reversalAir=false; this.reversalAimAngle=0; this.reversalAimTime=0;
    this.gojoAbility=0; // 0=lapse blue, 1=reversal red, 2=hollow purple
    this.nextGojoAbilityDown=false;
    this.hollowCharge=0;
    this.hollowWindup=0; this.hollowArm=0;
    // Domain
    if(this.domainCharge===undefined) this.domainCharge=0; // persists across rounds
    this.domainDown=false;
    this.domainHandsign=0;
    this.gojoDomainDown=false;
    // Yuji Black Flash minigame
    this.bfActive=false; this.bfLinePos=0; this.bfLineDir=1;
    this.bfTimer=0; this.bfGoalPos=0;
    this.bfWon=false; this.bfWindowTimer=0;
    this.bfStunnedEnemy=null; this.bfAtkDown=false;
    // Yuji Black Blur
    this.bbCooldown=0; this.bbPhase=0; this.bbTimer=0; this.bbAnimProg=0;
    this.bbTarget=null; this.bbHitTarget=false;
    this.bbGotBF=false; this.bbStartX=0;
    // Yuji Piercing Blood
    this.pbChargeTime=0; this.pbCooldown=0; this.pbDown=false;
  }

  reset(){ this._init(); }

  get hittable(){ return ![S.RAGD,S.SLAM,S.DEAD].includes(this.state); }
  get hitboxOn(){ return (this.state===S.ATCK&&this.atkPhase===1)||this.state===S.DIVE; }

  atkBox(){
    if(this.state===S.ATCK){ const hx=this.facing===1?this.x+PW:this.x-ATK_RANGE; return{x:hx,y:this.y+4,w:ATK_RANGE,h:PH-8}; }
    if(this.state===S.DIVE) return{x:this.x-22,y:this.y+PH-28,w:PW+44,h:32};
    return null;
  }
  bodyBox(){ return{x:this.x,y:this.y,w:PW,h:PH}; }
  ss(s,dur=0){ this.state=s; this.sTimer=0; this.sDur=dur; }

  update(dt,other){
    const c=this.ctrl;
    this.sTimer+=dt; this.comboTimer+=dt; this.flash=Math.max(0,this.flash-dt);
    if(this.cleaveCooldown>0) this.cleaveCooldown=Math.max(0,this.cleaveCooldown-dt);
    if(this.dismantleCooldown>0) this.dismantleCooldown=Math.max(0,this.dismantleCooldown-dt);
    if(this.dismantleOutline>0) this.dismantleOutline=Math.max(0,this.dismantleOutline-dt);

    // ── ABILITY SYSTEM (player-number keyed, not character keyed) ──
    const useKey   = this.abilityUseKey;
    const cycleKey = this.abilityCycleKey;
    const domKey   = this.domainKey;

    // Piercing Blood (Yuji) — hold use key to charge
    if(this.type==='yuji'){
      if(this.pbCooldown>0) this.pbCooldown=Math.max(0,this.pbCooldown-dt);
      if(this.bbCooldown>0) this.bbCooldown=Math.max(0,this.bbCooldown-dt);
      const pbKey = keys[useKey];
      const canCharge = ![S.STUN,S.RAGD,S.SLAM,S.DEAD,S.BLACKFLASH,S.BLACKBLUR].includes(this.state) && this.pbCooldown<=0;
      if(pbKey && canCharge){
        this.pbChargeTime = Math.min(PB_CHARGE_MAX, this.pbChargeTime + dt);
        this.vx = 0;
      } else if(!pbKey && this.pbChargeTime > 0 && canCharge){
        const dmg = this.pbChargeTime >= 2000 ? PB_DMG_3
                  : this.pbChargeTime >= 1000 ? PB_DMG_2 : PB_DMG_1;
        const sx = this.x + (this.facing===1 ? PW+4 : -4);
        const sy = this.y + PH*0.32;
        addPiercingBeam(sx, sy, this.facing, this, dmg);
        addParts(sx, sy, '#8b0000', 8, 4);
        doShake(4);
        this.pbCooldown = PB_COOLDOWN;
        this.pbChargeTime = 0;
      }
      // Black Blur — cycle key triggers lunge
      const bbEdge = keys[cycleKey] && !this.nextAbilityDown;
      if(!keys[cycleKey]) this.nextAbilityDown=false; else this.nextAbilityDown=true;
      if(bbEdge && this.bbCooldown<=0 && ![S.STUN,S.RAGD,S.SLAM,S.DEAD,S.BLACKFLASH,S.BLACKBLUR].includes(this.state)){
        this._startBlackBlur(other);
      }
    }

    // Sukuna abilities
    if(this.type==='sukuna'){
      const useEdge  = keys[useKey]   && !this.abilityDown;
      const nextEdge = keys[cycleKey] && !this.nextAbilityDown;
      const domEdge  = keys[domKey]   && !this.domainDown;
      if(!keys[useKey])   this.abilityDown=false;        else this.abilityDown=true;
      if(!keys[cycleKey]) this.nextAbilityDown=false;    else this.nextAbilityDown=true;
      if(!keys[domKey])   this.domainDown=false;         else this.domainDown=true;
      if(nextEdge) this.selectedAbility=(this.selectedAbility+1)%3;
      if(useEdge){
        if(this.selectedAbility===0 && this.cleaveCooldown<=0) this._startCleave();
        if(this.selectedAbility===1 && this.dismantleCooldown<=0) this._startDismantle(other);
        if(this.selectedAbility===2 && this.fugaCharge>=FUGA_CHARGE_REQ) this._startFuga();
      }
      if(domEdge && this.domainCharge>=DOMAIN_CHARGE_REQ && !activeDomain) this._startDomain();
    }

    // Gojo abilities
    if(this.type==='gojo'){
      if(this.lapseCooldown>0)    this.lapseCooldown=Math.max(0,this.lapseCooldown-dt);
      if(this.reversalCooldown>0) this.reversalCooldown=Math.max(0,this.reversalCooldown-dt);
      const useEdge  = keys[useKey]   && !this.abilityDown;
      const nextEdge = keys[cycleKey] && !this.nextGojoAbilityDown;
      const domEdge  = keys[domKey]   && !this.gojoDomainDown;
      if(!keys[useKey])   this.abilityDown=false;           else this.abilityDown=true;
      if(!keys[cycleKey]) this.nextGojoAbilityDown=false;   else this.nextGojoAbilityDown=true;
      if(!keys[domKey])   this.gojoDomainDown=false;        else this.gojoDomainDown=true;
      if(nextEdge) this.gojoAbility=(this.gojoAbility+1)%3;
      if(useEdge){
        if(this.gojoAbility===0 && this.lapseCooldown<=0)      this._startLapseBlue();
        if(this.gojoAbility===1 && this.reversalCooldown<=0)   this._startReversalRed();
        if(this.gojoAbility===2 && this.hollowCharge>=HOLLOW_CHARGE_REQ) this._startHollowPurple();
      }
      if(domEdge && this.domainCharge>=DOMAIN_CHARGE_REQ && !activeDomain) this._startDomain();
    }

    const atkEdge=keys[c.atk]&&!this.atkDown;
    const jmpEdge=keys[c.jmp]&&!this.jmpDown;
    if(!keys[c.atk]) this.atkDown=false; else this.atkDown=true;
    if(!keys[c.jmp]) this.jmpDown=false; else this.jmpDown=true;
    if(this.comboTimer>COMBO_RESET) this.combo=0;
    if(this.state===S.WALK) this.walkT+=dt*.012;

    switch(this.state){
      case S.IDLE: case S.WALK: case S.AIR:
        if(keys[c.left]){this.vx=-SPD;this.facing=-1;}
        else if(keys[c.right]){this.vx=SPD;this.facing=1;}
        else{this.vx*=.7; if(Math.abs(this.vx)<.15) this.vx=0;}
        if(jmpEdge&&this.onGround){this.vy=JUMP_V;this.onGround=false;this.jmpDown=true;}
        if(atkEdge){this.atkDown=true;this._doAttack();}
        this._phys(dt); break;
      case S.ATCK: this._tickAtk(dt,atkEdge); if(this.type==='yuji') this.vx=0; this._phys(dt); break;
      case S.DIVE: this._tickDive(dt); break;
      case S.STUN: this.vx*=.82; this._phys(dt); if(this.sTimer>=this.sDur) this.ss(S.IDLE); break;
      case S.RAGD: case S.SLAM: this._rdPhys(dt); if(this.sTimer>=this.sDur) this._exitRd(); break;
      case S.DEAD: this._rdPhys(dt); break;
      case S.CLEAVE:
        this._tickCleave(dt,other);
        if(!this.cleaveAir) this._phys(dt);
        break;
      case S.DISMANTLE: this._tickDismantle(dt); this._phys(dt); break;
      case S.FUGA: this._tickFuga(dt); break;
      case S.LAPSE: this._tickLapseBlue(dt); this._phys(dt); break;
      case S.REVERSAL:
        this._tickReversalRed(dt);
        if(!this.reversalAir) this._phys(dt);
        break;
      case S.HOLLOW: this._tickHollowPurple(dt); break;
      case S.DOMAIN: this._tickDomain(dt); break;
      case S.BLACKFLASH: this._tickBlackFlash(dt, other); this._phys(dt); break;
      case S.BLACKBLUR:  this._tickBlackBlur(dt, other); break;
    }
  }

  _startDomain(){
    if([S.STUN,S.RAGD,S.SLAM,S.DEAD,S.DOMAIN].includes(this.state)) return;
    this.ss(S.DOMAIN);
    this.domainHandsign = 0;
    this.vx = 0;
  }

  _tickDomain(dt){
    if(this.state===S.STUN){ this.domainHandsign=0; return; }
    this.vx=0;
    if(this.onGround) this.vy=0;
    this.domainHandsign = Math.min(1, this.domainHandsign + dt/DOMAIN_HANDSIGN);
    if(this.domainHandsign >= 1 && !activeDomain){
      startDomain(this);
      doShake(12);
      domainFlash = 1200;
      this.domainCharge = 0;
      addRing(W/2, GND, '#8a3000', 120);
      this.ss(S.IDLE);
    }
  }

  _startHollowPurple(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.LAPSE,S.REVERSAL,S.HOLLOW].includes(this.state)) return;
    this.ss(S.HOLLOW);
    this.hollowWindup = HOLLOW_WINDUP;
    this.hollowArm = 0;
    this.vx = 0;
  }

  _tickHollowPurple(dt){
    if(this.state===S.STUN){ this.hollowArm=0; return; }
    this.vx = 0; this.vy += 0; // freeze in place
    if(this.onGround) this.vy = 0;
    this.hollowWindup -= dt;
    this.hollowArm = Math.max(0, 1 - this.hollowWindup/HOLLOW_WINDUP);
    if(this.hollowWindup <= 0){
      const sx = this.x + (this.facing===1 ? PW+HOLLOW_BALL_R : -HOLLOW_BALL_R);
      const sy = this.y + PH*0.3;
      addHollowShot(sx, sy, this.facing, this);
      addParts(sx, sy, '#c060ff', 16, 6);
      addRing(sx, sy, '#c060ff', 55);
      doShake(8);
      this.hollowArm = 0;
      this.hollowCharge = 0;
      this.ss(S.IDLE);
    }
  }

  _startReversalRed(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.LAPSE,S.REVERSAL].includes(this.state)) return;
    this.ss(S.REVERSAL);
    this.reversalArm = 0;
    this.vx = 0;
    if(!this.onGround){
      // Air variant: suspend and aim
      this.reversalAir = true;
      this.reversalAimAngle = 0;
      this.reversalAimTime = AIR_CLEAVE_AIM;
      this.vy = 0;
    } else {
      this.reversalAir = false;
      this.reversalWindup = REVERSAL_WINDUP;
    }
  }

  _tickReversalRed(dt){
    if(this.state===S.STUN){ this.reversalArm=0; this.reversalAir=false; return; }

    if(this.reversalAir){
      // Suspend in air, aim with up/down
      this.vy = 0; this.vx = 0;
      if(keys[this.ctrl.jmp])
        this.reversalAimAngle = Math.max(-Math.PI*0.39, this.reversalAimAngle - AIR_CLEAVE_AIM_SPEED*dt);
      if(this.ctrl.left==='KeyA' && keys['KeyS'])
        this.reversalAimAngle = Math.min(Math.PI*0.39, this.reversalAimAngle + AIR_CLEAVE_AIM_SPEED*dt);
      if(this.ctrl.left==='ArrowLeft' && keys['ArrowDown'])
        this.reversalAimAngle = Math.min(Math.PI*0.39, this.reversalAimAngle + AIR_CLEAVE_AIM_SPEED*dt);
      this.reversalArm = 1;
      this.reversalAimTime -= dt;
      if(this.reversalAimTime <= 0){
        const sx = this.x + (this.facing===1 ? PW+6 : -6);
        const sy = this.y + PH*0.3;
        // Fire at aimed angle
        const spd = REVERSAL_SPEED;
        reversalShots.push({
          x:sx, y:sy, dir:this.facing, owner:this,
          hit:false,
          vx: Math.cos(this.reversalAimAngle)*spd*this.facing,
          vy: Math.sin(this.reversalAimAngle)*spd
        });
        addParts(sx, sy, '#f44', 8, 4);
        addRing(sx, sy, '#f44', 36);
        doShake(5);
        this.reversalArm=0; this.reversalAir=false;
        this.reversalCooldown=REVERSAL_COOLDOWN;
        this.vy=2; this.ss(S.AIR);
      }
    } else {
      // Ground variant
      this.vx = 0;
      this.reversalWindup -= dt;
      this.reversalArm = Math.min(1, 1 - this.reversalWindup/REVERSAL_WINDUP);
      if(this.reversalWindup <= 0){
        const sx = this.x + (this.facing===1 ? PW+6 : -6);
        const sy = this.y + PH*0.3;
        addReversalShot(sx, sy, this.facing, this);
        addParts(sx, sy, '#f44', 8, 4);
        addRing(sx, sy, '#f44', 36);
        doShake(5);
        this.reversalArm=0;
        this.reversalCooldown=REVERSAL_COOLDOWN;
        this.ss(S.IDLE);
      }
    }
  }

  _startLapseBlue(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.LAPSE].includes(this.state)) return;
    // In Gojo's domain: spawn hollow nuke orb instead of regular lapse
    if(this.type==='gojo' && activeDomain && activeDomain.owner===this && activeDomain.type==='void' && !hollowNukeOrb){
      const ox = this.x + PW/2 + this.facing * LAPSE_SPAWN_DIST;
      const oy = this.y + PH * 0.38;
      hollowNukeOrb = { x:ox, y:oy, timer:HOLLOW_NUKE_WINDOW, charged:false, chargeTimer:HOLLOW_NUKE_CHARGE_TIME, owner:this, pulse:0 };
      addRing(ox, oy, '#4af', 50); doShake(4);
      return;
    }
    this.ss(S.LAPSE, LAPSE_CAST);
    this.vx = 0;
    const ox = this.x + PW/2 + this.facing * LAPSE_SPAWN_DIST;
    const oy = this.y + PH * 0.38;
    addLapseOrb(ox, oy, this);
    addRing(ox, oy, '#4af', 40);
    addParts(ox, oy, '#06f', 10, 4);
    doShake(4);
    this.lapseCooldown = LAPSE_COOLDOWN;
  }

  _tickLapseBlue(dt){
    if(this.sTimer >= this.sDur) this.ss(S.IDLE);
  }

  _startDismantle(other){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.CLEAVE,S.DISMANTLE].includes(this.state)) return;
    const dist = Math.abs((this.x + PW/2) - (other.x + PW/2));
    if(dist > DISMANTLE_RANGE) { this.dismantleOutline = 700; return; } // too far — flash red outline
    // Stun the enemy immediately
    other.vx = 0;
    other.ss(S.STUN, DISMANTLE_STUN);
    // Schedule the slash marks
    scheduleDismantleSlashes(other, this);
    // Lock Sukuna briefly in cast pose
    this.ss(S.DISMANTLE, DISMANTLE_CAST);
    this.dismantleCooldown = DISMANTLE_COOLDOWN;
    this.dismantleArm = 0;
    this.vx = 0;
    doShake(4);
  }

  _tickDismantle(dt){
    this.dismantleArm = Math.min(1, this.sTimer / DISMANTLE_CAST);
    if(this.sTimer >= this.sDur){ this.dismantleArm = 0; this.ss(S.IDLE); }
  }

  _startFuga(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.CLEAVE,S.DISMANTLE,S.FUGA].includes(this.state)) return;
    this.ss(S.FUGA);
    this.fugaWindup = FUGA_WINDUP;
    this.fugaArm = 0;
    this.vx = 0;
  }

  _tickFuga(dt){
    if(this.state===S.STUN) return; // cancelled by hit
    this.vx=0;
    if(this.fugaWindup>0){
      this.fugaWindup -= dt;
      this.fugaArm = Math.min(1, 1 - this.fugaWindup/FUGA_WINDUP);
    } else {
      // Fire
      const sx = this.x + (this.facing===1 ? PW+10 : -10);
      const sy = this.y + PH*0.28;
      addFugaShot(sx, sy, this.facing, this);
      addParts(sx, sy, '#fff', 14, 6);
      addRing(sx, sy, '#fff', 60);
      doShake(8);
      this.fugaArm = 0;
      this.fugaCharge = 0; // reset charge — need 40 more to use again
      this.ss(S.IDLE);
    }
  }

  _startBlackBlur(other){
    if([S.STUN,S.RAGD,S.SLAM,S.DEAD,S.BLACKFLASH,S.BLACKBLUR].includes(this.state)) return;
    this.ss(S.BLACKBLUR);
    this.bbPhase = 0;      // 0=lunge, 1=punch1, 2=punch2, 3=slow+minigame, 4=kick, 5=done
    this.bbTimer = 0;
    this.bbTarget = other;
    this.bbHitTarget = false;
    this.bbGotBF = false;
    this.bbStartX = this.x;
    this.bfActive = false; this.bfWon = false; this.bfWindowTimer = 0;
    this.bfAtkDown = true;
    this.vy = 0;
    addParts(this.x+PW/2, this.y+PH/2, '#111', 12, 6);
  }

  _tickBlackBlur(dt, other){
    if(this.state===S.STUN || this.state===S.RAGD || this.state===S.DEAD){
      timeScale = 1; this.bbPhase=5; return;
    }
    const def = this.bbTarget || other;
    this.bbTimer += dt;

    if(this.bbPhase === 0){
      // LUNGE — dash, lean forward
      this.bbAnimProg = Math.min(1, this.bbTimer / 200);
      const targetX = def.x + (this.facing===1 ? 0 : PW) - (this.facing===1 ? PW+4 : 4);
      const dist = Math.abs(this.x - this.bbStartX);
      this.vx = this.facing * BB_LUNGE_SPD;
      this.y = Math.max(10, Math.min(GND-PH, this.y)); // stay grounded-ish
      // Apply gravity lightly
      this.vy = Math.min(this.vy + 0.4, 8);
      this.y = Math.min(GND-PH, this.y + this.vy*(dt/16.67));
      if(this.y >= GND-PH){ this.y=GND-PH; this.vy=0; }
      this.x += this.vx * (dt/16.67);
      this.x = Math.max(10, Math.min(W-PW-10, this.x));

      // Hit check during lunge
      if(!this.bbHitTarget && def.hittable){
        const myBox = {x:this.x, y:this.y, w:PW, h:PH};
        if(overlaps(myBox, def.bodyBox())){
          this.bbHitTarget = true;
          this.vx = 0;
          // Stun enemy for combo duration
          def.vx = 0;
          def.ss(S.STUN, BB_PUNCH1_DUR + BB_PUNCH2_DUR + BB_SLOW_DUR + BB_KICK_DUR + 300);
          addParts(def.x+PW/2, def.y+PH/2, '#f5a623', 10, 5);
          doShake(5);
          this.bbPhase = 1; this.bbTimer = 0;
          return;
        }
      }
      // If lunged far enough or reached wall without hit, cancel
      if(dist >= BB_LUNGE_DIST || this.x <= 10 || this.x >= W-PW-10){
        this.bbPhase = 5; this.bbTimer = 0;
      }

    } else if(this.bbPhase === 1){
      // PUNCH 1 — right jab
      this.bbAnimProg = Math.min(1, this.bbTimer / BB_PUNCH1_DUR);
      this.vx = 0;
      if(this.bbTimer >= BB_PUNCH1_DUR){
        // Deal punch 1 dmg
        if(def.hittable){
          def.hp = Math.max(0, def.hp - BB_DMG_HIT); def.flash=180;
          addDmg(def.x+PW/2, def.y-12, BB_DMG_HIT, '#f5a623'); doShake(4);
          addParts(def.x+PW/2, def.y+PH/2, '#f5a623', 6, 3);
        }
        this.bbPhase = 2; this.bbTimer = 0;
      }

    } else if(this.bbPhase === 2){
      // PUNCH 2 — left hook
      this.bbAnimProg = Math.min(1, this.bbTimer / BB_PUNCH2_DUR);
      this.vx = 0;
      if(this.bbTimer >= BB_PUNCH2_DUR){
        if(def.hittable){
          def.hp = Math.max(0, def.hp - BB_DMG_HIT); def.flash=180;
          addDmg(def.x+PW/2, def.y-14, BB_DMG_HIT, '#f5a623'); doShake(4);
          addParts(def.x+PW/2, def.y+PH/2, '#f5a623', 6, 3);
        }
        // Enter slow motion + minigame
        timeScale = 0.18;
        this.bbPhase = 3; this.bbTimer = 0;
        // Start BF minigame
        this.bfActive = true;
        this.bfTimer = BB_SLOW_DUR * (1/0.18); // real-time ms, run on real dt
        this.bfGoalPos = BF_BAR_W * 0.5 - BF_GOAL_W/2;
        this.bfLinePos = 0; this.bfLineDir = 1;
        this.bfWon = false; this.bfWindowTimer = 0;
        this.bfAtkDown = true;
        this.bfStunnedEnemy = def;
      }

    } else if(this.bbPhase === 3){
      // SLOW MOTION + MINIGAME — one pass, real-time timed
      this.vx = 0;
      const realDt = dt / timeScale; // undo time scaling so minigame runs at real speed

      const bbKey = keys[this.abilityCycleKey];
      const bbEdge = bbKey && !this.bfAtkDown;
      this.bfAtkDown = !!bbKey;

      // Line moves left to right only — one pass, no bounce
      this.bfLinePos += BB_LINE_SPEED * realDt * 0.12;

      if(bbEdge){
        // Goal check: expand by line half-width (1.5px) so visual overlap matches
        const gl = this.bfGoalPos - 1.5;
        const gr = this.bfGoalPos + BF_GOAL_W + 1.5;
        if(this.bfLinePos >= gl && this.bfLinePos <= gr){
          // HIT — immediately fire BF kick, skip straight to it
          this.bbGotBF = true;
          this.bfActive = false;
          timeScale = 1;
          this._executeBBKick(def);
          return;
        }
      }

      // Line reached end or already missed — end minigame
      if(this.bfLinePos >= BF_BAR_W){
        timeScale = 1;
        this.bfActive = false;
        this.bbPhase = 4; this.bbTimer = 0;
      }

    } else if(this.bbPhase === 4){
      // Normal kick (minigame missed/timed out)
      this.bbAnimProg = Math.min(1, this.bbTimer / BB_KICK_DUR);
      this.vx = 0;
      if(this.bbTimer >= BB_KICK_DUR){
        this._executeBBKick(def);
      }

    } else {
      // DONE
      timeScale=1;
      this.bbCooldown = BB_COOLDOWN;
      this.bbHitTarget=false; this.bbGotBF=false;
      this.ss(this.onGround ? S.IDLE : S.AIR);
    }
  }

  _executeBBKick(def){
    const kickDmg = this.bbGotBF ? BB_DMG_BF_KICK : BB_DMG_KICK;
    if(def && (def.hittable || def.state===S.STUN)){
      def.hp=Math.max(0,def.hp-kickDmg); def.flash=400;
      if(this.bbGotBF){
        addBlackFlash(def.x+PW/2, def.y+PH/2);
        addDmg(def.x+PW/2, def.y-20, kickDmg, '#111'); doShake(18);
        def._initRd(this.facing*12,-8,.15*this.facing); def.ss(def.hp<=0?S.DEAD:S.RAGD,RAGD_MS*1.6);
      } else {
        addParts(def.x+PW/2, def.y+PH/2, '#f5a623', 14, 6);
        addRing(def.x+PW/2, def.y+PH/2, '#f5a623', 60);
        addDmg(def.x+PW/2, def.y-18, kickDmg, '#f5a623'); doShake(10);
        def._initRd(this.facing*9,-6,.12*this.facing); def.ss(def.hp<=0?S.DEAD:S.RAGD,RAGD_MS*1.2);
      }
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+(BB_DMG_HIT*2+kickDmg));
    }
    this.bbPhase=5; this.bbTimer=0;
  }

  _startBlackFlashMinigame(enemy){
    this.bfActive = true;
    this.bfTimer = BF_MINIGAME_DUR;
    this.bfLinePos = 0;
    this.bfLineDir = 1;
    this.bfGoalPos = BF_BAR_W * 0.5 - BF_GOAL_W/2; // goal in center
    this.bfWon = false;
    this.bfWindowTimer = 0;
    this.bfStunnedEnemy = enemy;
    this.bfAtkDown = true; // prevent instant re-trigger from held key
    // keep enemy stunned for entire minigame
    enemy.vx=0;
    enemy.ss(S.STUN, BF_MINIGAME_DUR + BF_WINDOW + 200);
    this.combo = 0;
    this.ss(S.BLACKFLASH);
  }

  _tickBlackFlash(dt, other){
    if(!this.bfActive){ this.ss(S.IDLE); return; }
    this.vx = 0; // stay still during minigame

    // Track atk button edge
    const atkKey = keys[this.ctrl.atk];
    const atkEdge = atkKey && !this.bfAtkDown;
    this.bfAtkDown = !!atkKey;

    if(this.bfWon){
      // Window to press attack for black flash
      this.bfWindowTimer -= dt;
      if(atkEdge){
        // BLACK FLASH!
        this._triggerBlackFlash(other);
        return;
      }
      if(this.bfWindowTimer <= 0){
        // Missed the window
        this.bfActive = false;
        this.bfWon = false;
        this.ss(S.IDLE);
      }
    } else {
      // Minigame active: bounce line
      this.bfTimer -= dt;
      this.bfLinePos += this.bfLineDir * BF_LINE_SPEED * dt * 0.12;
      if(this.bfLinePos >= BF_BAR_W){ this.bfLinePos = BF_BAR_W; this.bfLineDir = -1; }
      if(this.bfLinePos <= 0){ this.bfLinePos = 0; this.bfLineDir = 1; }

      if(atkEdge){
        // Check if line is in goal zone
        const goalL = this.bfGoalPos;
        const goalR = this.bfGoalPos + BF_GOAL_W;
        if(this.bfLinePos >= goalL && this.bfLinePos <= goalR){
          // SUCCESS
          this.bfWon = true;
          this.bfWindowTimer = BF_WINDOW;
          addRing(this.x+PW/2, this.y+PH/2, '#f5a623', 45);
          doShake(4);
        } else {
          // MISS — stun Yuji for 1 second
          this.bfActive = false;
          this.bfTimer = 0;
          if(this.bfStunnedEnemy && this.bfStunnedEnemy.state===S.STUN)
            this.bfStunnedEnemy.ss(S.IDLE); // release enemy
          this.ss(S.STUN, 1000);
        }
      }
      if(this.bfTimer <= 0){
        // Time ran out
        this.bfActive = false;
        this.ss(S.IDLE);
      }
    }
  }

  _triggerBlackFlash(other){
    const def = this.bfStunnedEnemy || other;
    this.bfActive = false; this.bfWon = false;
    this.ss(S.IDLE);

    const mx = def.x+PW/2, my = def.y+PH/2;
    // Damage
    def.hp = Math.max(0, def.hp - BF_DMG);
    def.flash = 500;
    // Black Flash visual effects
    addBlackFlash(mx, my);
    addDmg(mx, def.y-24, BF_DMG, '#111');
    doShake(18);
    if(def.hp<=0){ def._initRd(this.facing*11,-7,.14*this.facing); def.ss(S.DEAD); }
    else { def._initRd(this.facing*10,-6,.13*this.facing); def.ss(S.RAGD, RAGD_MS*1.4); }
    this.domainCharge = Math.min(DOMAIN_CHARGE_REQ, this.domainCharge+BF_DMG);
  }

  _drawBlackFlashMinigame(){
    if(!this.bfActive) return;
    const bx = this.x + PW/2 - BF_BAR_W/2;
    const by = this.y - 44;
    const t = Date.now();
    const isBlackBlur = this.state === S.BLACKBLUR;
    const keyHint = isBlackBlur
      ? (this.playerNum===1 ? 'H' : '[')
      : (this.playerNum===1 ? 'F' : ';');

    ctx.save();
    if(this.bfWon && this.state !== S.BLACKBLUR){
      // Standalone BF: flash HIT NOW
      const pulse = 0.7 + 0.3*Math.sin(t*0.03);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#f5a623';
      ctx.font = `700 14px 'Rajdhani',sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`[${keyHint}] HIT NOW!`, this.x+PW/2, by-6);
      ctx.globalAlpha = 1;
    } else {
      // Background
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(bx-3, by-3, BF_BAR_W+6, 18);
      // Goal zone (bright orange)
      ctx.fillStyle = '#f5a623';
      ctx.fillRect(bx + this.bfGoalPos, by, BF_GOAL_W, 12);
      // Moving line (white)
      ctx.fillStyle = '#fff';
      ctx.fillRect(bx + this.bfLinePos - 1.5, by-2, 3, 16);
      // Border
      ctx.strokeStyle = 'rgba(245,166,35,0.6)'; ctx.lineWidth=1;
      ctx.strokeRect(bx, by, BF_BAR_W, 12);
      // Label
      ctx.fillStyle='rgba(245,166,35,0.8)';
      ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
      ctx.fillText(`BLACK FLASH  [${keyHint}]`, this.x+PW/2, by-4);
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  _startBlackFlash(){ /* placeholder */ }

  _startCleave(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.CLEAVE].includes(this.state)) return;
    this.ss(S.CLEAVE);
    this.cleaveArm = 0;
    this.vx = 0;
    if(!this.onGround){
      // Air variant: suspend and aim
      this.cleaveAir = true;
      this.cleaveAimAngle = 0;
      this.cleaveAimTime = AIR_CLEAVE_AIM;
      this.vy = 0; // suspend
    } else {
      this.cleaveAir = false;
      this.cleaveWindup = CLEAVE_WINDUP;
    }
  }

  _tickCleave(dt, other){
    // If hit during any cleave state → cancel
    if(this.state === S.STUN){ this.cleaveArm=0; this.cleaveCooldown=0; return; }

    if(this.cleaveAir){
      // ── AIR VARIANT ──
      // Keep suspended
      this.vy = 0; this.vx = 0;

      // Aim with up/down keys — clamp to ±70°
      const ctrl = this.ctrl;
      if(keys[ctrl.jmp])  this.cleaveAimAngle = Math.max(-Math.PI*0.39, this.cleaveAimAngle - AIR_CLEAVE_AIM_SPEED*dt);
      if(keys[ctrl.left] === false && keys[ctrl.right] === false && keys['ArrowDown'])
        this.cleaveAimAngle = Math.min(Math.PI*0.39, this.cleaveAimAngle + AIR_CLEAVE_AIM_SPEED*dt);
      // P1 uses S for down, P2 uses ArrowDown
      if(this.ctrl.left==='KeyA' && keys['KeyS'])
        this.cleaveAimAngle = Math.min(Math.PI*0.39, this.cleaveAimAngle + AIR_CLEAVE_AIM_SPEED*dt);
      if(this.ctrl.left==='ArrowLeft' && keys['ArrowDown'])
        this.cleaveAimAngle = Math.min(Math.PI*0.39, this.cleaveAimAngle + AIR_CLEAVE_AIM_SPEED*dt);

      // Arm tracks aim angle
      this.cleaveArm = 1;

      this.cleaveAimTime -= dt;
      if(this.cleaveAimTime <= 0){
        // Fire at aimed angle
        const sx = this.x + (this.facing===1 ? PW+8 : -8);
        const sy = this.y + PH*0.32;
        addCleave(sx, sy, this.facing, this, this.cleaveAimAngle);
        addParts(sx, sy, '#ddd', 10, 5);
        addRing(sx, sy, '#fff', 48);
        doShake(5);
        this.cleaveArm = 0;
        this.cleaveAir = false;
        this.cleaveCooldown = CLEAVE_COOLDOWN;
        // Resume falling
        this.vy = 2;
        this.ss(S.AIR);
      }
    } else {
      // ── GROUND VARIANT ──
      if(this.cleaveWindup > 0){
        this.cleaveWindup -= dt;
        this.cleaveArm = Math.min(1, 1 - this.cleaveWindup / CLEAVE_WINDUP);
      } else {
        const sx = this.x + (this.facing===1 ? PW+8 : -8);
        const sy = this.y + PH*0.32;
        addCleave(sx, sy, this.facing, this, 0);
        addParts(sx, sy, '#ddd', 10, 5);
        addRing(sx, sy, '#fff', 48);
        doShake(5);
        this.cleaveArm = 0;
        this.cleaveCooldown = CLEAVE_COOLDOWN;
        this.ss(S.IDLE);
      }
    }
  }

  _doAttack(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD].includes(this.state)) return;
    if(this.type==='yuji') this.vx=0; // Yuji stops to punch
    if(this.combo>=3&&!this.onGround){ this.ss(S.DIVE,2000); this.diveVy=5; this.atkHit=false; }
    else{ this.ss(S.ATCK,ATK_START+ATK_ACT+ATK_REC); this.atkPhase=0; this.atkTimer=0; this.atkHit=false; this.atkAnim=0; this._wasFinisher=(this.combo>=3); }
  }

  _tickAtk(dt,atkEdge){
    this.atkTimer+=dt;
    if(this.atkPhase===0&&this.atkTimer>=ATK_START){ this.atkPhase=1; this.atkTimer=0; }
    else if(this.atkPhase===1){
      this.atkAnim=this.atkTimer/ATK_ACT;
      if(this.atkTimer>=ATK_ACT){ this.atkPhase=2; this.atkTimer=0; this.atkAnim=0; }
    } else if(this.atkPhase===2&&this.atkTimer>=ATK_REC){
      if(atkEdge){ this.atkDown=true; this.atkPhase=0; this.atkTimer=0; this.atkHit=false; this.atkAnim=0; }
      else {
        // If this was a finisher attempt and it missed, lose the combo
        if(this._wasFinisher && !this.atkHit) this.combo=0;
        this._wasFinisher=false;
        this.ss(this.onGround?S.IDLE:S.AIR);
      }
    }
  }

  _tickDive(dt){
    const f=dt/16.67;
    this.diveVy=Math.min(this.diveVy+1.5*f,28);
    this.y+=this.diveVy*f; this.x+=this.vx*.1*f;
    this.x=Math.max(10,Math.min(W-PW-10,this.x));
    if(this.y>=GND-PH){this.y=GND-PH;this.vy=-7;this.vx=0;this.onGround=false;
      if(!this.atkHit) this.combo=0; // missed — lose finisher
      this.ss(S.AIR);}
    if(this.sTimer>=this.sDur){this.y=GND-PH;
      if(!this.atkHit) this.combo=0; // timed out without hitting
      this.ss(S.IDLE);}
  }

  _phys(dt){
    const f=dt/16.67;
    this.vy+=GRAV*f; this.x+=this.vx*f; this.y+=this.vy*f;
    if(this.y>=GND-PH){this.y=GND-PH;this.vy=0;this.onGround=true;} else this.onGround=false;
    this.x=Math.max(10,Math.min(W-PW-10,this.x));
    if([S.IDLE,S.WALK,S.AIR].includes(this.state))
      this.state=!this.onGround?S.AIR:Math.abs(this.vx)>.15?S.WALK:S.IDLE;
  }

  _rdPhys(dt){
    const f=dt/16.67;
    this.rdVy+=GRAV*f; this.rdVx*=Math.pow(.976,f);
    this.rdX+=this.rdVx*f; this.rdY+=this.rdVy*f;
    this.rdRot+=this.rdAngV*f; this.rdAngV*=Math.pow(.93,f);
    if(this.rdY>=GND-PH){
      this.rdY=GND-PH;
      if(Math.abs(this.rdVy)>1.5){this.rdVy*=-.28;addParts(this.rdX+PW/2,GND,'#999',4,2);}
      else this.rdVy=0;
      this.rdVx*=.65; this.rdAngV*=.4;
    }
    if(this.rdX<10){this.rdX=10;this.rdVx*=-.4;}
    if(this.rdX>W-PW-10){this.rdX=W-PW-10;this.rdVx*=-.4;}
    this.x=this.rdX; this.y=this.rdY;
  }

  _exitRd(){
    this.x=Math.max(10,Math.min(W-PW-10,this.rdX));
    this.y=GND-PH; this.vx=0; this.vy=0; this.rdRot=0; this.ss(S.IDLE);
  }

  landHit(def){
    if(this.atkHit) return;
    this.atkHit=true; this.comboTimer=0;
    const isSlam    =this.state===S.DIVE;
    const isFinisher=!isSlam&&this.combo>=3;
    const mx=def.x+PW/2, my=def.y+PH/2;
    if(isSlam){
      this.combo=0; def.getSlam(this);
      addParts(mx,GND,'#aaa',20,5); addRing(mx,GND,'#aaa',80);
      addDmg(mx,def.y-14,DMG_SLAM,'#ccc'); doShake(14); this.vy=-8;
      if(this.type==='sukuna') this.fugaCharge=Math.min(FUGA_CHARGE_REQ,this.fugaCharge+DMG_SLAM);
      if(this.type==='gojo')   this.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,this.hollowCharge+DMG_SLAM);
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+DMG_SLAM);
    } else if(isFinisher){
      this.combo=0; def.getKnockback(this);
      addParts(mx,my,'#aaa',14,5); addRing(mx,my,'#aaa',55);
      addDmg(mx,def.y-14,DMG_KB,'#ccc'); doShake(8);
      if(this.type==='sukuna') this.fugaCharge=Math.min(FUGA_CHARGE_REQ,this.fugaCharge+DMG_KB);
      if(this.type==='gojo')   this.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,this.hollowCharge+DMG_KB);
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+DMG_KB);
    } else {
      this.combo++; def.getStun(this);
      addParts(mx,my,'#aaa',7,3); addRing(mx,my,'#888',28);
      addDmg(mx,def.y-14,DMG_HIT,'#ccc'); doShake(3);
      if(this.type==='sukuna') this.fugaCharge=Math.min(FUGA_CHARGE_REQ,this.fugaCharge+DMG_HIT);
      if(this.type==='gojo')   this.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,this.hollowCharge+DMG_HIT);
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+DMG_HIT);
      // Yuji: 3rd hit activates Black Flash minigame
      if(this.type==='yuji' && this.combo===3){
        this._startBlackFlashMinigame(def);
      }
    }
  }

  getStun(atk){
    // Cancel cleave windup if in progress
    if(this.state===S.CLEAVE){ this.cleaveArm=0; this.cleaveCooldown=0; }
    if(this.state===S.FUGA){ this.fugaArm=0; }
    this.hp=Math.max(0,this.hp-DMG_HIT); this.flash=200;
    if(this.hp<=0){this._initRd(atk.facing*5,-4.5,.11*atk.facing);this.ss(S.DEAD);return;}
    this.vx=atk.facing*2; this.ss(S.STUN,STUN_MS);
  }
  getKnockback(atk){
    if(this.state===S.CLEAVE){ this.cleaveArm=0; this.cleaveCooldown=0; }
    if(this.state===S.FUGA){ this.fugaArm=0; }
    this.hp=Math.max(0,this.hp-DMG_KB); this.flash=320;
    if(this.hp<=0){this._initRd(atk.facing*10,-7,.13*atk.facing);this.ss(S.DEAD);return;}
    this._initRd(atk.facing*10.5,-7,.13*atk.facing); this.ss(S.RAGD,RAGD_MS);
  }
  getSlam(atk){
    this.hp=Math.max(0,this.hp-DMG_SLAM); this.flash=400;
    if(this.hp<=0){this._initRd(atk.facing*4,-1,.05*atk.facing);this.ss(S.DEAD);return;}
    this.x=this.rdX; this.y=this.rdY=GND-PH;
    this._initRd(atk.facing*4,0,.05*atk.facing); this.ss(S.SLAM,SLAM_MS);
  }
  _initRd(vx,vy,angV){ this.rdX=this.x;this.rdY=this.y;this.rdVx=vx;this.rdVy=vy;this.rdRot=0;this.rdAngV=angV; }

  draw(){
    const phys=[S.RAGD,S.SLAM,S.DEAD].includes(this.state);
    ctx.save();
    if(this.flash>0) ctx.globalAlpha=.45+.55*Math.abs(Math.sin(this.flash*.055));
    this._shadow();
    if(phys){
      ctx.translate(this.rdX+PW/2,this.rdY+PH/2); ctx.rotate(this.rdRot); this._stick(0,0);
    } else if(this.state===S.DIVE){
      ctx.translate(this.x+PW/2,this.y+PH/2); ctx.rotate(this.facing*.85); this._stick(0,0);
    } else if(this.state===S.CLEAVE && this.cleaveAir){
      // Body tilts to match aimed angle
      ctx.translate(this.x+PW/2,this.y+PH/2);
      ctx.rotate(this.cleaveAimAngle * this.facing * 0.75);
      this._stick(0,0);
    } else if(this.state===S.REVERSAL && this.reversalAir){
      ctx.translate(this.x+PW/2,this.y+PH/2);
      ctx.rotate(this.reversalAimAngle * this.facing * 0.75);
      this._stick(0,0);
    } else {
      this._stick(this.x+PW/2,this.y+PH/2);
    }
    ctx.restore();

    // Flashing red outline when dismantle is out of range
    if(this.dismantleOutline > 0){
      const pulse = Math.abs(Math.sin(this.dismantleOutline * 0.018));
      ctx.save();
      ctx.globalAlpha = pulse * 0.85;
      ctx.strokeStyle = '#f00';
      ctx.lineWidth = 2.5;
      const pad = 6;
      ctx.strokeRect(this.x - pad, this.y - pad, PW + pad*2, PH + pad*2);
      ctx.restore();
    }

    // Yuji: red outline flash when Piercing Blood is fully charged
    if(this.type==='yuji' && this.pbChargeTime >= PB_CHARGE_MAX){
      const t2 = Date.now();
      // Rapid erratic flicker — multiple sine waves at different speeds
      const flicker = Math.abs(Math.sin(t2*0.022)) * Math.abs(Math.sin(t2*0.007+1.3)) + 0.3;
      const pad = 7;
      ctx.save();
      // Outer glow
      ctx.globalAlpha = flicker * 0.5;
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 22;
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 6;
      ctx.strokeRect(this.x - pad - 2, this.y - pad - 2, PW + (pad+2)*2, PH + (pad+2)*2);
      // Inner sharp outline
      ctx.globalAlpha = 0.6 + flicker * 0.4;
      ctx.shadowBlur = 8;
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(this.x - pad, this.y - pad, PW + pad*2, PH + pad*2);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Air cleave aim indicator
    if(this.state===S.CLEAVE && this.cleaveAir){
      const ox = this.x + PW/2;
      const oy = this.y + PH*0.32;
      const ang = this.cleaveAimAngle;
      const lineLen = 55;
      const ex2 = ox + this.facing * Math.cos(ang) * lineLen;
      const ey2 = oy + Math.sin(ang) * lineLen;
      const pulse = 0.45 + 0.45 * Math.abs(Math.sin(Date.now() * 0.008));
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex2, ey2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex2, ey2, 2.5, 0, Math.PI*2); ctx.fill();
      const barW = 36;
      const barPct = this.cleaveAimTime / AIR_CLEAVE_AIM;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(ox - barW/2, this.y - 12, barW, 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(ox - barW/2, this.y - 12, barW * barPct, 4);
      ctx.restore();
    }

    // Air reversal aim indicator
    if(this.state===S.REVERSAL && this.reversalAir){
      const ox = this.x + PW/2;
      const oy = this.y + PH*0.3;
      const ang = this.reversalAimAngle;
      const lineLen = 60;
      const ex2 = ox + this.facing * Math.cos(ang) * lineLen;
      const ey2 = oy + Math.sin(ang) * lineLen;
      const pulse = 0.45 + 0.45*Math.abs(Math.sin(Date.now()*0.008));
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#f44';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex2, ey2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#f44';
      ctx.beginPath(); ctx.arc(ex2, ey2, 3, 0, Math.PI*2); ctx.fill();
      const barW = 36;
      const barPct = this.reversalAimTime / AIR_CLEAVE_AIM;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(ox - barW/2, this.y - 12, barW, 4);
      ctx.fillStyle = '#f44';
      ctx.fillRect(ox - barW/2, this.y - 12, barW * barPct, 4);
      ctx.restore();
    }

    // Hollow Purple windup — two balls converge into one
    if(this.state===S.HOLLOW){
      const cx = this.x + PW/2;
      const cy = this.y + PH*0.3;
      const prog = this.hollowArm; // 0→1
      const t = Date.now();

      // Orbit radius shrinks as they converge
      const orbitR = 50 * (1 - prog);
      // Convergence point (in front of Gojo)
      const targetX = cx + this.facing * 30;

      // Red ball position — starts behind, orbits in
      const redAng = -Math.PI*0.4 + prog * Math.PI*0.4;
      const rx = cx + Math.cos(redAng) * orbitR * this.facing + this.facing * 30*prog;
      const ry = cy + Math.sin(redAng) * orbitR * 0.5;

      // Blue ball position — starts above-front, orbits in
      const blueAng = Math.PI*0.4 - prog * Math.PI*0.4;
      const bx2 = cx + Math.cos(blueAng) * orbitR * this.facing + this.facing * 30*prog;
      const by2 = cy + Math.sin(blueAng) * orbitR * 0.5;

      const ballR = 9 + prog * 5;

      if(prog < 0.9){
        // Draw red ball
        ctx.save();
        ctx.globalAlpha = 1 - prog*1.1;
        const rg = ctx.createRadialGradient(rx,ry,0,rx,ry,ballR);
        rg.addColorStop(0,'rgba(255,200,200,1)');
        rg.addColorStop(0.4,'rgba(255,50,50,1)');
        rg.addColorStop(1,'rgba(180,0,0,0)');
        ctx.fillStyle=rg;
        ctx.beginPath(); ctx.arc(rx,ry,ballR,0,Math.PI*2); ctx.fill();
        ctx.restore();

        // Draw blue ball
        ctx.save();
        ctx.globalAlpha = 1 - prog*1.1;
        const bg2 = ctx.createRadialGradient(bx2,by2,0,bx2,by2,ballR);
        bg2.addColorStop(0,'rgba(200,220,255,1)');
        bg2.addColorStop(0.4,'rgba(40,120,255,1)');
        bg2.addColorStop(1,'rgba(0,40,200,0)');
        ctx.fillStyle=bg2;
        ctx.beginPath(); ctx.arc(bx2,by2,ballR,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // Purple merged ball grows as they converge
      if(prog > 0.5){
        const mergeAlpha = (prog-0.5)*2;
        const mergeR = (prog-0.5) * HOLLOW_BALL_R * 2.2;
        const pulse = 0.88+0.12*Math.sin(t*0.018);
        ctx.save();
        ctx.globalAlpha = mergeAlpha;
        const pg = ctx.createRadialGradient(targetX,cy,0,targetX,cy,mergeR*pulse);
        pg.addColorStop(0,'rgba(255,255,255,1)');
        pg.addColorStop(0.3,'rgba(210,100,255,1)');
        pg.addColorStop(0.7,'rgba(130,0,220,0.8)');
        pg.addColorStop(1,'rgba(80,0,160,0)');
        ctx.fillStyle=pg;
        ctx.beginPath(); ctx.arc(targetX,cy,mergeR*pulse,0,Math.PI*2); ctx.fill();
        // Pulsing ring
        ctx.globalAlpha = mergeAlpha * 0.6;
        ctx.strokeStyle='#c080ff'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(targetX,cy,mergeR*1.4,0,Math.PI*2); ctx.stroke();
        ctx.restore();
        ctx.globalAlpha=1;
      }
    }
    // Yuji Black Flash minigame overlay
    if(this.type==='yuji') this._drawBlackFlashMinigame();
  }

  _shadow(){
    const dist=GND-(this.y+PH), sc=Math.max(.15,1-dist/280);
    ctx.save(); ctx.globalAlpha=.18*sc; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(this.x+PW/2,GND+4,20*sc,5*sc,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  _stick(cx,cy){
    const f      = this.facing;
    const isAtk  = this.state===S.ATCK&&this.atkPhase===1;
    const aa     = isAtk?this.atkAnim:0;
    const isCleave = this.state===S.CLEAVE;
    const ca     = isCleave ? this.cleaveArm : 0;
    const isDismantle = this.state===S.DISMANTLE;
    const da     = isDismantle ? this.dismantleArm : 0;
    const isReversal = this.state===S.REVERSAL;
    const ra     = isReversal ? this.reversalArm : 0;
    const walking= this.state===S.WALK;
    const wt     = this.walkT;
    const main   = this.charColor;
    const dim    = this.charDimColor;

    const top   = -PH/2;
    const headY = top+HEAD_R+1;
    const neckY = headY+HEAD_R+3;
    const hipY  = neckY+BODY_H;
    const footY = hipY+LEG_H;

    // Yuji Piercing Blood charging — crouch offset
    const pbCharge = (this.type==='yuji') ? Math.min(1, this.pbChargeTime / PB_CHARGE_MAX) : 0;
    const crouchY  = pbCharge * 7; // squat down

    const legA = walking?Math.sin(wt)*20:0;
    const bob  = walking?Math.abs(Math.sin(wt*2))*3:0;

    ctx.lineCap='round'; ctx.lineJoin='round';

    // Back leg (crouched when charging)
    {
      const legSwB=walking?Math.sin(wt+Math.PI)*20:0;
      const kx=cx+f*(-6), ky=cy+hipY+11+bob+crouchY*1.5;
      const fx=cx+f*(-6)-legSwB*f*.7, fy=cy+footY+bob;
      ctx.strokeStyle=dim; ctx.lineWidth=LIMB_W*.85;
      ctx.beginPath(); ctx.moveTo(cx,cy+hipY+bob+crouchY); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+f*6,fy); ctx.stroke();
    }
    // Back arm (folds inward when charging PB)
    {
      const armSwB=walking?Math.sin(wt)*12:0;
      let ex,ey,hx,hy;
      if(pbCharge>0){
        // Back arm folds inward to clasp at center — mirrors front arm
        ex=cx+f*(-10+pbCharge*13); ey=cy+neckY+8+bob+crouchY*0.5+pbCharge*6;
        hx=cx+f*(-2 +pbCharge*4 ); hy=cy+neckY+16+bob+crouchY*0.5+pbCharge*5;
      } else if(this.state===S.BLACKBLUR){
        const bp=this.bbPhase, ba=this.bbAnimProg;
        if(bp===1){
          // Punch 1: back arm cocks back for next hit
          const pull = ba < 0.5 ? 0 : (ba-0.5)/0.5;
          ex=cx+f*(-10-pull*8); ey=cy+neckY+8+bob-pull*6;
          hx=cx+f*(-16-pull*10); hy=cy+neckY+18+bob-pull*8;
        } else if(bp===2){
          // Punch 2: back arm (this one is the hooker) swings across
          const punch = ba < 0.45 ? ba/0.45 : 1-(ba-0.45)/0.55;
          const pEase = punch*(2-punch);
          ex=cx+f*(-10+pEase*20); ey=cy+neckY+6+bob - pEase*8;
          hx=cx+f*(-14+pEase*30); hy=cy+neckY+14+bob - pEase*12;
        } else if(bp===3){
          // Guard: back fist raised
          ex=cx+f*(-6); ey=cy+neckY+4+bob;
          hx=cx+f*(-10); hy=cy+neckY-2+bob;
        } else if(bp===4){
          // Kick: arms swing back for balance
          const kick = ba*(2-ba);
          ex=cx+f*(-8-kick*6); ey=cy+neckY+6+bob+kick*4;
          hx=cx+f*(-14-kick*8); hy=cy+neckY+16+bob+kick*6;
        } else {
          ex=cx+f*(-10)-armSwB*f*.4; ey=cy+neckY+8+bob;
          hx=cx+f*(-16)-armSwB*f*.8; hy=cy+neckY+20+bob;
        }
      } else {
        ex=cx+f*(-10)-armSwB*f*.4; ey=cy+neckY+8+bob;
        hx=cx+f*(-16)-armSwB*f*.8; hy=cy+neckY+20+bob;
      }
      ctx.strokeStyle=dim; ctx.lineWidth=LIMB_W*.85;
      ctx.beginPath(); ctx.moveTo(cx,cy+neckY+bob+crouchY*0.5); ctx.lineTo(ex,ey); ctx.lineTo(hx,hy); ctx.stroke();
    }
    // Torso (shifts down with crouch)
    ctx.strokeStyle=main; ctx.lineWidth=LIMB_W*1.5;
    ctx.beginPath(); ctx.moveTo(cx,cy+neckY+bob+crouchY*0.5); ctx.lineTo(cx,cy+hipY+bob+crouchY); ctx.stroke();
    // Front leg (crouched, or kick animation)
    {
      const isBBKick = this.state===S.BLACKBLUR && this.bbPhase===4;
      const kick = isBBKick ? this.bbAnimProg*(2-this.bbAnimProg) : 0;
      // Kick: knee raises then snaps forward
      const kx = isBBKick ? cx+f*(6+kick*12) : cx+f*6;
      const ky = isBBKick
        ? cy+hipY+11+bob - kick*28     // knee comes up high
        : cy+hipY+11+bob+crouchY*1.5;
      const fx = isBBKick
        ? cx+f*(8+kick*30)             // foot shoots forward
        : cx+f*6+legA*f*.7;
      const fy = isBBKick
        ? cy+footY+bob - kick*12       // foot rises with kick
        : cy+footY+bob;
      ctx.strokeStyle=main; ctx.lineWidth=LIMB_W;
      ctx.beginPath(); ctx.moveTo(cx,cy+hipY+bob+crouchY); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+f*6,fy); ctx.stroke();
      // Draw fist/foot dot at kick impact point
      if(isBBKick && kick>0.5){
        ctx.fillStyle=main; ctx.beginPath(); ctx.arc(fx,fy,4,0,Math.PI*2); ctx.fill();
      }
    }
    // Front arm (punch / cleave raise)
    {
      let ex,ey,hx,hy;
      if(isAtk){
        if(aa<0.4){
          const t2=aa/0.4;
          ex=cx+f*8-f*10*t2;  ey=cy+neckY+6+bob;
          hx=cx+f*14-f*18*t2; hy=cy+neckY+14+bob;
        } else {
          const t2=(aa-0.4)/0.6, ease=t2*(2-t2);
          ex=cx+f*(-2)+f*18*ease; ey=cy+neckY+6+bob-4*ease;
          hx=cx+f*(-4)+f*36*ease; hy=cy+neckY+14+bob-8*ease;
        }
      } else if(isCleave){
        // Arm sweeps down on ground; points in aim direction during air variant
        if(this.cleaveAir){
          // Arm extends in the aimed direction
          const ang = this.cleaveAimAngle;
          const armLen1 = 14, armLen2 = 14;
          ex = cx + f * (armLen1 * Math.cos(ang));
          ey = cy + neckY + 10 + bob + armLen1 * Math.sin(ang);
          hx = cx + f * ((armLen1+armLen2) * Math.cos(ang));
          hy = cy + neckY + 10 + bob + (armLen1+armLen2) * Math.sin(ang);
        } else {
          const sweep = ca * 42;
          const startRaise = 28;
          ex=cx+f*10; ey=cy+neckY+6+bob - startRaise + sweep*0.5;
          hx=cx+f*(14+ca*8); hy=cy+neckY+14+bob - startRaise + sweep;
        }
      } else if(isDismantle){
        // Arm thrusts straight up, palm open toward enemy
        const raise = da * 42;
        ex=cx+f*6;          ey=cy+neckY+4+bob - raise*0.45;
        hx=cx+f*8;          hy=cy+neckY+10+bob - raise;
      } else if(this.state===S.FUGA){
        // Bow draw: arm pulls back then thrusts forward
        const fa = this.fugaArm;
        // Pull back phase (0→0.6): hand draws backward
        // Release (0.6→1): snaps forward fast
        if(fa < 0.6){
          const t2 = fa/0.6;
          ex=cx+f*(10-t2*22); ey=cy+neckY+5+bob - t2*8;
          hx=cx+f*(16-t2*30); hy=cy+neckY+12+bob - t2*14;
        } else {
          const t2=(fa-0.6)/0.4, ease=1-(1-t2)*(1-t2);
          ex=cx+f*(-12+ease*28); ey=cy+neckY+5+bob - 8 + ease*6;
          hx=cx+f*(-14+ease*38); hy=cy+neckY+12+bob - 14 + ease*10;
        }
      } else if(isReversal){
        // Arm raises then thrusts forward to fire
        const raise = Math.min(1, ra*2) * 28;
        const thrust = Math.max(0, ra*2-1);
        ex=cx+f*(8 + thrust*10); ey=cy+neckY+5+bob - raise + thrust*raise*0.6;
        hx=cx+f*(14 + thrust*22); hy=cy+neckY+12+bob - raise + thrust*raise*0.8;
      } else if(this.state===S.DOMAIN){
        // Hand sign: both arms raised and clasped together in front
        const dh = this.domainHandsign;
        const raise = dh * 20;
        // Front arm comes up and inward
        ex=cx+f*(8 - dh*10); ey=cy+neckY+6+bob - raise*0.6;
        hx=cx+f*(6 - dh*8);  hy=cy+neckY+12+bob - raise;
      } else if(this.type==='yuji' && this.pbChargeTime > 0){
        // Piercing Blood: front arm folds inward, hands clasp at center
        const charge = Math.min(1, this.pbChargeTime / PB_CHARGE_MAX);
        ex = cx + f*(10 - charge*16); ey = cy + neckY + 6 + bob + charge*8;
        hx = cx + f*(2  - charge*3);  hy = cy + neckY + 16 + bob + charge*6;
      } else if(this.state===S.BLACKBLUR){
        const bp = this.bbPhase, ba = this.bbAnimProg;
        const ease = ba*(2-ba); // ease out

        if(bp===0){
          // LUNGE: arm sweeps back, body leans
          ex=cx+f*(8 - ease*16); ey=cy+neckY+6+bob - ease*4;
          hx=cx+f*(12- ease*22); hy=cy+neckY+14+bob - ease*6;
        } else if(bp===1){
          // PUNCH 1: right jab thrusts far forward fast then retracts
          const punch = ba < 0.45 ? ba/0.45 : 1-(ba-0.45)/0.55;
          const pEase = punch*(2-punch);
          ex=cx+f*(8 + pEase*18); ey=cy+neckY+5+bob - pEase*6;
          hx=cx+f*(14+ pEase*32); hy=cy+neckY+10+bob - pEase*10;
        } else if(bp===2){
          // PUNCH 2: left hook — arm swings across from the other side
          const punch = ba < 0.45 ? ba/0.45 : 1-(ba-0.45)/0.55;
          const pEase = punch*(2-punch);
          // Hook comes from the inside going outward
          ex=cx+f*(6 - pEase*4) ; ey=cy+neckY+8+bob - pEase*10;
          hx=cx+f*(10+ pEase*20); hy=cy+neckY+18+bob - pEase*16;
        } else if(bp===3){
          // SLOW / MINIGAME: fighting guard stance — both fists raised
          ex=cx+f*6; ey=cy+neckY+4+bob;
          hx=cx+f*10; hy=cy+neckY-4+bob;
        } else {
          // KICK (phase 4): leg swings up and snaps out
          // Front arm swings back for balance
          ex=cx+f*(-6); ey=cy+neckY+8+bob;
          hx=cx+f*(-14); hy=cy+neckY+18+bob;
        }
      } else {
        const armSwF=walking?Math.sin(wt+Math.PI)*12:0;
        ex=cx+f*10+armSwF*f*.4; ey=cy+neckY+8+bob;
        hx=cx+f*16+armSwF*f*.8; hy=cy+neckY+20+bob;
      }
      ctx.strokeStyle = (isCleave||isDismantle) ? `rgba(200,200,200,${0.5+(isCleave?ca:da)*0.5})` : main;
      ctx.lineWidth=LIMB_W;
      ctx.beginPath(); ctx.moveTo(cx,cy+neckY+bob); ctx.lineTo(ex,ey); ctx.lineTo(hx,hy); ctx.stroke();
      if(isAtk){ ctx.fillStyle=main; ctx.beginPath(); ctx.arc(hx,hy,3.5,0,Math.PI*2); ctx.fill(); }
      if(isCleave && ca>0.3){
        ctx.shadowColor='#fff'; ctx.shadowBlur=14;
        ctx.fillStyle=`rgba(220,220,220,${ca})`;
        ctx.beginPath(); ctx.arc(hx,hy,4,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
      if(isDismantle && da>0.2){
        ctx.shadowColor='#88f'; ctx.shadowBlur=10;
        ctx.fillStyle=`rgba(180,180,255,${da*0.7})`;
        ctx.beginPath(); ctx.arc(hx,hy,3.5,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
      if(isReversal && ra>0.2){
        ctx.shadowColor='#f00'; ctx.shadowBlur=12;
        ctx.fillStyle=`rgba(255,80,80,${ra})`;
        ctx.beginPath(); ctx.arc(hx,hy,4,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
      if(this.state===S.DOMAIN && this.domainHandsign>0.2){
        // Dark cursed energy glow on hands
        ctx.shadowColor='#8a3000'; ctx.shadowBlur=16;
        ctx.fillStyle=`rgba(180,60,0,${this.domainHandsign*0.9})`;
        ctx.beginPath(); ctx.arc(hx,hy,5,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    // Neck
    ctx.strokeStyle=main; ctx.lineWidth=LIMB_W;
    ctx.beginPath(); ctx.moveTo(cx,cy+headY+HEAD_R); ctx.lineTo(cx,cy+neckY+bob); ctx.stroke();
    // Head
    ctx.lineWidth=LIMB_W; ctx.strokeStyle=main; ctx.fillStyle='#ccc';
    ctx.beginPath(); ctx.arc(cx,cy+headY+bob*.5,HEAD_R,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  drawHUD(x,flip){
    const y=16,bw=278,bh=20,bx=flip?x-bw:x;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(bx-2,y-2,bw+4,bh+4);
    const pct=this.hp/this.maxHp;
    const col=pct>.5?'#888':pct>.25?'#666':'#444';
    ctx.fillStyle=col; ctx.fillRect(flip?bx+bw-Math.floor(bw*pct):bx,y,Math.floor(bw*pct),bh);
    ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1; ctx.strokeRect(bx,y,bw,bh);
    ctx.fillStyle='#ccc'; ctx.font=`700 13px 'Rajdhani',sans-serif`;
    ctx.textAlign=flip?'right':'left'; ctx.fillText(this.name,flip?bx+bw-5:bx+5,y+14);
    for(let i=0;i<3;i++){
      const px=flip?bx+bw-14-(2-i)*16:bx+14+i*16;
      ctx.fillStyle=i<this.combo?'#ccc':'rgba(255,255,255,.1)';
      ctx.beginPath(); ctx.arc(px,y+bh+12,5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.stroke();
    }
    if(this.combo>=3){
      ctx.globalAlpha=.55+.45*Math.abs(Math.sin(Date.now()*.006));
      ctx.fillStyle='#ccc'; ctx.font=`700 11px 'Rajdhani',sans-serif`;
      ctx.textAlign=flip?'right':'left';
      ctx.fillText('FINISHER READY',flip?bx+bw-5:bx+5,y+bh+30);
      ctx.globalAlpha=1;
    }
    // Ability system HUD for Sukuna
    if(this.type==='sukuna'){
      const abilityNames = ['CLEAVE','DISMANTLE','FUGA'];
      const abY = y+bh+38;

      for(let i=0;i<3;i++){
        const aw=86, gap=4;
        const ax = flip ? bx+bw - (i+1)*(aw+gap) + gap : bx + i*(aw+gap);
        const selected = this.selectedAbility===i;

        // Cooldown/charge fill
        let fillPct=1;
        if(i===0) fillPct=Math.max(0,1-this.cleaveCooldown/CLEAVE_COOLDOWN);
        if(i===1) fillPct=Math.max(0,1-this.dismantleCooldown/DISMANTLE_COOLDOWN);
        if(i===2) fillPct=Math.min(1,this.fugaCharge/FUGA_CHARGE_REQ);

        const ready = fillPct>=1;
        const isUlt = i===2;

        ctx.fillStyle='rgba(0,0,0,0.55)';
        ctx.fillRect(ax,abY,aw,22);
        // Fill bar
        const barCol = isUlt ? (ready?'#ffe066':'#886600') : (ready?'#bbb':'#555');
        ctx.fillStyle=barCol;
        ctx.fillRect(ax, abY+18, Math.floor(aw*fillPct), 4);
        // Border — brighter if selected
        ctx.strokeStyle = selected ? '#fff' : 'rgba(255,255,255,0.2)';
        ctx.lineWidth = selected ? 1.8 : 1;
        ctx.strokeRect(ax,abY,aw,22);
        // Label
        const labelCol = !ready ? '#555' : isUlt ? '#ffe066' : '#ccc';
        ctx.fillStyle = labelCol;
        ctx.font=`700 9px 'Rajdhani',sans-serif`;
        ctx.textAlign='center';
        ctx.fillText(abilityNames[i], ax+aw/2, abY+13);
      }

      // "selected" triangle indicator
      ctx.textAlign='center';
      ctx.fillStyle='#fff';
      const aw=86,gap=4;
      const selAx = flip
        ? bx+bw-(this.selectedAbility+1)*(aw+gap)+gap + aw/2
        : bx + this.selectedAbility*(aw+gap) + aw/2;
      ctx.globalAlpha=0.6+0.4*Math.abs(Math.sin(Date.now()*0.006));
      ctx.font=`700 8px 'Rajdhani',sans-serif`;
      ctx.fillText('▲', selAx, abY+32);
      ctx.globalAlpha=1;
      ctx.fillStyle='#888'; ctx.font=`500 9px 'Rajdhani',sans-serif`;
      ctx.fillText(this.playerNum===1 ? '[H] SWITCH  [G] USE' : '[[] SWITCH  [P] USE', bx+bw/2, abY+42);

      // Domain charge bar
      const domY = abY+52;
      const domPct = Math.min(1, this.domainCharge/DOMAIN_CHARGE_REQ);
      const domReady = domPct>=1;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx,domY,bw,14);
      ctx.fillStyle = domReady
        ? `rgba(220,100,0,${0.7+0.3*Math.abs(Math.sin(Date.now()*0.005))})`
        : '#5a2200';
      ctx.fillRect(flip?bx+bw-Math.floor(bw*domPct):bx, domY, Math.floor(bw*domPct), 14);
      ctx.strokeStyle = domReady ? 'rgba(255,140,0,0.7)' : 'rgba(120,50,0,0.4)';
      ctx.lineWidth=1; ctx.strokeRect(bx,domY,bw,14);
      ctx.fillStyle = domReady ? '#ffcc88' : '#885533';
      ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
      ctx.fillText(domReady ? 'DOMAIN: MALEVOLENT SHRINE [T]' : `DOMAIN ${Math.floor(domPct*100)}%`, bx+bw/2, domY+10);
      if(!domReady && activeDomain && activeDomain.owner===this){
        ctx.fillStyle='#f80'; ctx.fillText('DOMAIN ACTIVE', bx+bw/2, domY+10);
      }
    }

    // Gojo ability HUD
    if(this.type==='gojo'){
      const abY = y+bh+38;
      const abilityNames = ['LAPSE: BLUE','REVERSAL: RED','HOLLOW PURPLE'];
      const cooldowns    = [this.lapseCooldown, this.reversalCooldown, 0];
      const cdMaxes      = [LAPSE_COOLDOWN, REVERSAL_COOLDOWN, 1];
      const charges      = [1, 1, Math.min(1, this.hollowCharge/HOLLOW_CHARGE_REQ)];
      const colors       = ['#4af','#f44','#c060ff'];
      const dimColors    = ['#246','#622','#502080'];

      for(let i=0;i<3;i++){
        const aw=86, gap=4;
        const ax = flip ? bx+bw-(i+1)*(aw+gap)+gap : bx+i*(aw+gap);
        const selected = this.gojoAbility===i;
        const fillPct = i<2 ? Math.max(0,1-cooldowns[i]/cdMaxes[i]) : charges[i];
        const ready = fillPct>=1;
        ctx.fillStyle='rgba(0,0,0,0.55)';
        ctx.fillRect(ax,abY,aw,22);
        ctx.fillStyle = ready ? colors[i] : dimColors[i];
        ctx.fillRect(flip?ax+aw-Math.floor(aw*fillPct):ax, abY+18, Math.floor(aw*fillPct), 4);
        ctx.strokeStyle = selected ? '#fff' : 'rgba(255,255,255,0.2)';
        ctx.lineWidth = selected ? 1.8 : 1;
        ctx.strokeRect(ax,abY,aw,22);
        const labelCol = !ready ? '#556' : i===0?'#adf':i===1?'#faa':'#e0b0ff';
        ctx.fillStyle = labelCol;
        ctx.font=`700 8px 'Rajdhani',sans-serif`;
        ctx.textAlign='center';
        ctx.fillText(abilityNames[i], ax+aw/2, abY+13);
      }
      // selector arrow
      const aw=86, gap=4;
      const selAx = flip
        ? bx+bw-(this.gojoAbility+1)*(aw+gap)+gap+aw/2
        : bx+this.gojoAbility*(aw+gap)+aw/2;
      ctx.globalAlpha=0.6+0.4*Math.abs(Math.sin(Date.now()*0.006));
      ctx.fillStyle='#fff'; ctx.font=`700 8px 'Rajdhani',sans-serif`; ctx.textAlign='center';
      ctx.fillText('▲', selAx, abY+32);
      ctx.globalAlpha=1;
      ctx.fillStyle='#888'; ctx.font=`500 9px 'Rajdhani',sans-serif`;
      ctx.fillText(this.playerNum===1 ? '[H] SWITCH  [G] USE' : '[[] SWITCH  [P] USE', bx+bw/2, abY+42);

      // Gojo domain charge bar
      const gDomY = abY+52;
      const gDomPct = Math.min(1, this.domainCharge/DOMAIN_CHARGE_REQ);
      const gDomReady = gDomPct>=1;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx,gDomY,bw,14);
      ctx.fillStyle = gDomReady ? `rgba(60,160,240,${0.7+0.3*Math.abs(Math.sin(Date.now()*0.005))})` : '#0a2a4a';
      ctx.fillRect(flip?bx+bw-Math.floor(bw*gDomPct):bx, gDomY, Math.floor(bw*gDomPct), 14);
      ctx.strokeStyle = gDomReady ? 'rgba(80,160,240,0.7)' : 'rgba(30,80,140,0.4)';
      ctx.lineWidth=1; ctx.strokeRect(bx,gDomY,bw,14);
      ctx.fillStyle = gDomReady ? '#8cf' : '#358';
      ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
      ctx.fillText(gDomReady ? 'DOMAIN: INFINITE VOID [Y]' : `DOMAIN ${Math.floor(gDomPct*100)}%`, bx+bw/2, gDomY+10);
    }

    // Yuji HUD
    if(this.type==='yuji'){
      const abY = y+bh+38;
      const pbLabel = this.playerNum===1 ? 'PIERCING BLOOD [G]' : 'PIERCING BLOOD [P]';
      const onCooldown = this.pbCooldown > 0;
      const isCharging = this.pbChargeTime > 0;
      const tier = this.pbChargeTime>=2000 ? 2 : this.pbChargeTime>=1000 ? 1 : 0;
      const fullyCharged = this.pbChargeTime >= PB_CHARGE_MAX;

      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx,abY,bw,14);

      if(onCooldown){
        // Cooldown: grey drain bar showing time remaining
        const cdPct = this.pbCooldown / PB_COOLDOWN;
        const cdW = Math.floor(bw * (1 - cdPct));
        ctx.fillStyle='#222'; ctx.fillRect(bx,abY,bw,14);
        ctx.fillStyle='#443333'; ctx.fillRect(flip?bx+bw-cdW:bx, abY, cdW, 14);
        // Animated stripe sweep
        ctx.globalAlpha=0.18;
        for(let sx2=0;sx2<bw;sx2+=12){
          const ox2 = ((Date.now()*0.04)%12);
          ctx.fillStyle='#fff';
          ctx.fillRect(bx+(sx2+ox2)%bw, abY, 5, 14);
        }
        ctx.globalAlpha=1;
        ctx.strokeStyle='rgba(100,40,40,0.5)'; ctx.lineWidth=1; ctx.strokeRect(bx,abY,bw,14);
        ctx.fillStyle='#775555'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`COOLDOWN  ${(this.pbCooldown/1000).toFixed(1)}s`, bx+bw/2, abY+10);
      } else if(isCharging){
        // Charging: fill red based on charge
        const chargePct = Math.min(1, this.pbChargeTime / PB_CHARGE_MAX);
        const barCol = fullyCharged ? '#ff2222' : tier===2 ? '#cc1111' : tier===1 ? '#880000' : '#550000';
        ctx.fillStyle=barCol;
        if(fullyCharged){
          // Pulse the whole bar when full
          ctx.globalAlpha = 0.7 + 0.3*Math.abs(Math.sin(Date.now()*0.015));
        }
        ctx.fillRect(flip?bx+bw-Math.floor(bw*chargePct):bx, abY, Math.floor(bw*chargePct), 14);
        ctx.globalAlpha=1;
        ctx.strokeStyle='rgba(200,0,0,0.5)'; ctx.lineWidth=1; ctx.strokeRect(bx,abY,bw,14);
        // Tier markers
        for(const m of [1000/PB_CHARGE_MAX, 2000/PB_CHARGE_MAX]){
          const mx2 = flip ? bx+bw-bw*m : bx+bw*m;
          ctx.strokeStyle='rgba(255,100,100,0.6)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(mx2,abY); ctx.lineTo(mx2,abY+14); ctx.stroke();
        }
        const dmgLabels = ['10▸','20▸▸','30 MAX▸▸▸'];
        ctx.fillStyle = fullyCharged ? '#ff6666' : '#ffaaaa';
        ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(fullyCharged ? '▸▸▸ MAX CHARGE ▸▸▸' : `CHARGING  ${dmgLabels[tier]}`, bx+bw/2, abY+10);
      } else {
        // Ready
        ctx.fillStyle='#330000'; ctx.fillRect(bx,abY,bw,14);
        ctx.strokeStyle='rgba(180,0,0,0.3)'; ctx.lineWidth=1; ctx.strokeRect(bx,abY,bw,14);
        ctx.fillStyle='#884444'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`${pbLabel}  —  hold to charge`, bx+bw/2, abY+10);
      }

      // Black Blur cooldown bar
      const bbLabel = this.playerNum===1 ? 'BLACK BLUR [H]' : 'BLACK BLUR [[]';
      const bbY = abY + 18;
      const bbOnCD = this.bbCooldown > 0;
      const bbInUse = this.state === S.BLACKBLUR;
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx,bbY,bw,12);
      if(bbOnCD){
        const cdPct2 = 1 - this.bbCooldown/BB_COOLDOWN;
        ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx,bbY,bw,12);
        ctx.fillStyle='#222233'; ctx.fillRect(flip?bx+bw-Math.floor(bw*cdPct2):bx,bbY,Math.floor(bw*cdPct2),12);
        ctx.globalAlpha=0.15;
        for(let sx2=0;sx2<bw;sx2+=12){
          const ox2=((Date.now()*0.04)%12);
          ctx.fillStyle='#fff'; ctx.fillRect(bx+(sx2+ox2)%bw,bbY,5,12);
        }
        ctx.globalAlpha=1;
        ctx.fillStyle='#556'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`${bbLabel}  CD ${(this.bbCooldown/1000).toFixed(1)}s`, bx+bw/2, bbY+9);
      } else if(bbInUse){
        ctx.fillStyle='#334'; ctx.fillRect(bx,bbY,bw,12);
        const pulse=0.6+0.4*Math.abs(Math.sin(Date.now()*0.012));
        ctx.globalAlpha=pulse; ctx.fillStyle='#aaccff';
        ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText('▸▸▸ BLACK BLUR ACTIVE ▸▸▸', bx+bw/2, bbY+9);
        ctx.globalAlpha=1;
      } else {
        ctx.fillStyle='#1a1a2a'; ctx.fillRect(bx,bbY,bw,12);
        ctx.strokeStyle='rgba(80,80,160,0.4)'; ctx.lineWidth=1; ctx.strokeRect(bx,bbY,bw,12);
        ctx.fillStyle='#6688aa'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`${bbLabel}  —  lunge combo`, bx+bw/2, bbY+9);
      }
    }
  }
}

function overlaps(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

function buildPlayer(charIdx, startX, facing, ctrl, playerNum){
  const ch = CHARACTERS[charIdx] || CHARACTERS[0];
  return new Player({
    x: startX,
    name: ch.name,
    type: ch.type,
    facing,
    ctrl,
    charColor: ch.color,
    charDimColor: ch.dimColor,
    playerNum: playerNum
  });
}

const bgKanji=[{ch:'呪',x:88,y:200,s:115,a:.04},{ch:'術',x:790,y:178,s:115,a:.04},{ch:'廻',x:440,y:260,s:88,a:.025}];
const driftP=Array.from({length:28},()=>({x:Math.random()*W,y:Math.random()*H,vy:-(0.14+Math.random()*.3),r:.5+Math.random()*1.2,a:.05+Math.random()*.1}));

function drawBG(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#3a3830'); bg.addColorStop(.5,'#2e2c26'); bg.addColorStop(1,'#242220');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.018)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GND);ctx.stroke();}
  for(let y=60;y<GND;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const k of bgKanji){ctx.font=`${k.s}px serif`;ctx.fillStyle='#888';ctx.globalAlpha=k.a;ctx.fillText(k.ch,k.x,k.y);}
  ctx.globalAlpha=1; ctx.textBaseline='alphabetic';
  for(const p of driftP){p.y+=p.vy;if(p.y<0)p.y=H;ctx.globalAlpha=p.a;ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  const gf=ctx.createLinearGradient(0,GND,0,H);
  gf.addColorStop(0,'#1e1c18'); gf.addColorStop(1,'#141210');
  ctx.fillStyle=gf; ctx.fillRect(0,GND,W,H-GND);
  ctx.strokeStyle='rgba(200,195,185,.38)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,GND); ctx.lineTo(W,GND); ctx.stroke();
}

function drawHUDOverlay(){
  ctx.textAlign='center'; ctx.font=`700 14px 'Rajdhani',sans-serif`;
  ctx.fillStyle='rgba(200,195,185,.2)'; ctx.fillText('CURSED CLASH',W/2,30);
  p1.drawHUD(22,false); p2.drawHUD(W-22,true);
  // Lives indicators — drawn below the HUD ability bars
  const livesY = 130;
  for(let i=0;i<3;i++){
    const px = 22 + i*16;
    ctx.fillStyle = i<p1lives ? '#cc2222' : 'rgba(180,50,50,0.15)';
    ctx.strokeStyle = i<p1lives ? '#ff4444' : 'rgba(180,50,50,0.3)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(px, livesY, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  for(let i=0;i<3;i++){
    const px = W-22 - i*16;
    ctx.fillStyle = i<p2lives ? '#cc2222' : 'rgba(180,50,50,0.15)';
    ctx.strokeStyle = i<p2lives ? '#ff4444' : 'rgba(180,50,50,0.3)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(px, livesY, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
}
