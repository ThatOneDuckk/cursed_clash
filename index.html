          this.yujiUltCharge=Math.min(YUJI_ULT_COST,this.yujiUltCharge+BB_DMG_HIT);
        }
        // Enter slow motion + minigame
        timeScale = 0.18;
        this.bbPhase = 3; this.bbTimer = 0;
        this.bfActive = true;
        this.bfTimer = BB_SLOW_DUR * (1/0.18);
        this.bfGoalPos = BF_BAR_W * 0.5 - BF_GOAL_W/2;
        this.bfLinePos = 0; this.bfLineDir = 1;
        this.bfWon = false; this.bfWindowTimer = 0;
        this.bfAtkDown = true;
        this.bfStunnedEnemy = def;
      }

    } else if(this.bbPhase === 3){
      // SLOW MOTION + MINIGAME — one pass, real-time timed
      this.vx = 0;
      const realDt = dt / timeScale; // undo time scaling so minigame runs at real speed

      const bbKey = keys[this.abilityCycleKey];
      const bbEdge = bbKey && !this.bfAtkDown;
      this.bfAtkDown = !!bbKey;

      // Line moves left to right only — one pass, no bounce
      this.bfLinePos += BB_LINE_SPEED * realDt * 0.12;

      if(bbEdge){
        // Goal check: expand by line half-width (1.5px) so visual overlap matches
        const gl = this.bfGoalPos - 1.5;
        const gr = this.bfGoalPos + BF_GOAL_W + 1.5;
        if(this.bfLinePos >= gl && this.bfLinePos <= gr){
          // HIT — immediately fire BF kick, skip straight to it
          this.bbGotBF = true;
          this.bfActive = false;
          timeScale = 1;
          this._executeBBKick(def);
          return;
        }
      }

      // Line reached end or already missed — end minigame
      if(this.bfLinePos >= BF_BAR_W){
        timeScale = 1;
        this.bfActive = false;
        this.bbPhase = 4; this.bbTimer = 0;
      }

    } else if(this.bbPhase === 4){
      // Normal kick (minigame missed/timed out)
      this.bbAnimProg = Math.min(1, this.bbTimer / BB_KICK_DUR);
      this.vx = 0;
      if(this.bbTimer >= BB_KICK_DUR){
        this._executeBBKick(def);
      }

    } else {
      // DONE
      timeScale=1;
      this.bbCooldown = BB_COOLDOWN;
      this.bbHitTarget=false; this.bbGotBF=false;
      this.ss(this.onGround ? S.IDLE : S.AIR);
    }
  }

  _startYujiUlt(){
    this.ss(S.YUJIULT);
    this.vx=0; this.vy=0;
    this.yujiUltPhase=0; this.yujiUltTimer=0; this.yujiUltCleavesFired=0;
    this.yujiUltCharge=0; // consumed on use
    addParts(this.x+PW/2, this.y+PH/2, '#f5a623', 14, 6);
    doShake(6);
  }

  _tickYujiUlt(dt, other){
    if([S.STUN,S.RAGD,S.DEAD].includes(this.state) && this.state!==S.YUJIULT){ this.ss(S.IDLE); return; }
    this.vx=0;
    if(this.onGround) this.vy=0;
    this.yujiUltTimer += dt;

    // Phase 0: hood pull animation (stand still menacingly)
    if(this.yujiUltPhase===0){
      if(this.yujiUltTimer >= YUJI_ULT_HOOD_DUR){
        this.yujiUltPhase=1; this.yujiUltTimer=0;
      }
    }
    // Phase 1: speech bubble "Dismantle."
    else if(this.yujiUltPhase===1){
      if(this.yujiUltTimer >= YUJI_ULT_BUBBLE_DUR){
        this.yujiUltPhase=2; this.yujiUltTimer=0;
      }
    }
    // Phase 2: fire 1 giant cleave
    else if(this.yujiUltPhase===2){
      if(this.yujiUltCleavesFired===0 && this.yujiUltTimer >= 100){
        const sx = this.x + (this.facing===1 ? PW+10 : -10);
        const sy = this.y + PH*0.35;
        addGiantCleave(sx, sy, this.facing, this);
        addParts(sx, sy, '#fff', 18, 8);
        addRing(sx, sy, '#fff', 90);
        doShake(16);
        this.yujiUltCleavesFired=1;
      }
      if(this.yujiUltCleavesFired>=1 && this.yujiUltTimer >= 600){
        this.yujiUltCooldown = YUJI_ULT_COOLDOWN;
        this.ss(S.IDLE);
      }
    }
  }

  _drawYujiUlt(){
    if(this.state !== S.YUJIULT) return;
    const px = this.x + PW/2;
    const cx = px;
    const cy = this.y + PH/2;
    const t = Date.now();
    ctx.save();

    // ── SPEECH BUBBLE "Dismantle." ──
    if(this.yujiUltPhase===1){
      const bubbleAlpha = Math.min(1, this.yujiUltTimer/180);
      const bx = cx + this.facing * 42;
      const by = this.y - 10;
      const bw = 88, bh = 32;

      ctx.globalAlpha = bubbleAlpha;

      // Jagged bubble background (white)
      const pts = [];
      const steps = 14;
      for(let i=0;i<steps;i++){
        const angle = (i/steps)*Math.PI*2;
        const r = (i%2===0) ? Math.max(bw,bh)*0.62 : Math.max(bw,bh)*0.52;
        pts.push([bx + Math.cos(angle)*r*(bw/(bw+bh)), by + Math.sin(angle)*r*(bh/(bw+bh))]);
      }
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#111'; ctx.lineWidth=2;
      ctx.stroke();

      // Speech tail pointing toward Yuji
      const tailDir = -this.facing;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.moveTo(bx + tailDir*20, by+8);
      ctx.lineTo(bx + tailDir*36, by+18);
      ctx.lineTo(bx + tailDir*18, by+20);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.stroke();

      // Text
      ctx.fillStyle='#111';
      ctx.font=`700 13px 'Rajdhani',sans-serif`; ctx.textAlign='center';
      ctx.fillText('Dismantle.', bx, by+5);

      ctx.globalAlpha=1;
    }

    // ── CHARGE FLASH during cleave phase ──
    if(this.yujiUltPhase===2 && this.yujiUltCleavesFired<3){
      const pulse = 0.08+0.06*Math.abs(Math.sin(t*0.02));
      ctx.globalAlpha=pulse;
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;
    }

    ctx.restore();
    ctx.globalAlpha=1;
  }


  _startYutaCopyTouch(other){
    // Close-range instant touch like Dismantle
    const def = other;
    const dist = Math.abs((this.x+PW/2)-(def.x+PW/2));
    if(dist > YUTA_COPY_ULT_RANGE){
      // Too far — flash outline hint
      this.dismantleOutline=600; return;
    }
    // Deal touch damage
    if(def.hittable){
      def.hp=Math.max(0,def.hp-YUTA_COPY_ULT_DMG); def.flash=300;
      addDmg(def.x+PW/2, def.y-18, YUTA_COPY_ULT_DMG, '#ff88cc');
      addParts(def.x+PW/2, def.y+PH/2, '#ff88cc', 14, 6);
      addRing(def.x+PW/2, def.y+PH/2, '#ff88cc', 60);
      doShake(8);
      // Copy their ult
      this.yutaCopiedUlt = def.type;
      this.yutaCopyUltCharge = 0; // consumed
      if(def.hp<=0){ def._initRd(this.facing*4,-3,.07); def.ss(S.DEAD); }
      else { def.vx=this.facing*2; def.ss(S.STUN,500); }
    }
  }

  _fireYutaCopiedUlt(other){
    const copied = this.yutaCopiedUlt;
    this.yutaCopiedUlt = null; // revert to Copy after use

    if(copied==='yuji'){
      // Yuji's charge ult: giant Dismantle cleave
      const sx=this.x+(this.facing===1?PW+10:-10), sy=this.y+PH*0.35;
      addGiantCleave(sx,sy,this.facing,this);
      addParts(sx,sy,'#fff',18,8); addRing(sx,sy,'#fff',90); doShake(16);
    } else if(copied==='gojo'){
      // Gojo's charge ability: Hollow Purple
      if(this.hollowCharge===undefined) this.hollowCharge=HOLLOW_CHARGE_REQ;
      else this.hollowCharge=HOLLOW_CHARGE_REQ;
      if(![S.STUN,S.RAGD,S.SLAM,S.DEAD].includes(this.state)) this._startHollowPurple();
    } else if(copied==='sukuna'){
      // Sukuna's charge ability: Fuga
      if(this.fugaCharge===undefined) this.fugaCharge=FUGA_CHARGE_REQ;
      else this.fugaCharge=FUGA_CHARGE_REQ;
      if(![S.STUN,S.RAGD,S.SLAM,S.DEAD].includes(this.state)) this._startFuga();
    } else if(copied==='yuta'){
      // Another Yuta — get a free Slice & Dice
      if(this.yutaSliceCooldown<=0) this._startYutaSlice();
    }
  }

  _startYutaFist(){
    this.ss(S.YUTAFIST);
    this.yutaFistPhase = 0;  // 0=sheathe, 1=aim arc, 2=slam down, 3=explode
    this.yutaFistTimer = 0;
    this.yutaFistAimX  = this.x; // horizontal aim position
    this.yutaFistY     = this.y; // saved ground-level Y
    this.yutaFistGlowAnim = 0;
    this.yutaSwordVisible = false; // hide sword during fist mode
    this.vx = 0; this.vy = 0;
  }

  _tickYutaFist(dt, other){
    if([S.RAGD,S.DEAD].includes(this.state)){ this.yutaSwordVisible=true; this.ss(S.IDLE); return; }
    this.yutaFistTimer += dt;

    if(this.yutaFistPhase===0){
      // Sheathing — stand still, sword fades
      this.vx=0;
      if(this.onGround) this.vy=0;
      if(this.yutaFistTimer >= YUTAFIST_SHEATHE_DUR){
        this.yutaFistPhase=1; this.yutaFistTimer=0;
        // Launch into arc — start floating above ground
        this.vy = -8; // reduced upward velocity for 3/4 arena height
        this.yutaFistAimX = this.x + this.facing * 80;
      }

    } else if(this.yutaFistPhase===1){
      // Aim phase: float in slow arc, steer L/R
      this.yutaFistGlowAnim += dt * 0.012;
      const c = this.ctrl;
      if(keys[c.left])  this.yutaFistAimX -= YUTAFIST_AIM_SPD * (dt/16.67) * 2.5;
      if(keys[c.right]) this.yutaFistAimX += YUTAFIST_AIM_SPD * (dt/16.67) * 2.5;
      this.yutaFistAimX = Math.max(20, Math.min(W-PW-20, this.yutaFistAimX));

      // Float: gentle gravity, drift toward aim X
      this.vy = Math.min(this.vy + 0.18*(dt/16.67), 2); // gentle float up then hold
      this.x += (this.yutaFistAimX - this.x) * 0.04 * (dt/16.67);
      this.y = Math.max(GND - H*0.75, Math.min(GND-PH-20, this.y + this.vy*(dt/16.67)));
      // Face direction of travel
      if(this.yutaFistAimX > this.x+2) this.facing=1;
      else if(this.yutaFistAimX < this.x-2) this.facing=-1;

      if(this.yutaFistTimer >= YUTAFIST_AIM_DUR){
        this.yutaFistPhase=2; this.yutaFistTimer=0;
        this.vy=0;
      }

    } else if(this.yutaFistPhase===2){
      // Slam down — fast vertical drop
      this.vy = Math.min(this.vy + 3*(dt/16.67), YUTAFIST_SLAM_SPD);
      this.y += this.vy*(dt/16.67);
      this.x += (this.yutaFistAimX - this.x) * 0.12*(dt/16.67);
      this.yutaFistGlowAnim += dt*0.02;

      if(this.y >= GND-PH){
        this.y = GND-PH; this.vy=0; this.onGround=true;
        this.yutaFistPhase=3; this.yutaFistTimer=0;
        // EXPLODE
        this._yutaFistExplode(other);
      }

    } else {
      // Recovery — brief pause then done
      this.vx=0;
      if(this.yutaFistTimer >= 400){
        this.yutaSwordVisible=true;
        this.yutaFistCooldown=YUTAFIST_COOLDOWN;
        this.ss(S.IDLE);
      }
    }
  }

  _yutaFistExplode(other){
    const ex=this.x+PW/2, ey=GND-PH/2;
    // Check if enemy is in radius
    const def=other;
    if(def && def.hittable){
      const dx=(def.x+PW/2)-ex, dy=(def.y+PH/2)-ey;
      if(Math.sqrt(dx*dx+dy*dy)<YUTAFIST_RADIUS){
        def.hp=Math.max(0,def.hp-YUTAFIST_DMG); def.flash=450;
        addDmg(ex,def.y-20,YUTAFIST_DMG,'#ff88cc'); doShake(18);
        this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+YUTAFIST_DMG);
          if(!this.yutaCopiedUlt) this.yutaCopyUltCharge=Math.min(YUTA_COPY_ULT_REQ,this.yutaCopyUltCharge+YUTAFIST_DMG);
        if(def.hp<=0){ def._initRd((dx>0?1:-1)*8,-6,.12); def.ss(S.DEAD); }
        else { def._initRd((dx>0?1:-1)*10,-7,.13); def.ss(S.RAGD,RAGD_MS*1.5); }
      }
    }
    // Visual burst
    addParts(ex, GND, '#ff88cc', 30, 8);
    addRing(ex, GND, '#ff88cc', YUTAFIST_RADIUS*0.7);
    addRing(ex, GND, '#ffccee', YUTAFIST_RADIUS*0.4);
    doShake(16);
  }

  _startYutaSlice(){
    this.ss(S.YUTASLICE);
    this.yutaSliceIdx = 0;
    this.yutaSliceTimer = 0;
    this.yutaSliceAnim = 0;
    this.yutaSliceHits = Array(YUTA_SLICE_COUNT).fill(false);
    this.yutaComboTarget = null; // set on first hit
    this.vx = 0;
    addParts(this.x+PW/2, this.y+PH/2, '#ff88cc', 8, 4);
  }

  _tickYutaSlice(dt, other){
    if([S.STUN,S.RAGD,S.DEAD].includes(this.state)){ this.ss(S.IDLE); return; }
    this.yutaSliceTimer += dt;

    const sliceDur = YUTA_SLICE_DUR;
    const idx = Math.min(YUTA_SLICE_COUNT-1, Math.floor(this.yutaSliceTimer / sliceDur));
    this.yutaSliceIdx = idx;
    const localT = (this.yutaSliceTimer % sliceDur) / sliceDur;
    this.yutaSliceAnim = localT;

    // Small forward lunge at the start of each slash
    this.vx = this.facing * YUTA_SLICE_LUNGE * (dt/16.67) * (localT < 0.35 ? 1 : 0);
    this.x = Math.max(10, Math.min(W-PW-10, this.x + this.vx));

    // If we have a combo target, drag them to 3 blocks in front every frame
    if(this.yutaComboTarget && this.yutaComboTarget.state === S.STUN){
      const targetX = this.x + this.facing * YUTA_COMBO_DIST;
      this.yutaComboTarget.x = Math.max(10, Math.min(W-PW-10, targetX));
      this.yutaComboTarget.y = this.y; // keep at same height
      this.yutaComboTarget.vx = 0;
      this.yutaComboTarget.vy = 0;
      // Refresh stun so they don't escape mid-combo
      this.yutaComboTarget.sDur = sliceDur * (YUTA_SLICE_COUNT - idx) + 100;
      this.yutaComboTarget.sTimer = 0;
    }

    // Deal damage once per slice at peak
    if(!this.yutaSliceHits[idx] && localT >= 0.35){
      const def = other;
      if(def.hittable || def.state===S.STUN){
        const db = def.bodyBox();
        const hitBox = { x: this.x+(this.facing===1?PW-8:-32), y:this.y, w:42, h:PH };
        if(overlaps(hitBox, db)){
          this.yutaSliceHits[idx] = true;
          def.hp = Math.max(0, def.hp - YUTA_SLICE_DMG);
          def.flash = 120;
          addDmg(def.x+PW/2, def.y-10-idx*6, YUTA_SLICE_DMG, '#ff88cc');
          addParts(def.x+PW/2, def.y+PH*0.4, '#ff88cc', 6, 4);
          doShake(4);
          this.domainCharge = Math.min(DOMAIN_CHARGE_REQ, this.domainCharge+YUTA_SLICE_DMG);
          if(!this.yutaCopiedUlt) this.yutaCopyUltCharge=Math.min(YUTA_COPY_ULT_REQ,this.yutaCopyUltCharge+YUTA_SLICE_DMG);
          if(def.hp<=0){
            def._initRd(this.facing*6,-4,.09*this.facing); def.ss(S.DEAD);
            this.yutaComboTarget = null;
          } else if(idx===YUTA_SLICE_COUNT-1){
            // Final hit — launch them
            def._initRd(this.facing*12,-7,.13*this.facing); def.ss(S.RAGD, RAGD_MS*1.4);
            this.yutaComboTarget = null;
          } else {
            // Catch them in the combo
            def.vx=0; def.vy=0;
            def.ss(S.STUN, sliceDur * (YUTA_SLICE_COUNT - idx) + 100);
            this.yutaComboTarget = def;
          }
        }
      }
    }

    // Done after all slices
    if(this.yutaSliceTimer >= sliceDur * YUTA_SLICE_COUNT){
      this.yutaSliceCooldown = YUTA_SLICE_COOLDOWN;
      this.yutaComboTarget = null;
      this.ss(this.onGround ? S.IDLE : S.AIR);
    }
  }

  _yutaDomainRandomAbility(def){
    // Fire a random non-ult, non-charge ability effect on the opponent
    const abilities = [
      ()=>{ // Cleave
        const sx=this.x+(this.facing===1?PW+8:-8), sy=this.y+PH*0.32;
        addCleave(sx,sy,this.facing,this,0);
        addParts(sx,sy,'#ddd',8,4); addRing(sx,sy,'#fff',40); doShake(5);
      },
      ()=>{ // Reversal Red burst
        const ox=def.x+PW/2, oy=def.y+PH*0.4;
        addParts(ox,oy,'#f44',12,5); addRing(ox,oy,'#f44',50);
        def.hp=Math.max(0,def.hp-8); def.flash=200;
        addDmg(ox,def.y-16,8,'#f44'); doShake(5);
        if(def.hp<=0){def._initRd(this.facing*5,-4,.10);def.ss(S.DEAD);}
      },
      ()=>{ // Lapse Blue pull
        def.vx += (this.x+PW/2-def.x-PW/2)*0.15;
        def.vy += -3;
        addParts(def.x+PW/2,def.y+PH/2,'#4af',10,4); addRing(def.x+PW/2,def.y+PH/2,'#4af',40);
      },
      ()=>{ // Piercing Blood bolt
        addPiercingBeam(this.x+PW/2, this.y+PH*0.4, this.facing, this, 12);
        doShake(4);
      },
    ];
    const fn = abilities[Math.floor(Math.random()*abilities.length)];
    fn();
  }

  _fireJacobLadder(other){
    if(!activeDomain || activeDomain.type!=='love') return;
    if(!this.jacobReady) return;
    const def = other;
    const tx = def.x + PW/2;
    // Mark domain for beam drawing
    activeDomain.jacobFiring = true;
    activeDomain.jacobTimer = 0;
    activeDomain.jacobTargetX = tx;
    // Deal 4/5 of opponent's max HP
    const dmg = Math.floor(def.maxHp * JACOB_LADDER_DMG_FRAC);
    def.hp = Math.max(1, def.hp - dmg); // leave at 1 hp minimum (dramatic)
    def.flash = 800;
    addDmg(tx, def.y-20, dmg, '#cc44ff');
    addParts(tx, GND, '#cc44ff', 30, 10);
    addRing(tx, GND, '#cc44ff', 120);
    doShake(22);
    // Reset
    this.jacobLadderCharge = 0;
    this.jacobReady = false;
    if(def.hp<=0){def._initRd(0,-8,.05);def.ss(S.DEAD);}
    else {def._initRd(0,-6,.04); def.ss(S.RAGD, RAGD_MS*2);}
  }

  _executeBBKick(def){
    const kickDmg = this.bbGotBF ? BB_DMG_BF_KICK : BB_DMG_KICK;
    if(def && (def.hittable || def.state===S.STUN)){
      def.hp=Math.max(0,def.hp-kickDmg); def.flash=400;
      if(this.bbGotBF){
        addBlackFlash(def.x+PW/2, def.y+PH/2);
        addDmg(def.x+PW/2, def.y-20, kickDmg, '#111'); doShake(18);
        def._initRd(this.facing*12,-8,.15*this.facing); def.ss(def.hp<=0?S.DEAD:S.RAGD,RAGD_MS*1.6);
      } else {
        addParts(def.x+PW/2, def.y+PH/2, '#f5a623', 14, 6);
        addRing(def.x+PW/2, def.y+PH/2, '#f5a623', 60);
        addDmg(def.x+PW/2, def.y-18, kickDmg, '#f5a623'); doShake(10);
        def._initRd(this.facing*9,-6,.12*this.facing); def.ss(def.hp<=0?S.DEAD:S.RAGD,RAGD_MS*1.2);
      }
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+(BB_DMG_HIT*2+kickDmg));
      this.yujiUltCharge=Math.min(YUJI_ULT_COST,this.yujiUltCharge+(BB_DMG_HIT*2+kickDmg));
    }
    this.bbPhase=5; this.bbTimer=0;
  }

  _startBlackFlashMinigame(enemy){
    this.bfActive = true;
    this.bfTimer = BF_MINIGAME_DUR;
    this.bfLinePos = 0;
    this.bfLineDir = 1;
    this.bfGoalPos = BF_BAR_W * 0.5 - BF_GOAL_W/2; // goal in center
    this.bfWon = false;
    this.bfWindowTimer = 0;
    this.bfStunnedEnemy = enemy;
    this.bfAtkDown = true; // prevent instant re-trigger from held key
    // keep enemy stunned for entire minigame
    enemy.vx=0;
    enemy.ss(S.STUN, BF_MINIGAME_DUR + BF_WINDOW + 200);
    this.combo = 0;
    this.ss(S.BLACKFLASH);
  }

  _tickBlackFlash(dt, other){
    if(!this.bfActive){ this.ss(S.IDLE); return; }
    this.vx = 0; // stay still during minigame

    // Track atk button edge
    const atkKey = keys[this.ctrl.atk];
    const atkEdge = atkKey && !this.bfAtkDown;
    this.bfAtkDown = !!atkKey;

    if(this.bfWon){
      // Window to press attack for black flash
      this.bfWindowTimer -= dt;
      if(atkEdge){
        // BLACK FLASH!
        this._triggerBlackFlash(other);
        return;
      }
      if(this.bfWindowTimer <= 0){
        // Missed the window
        this.bfActive = false;
        this.bfWon = false;
        this.ss(S.IDLE);
      }
    } else {
      // Minigame active: bounce line
      this.bfTimer -= dt;
      this.bfLinePos += this.bfLineDir * BF_LINE_SPEED * dt * 0.12;
      if(this.bfLinePos >= BF_BAR_W){ this.bfLinePos = BF_BAR_W; this.bfLineDir = -1; }
      if(this.bfLinePos <= 0){ this.bfLinePos = 0; this.bfLineDir = 1; }

      if(atkEdge){
        // Check if line is in goal zone
        const goalL = this.bfGoalPos;
        const goalR = this.bfGoalPos + BF_GOAL_W;
        if(this.bfLinePos >= goalL && this.bfLinePos <= goalR){
          // SUCCESS
          this.bfWon = true;
          this.bfWindowTimer = BF_WINDOW;
          addRing(this.x+PW/2, this.y+PH/2, '#f5a623', 45);
          doShake(4);
        } else {
          // MISS — stun Yuji for 1 second
          this.bfActive = false;
          this.bfTimer = 0;
          if(this.bfStunnedEnemy && this.bfStunnedEnemy.state===S.STUN)
            this.bfStunnedEnemy.ss(S.IDLE); // release enemy
          this.ss(S.STUN, 1000);
        }
      }
      if(this.bfTimer <= 0){
        // Time ran out
        this.bfActive = false;
        this.ss(S.IDLE);
      }
    }
  }

  _triggerBlackFlash(other){
    const def = this.bfStunnedEnemy || other;
    this.bfActive = false; this.bfWon = false;
    this.ss(S.IDLE);

    const mx = def.x+PW/2, my = def.y+PH/2;
    // Damage
    def.hp = Math.max(0, def.hp - BF_DMG);
    def.flash = 500;
    // Black Flash visual effects
    addBlackFlash(mx, my);
    addDmg(mx, def.y-24, BF_DMG, '#111');
    doShake(18);
    if(def.hp<=0){ def._initRd(this.facing*11,-7,.14*this.facing); def.ss(S.DEAD); }
    else { def._initRd(this.facing*10,-6,.13*this.facing); def.ss(S.RAGD, RAGD_MS*1.4); }
    this.domainCharge = Math.min(DOMAIN_CHARGE_REQ, this.domainCharge+BF_DMG);
  }

  _drawBlackFlashMinigame(){
    if(!this.bfActive) return;
    const bx = this.x + PW/2 - BF_BAR_W/2;
    const by = this.y - 44;
    const t = Date.now();
    const isBlackBlur = this.state === S.BLACKBLUR;
    const keyHint = isBlackBlur
      ? (this.playerNum===1 ? 'H' : '[')
      : (this.playerNum===1 ? 'F' : ';');

    ctx.save();
    if(this.bfWon && this.state !== S.BLACKBLUR){
      // Standalone BF: flash HIT NOW
      const pulse = 0.7 + 0.3*Math.sin(t*0.03);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#f5a623';
      ctx.font = `700 14px 'Rajdhani',sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`[${keyHint}] HIT NOW!`, this.x+PW/2, by-6);
      ctx.globalAlpha = 1;
    } else {
      // Background
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(bx-3, by-3, BF_BAR_W+6, 18);
      // Goal zone (bright orange)
      ctx.fillStyle = '#f5a623';
      ctx.fillRect(bx + this.bfGoalPos, by, BF_GOAL_W, 12);
      // Moving line (white)
      ctx.fillStyle = '#fff';
      ctx.fillRect(bx + this.bfLinePos - 1.5, by-2, 3, 16);
      // Border
      ctx.strokeStyle = 'rgba(245,166,35,0.6)'; ctx.lineWidth=1;
      ctx.strokeRect(bx, by, BF_BAR_W, 12);
      // Label
      ctx.fillStyle='rgba(245,166,35,0.8)';
      ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
      ctx.fillText(`BLACK FLASH  [${keyHint}]`, this.x+PW/2, by-4);
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  _startBlackFlash(){ /* placeholder */ }

  _startCleave(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD,S.CLEAVE].includes(this.state)) return;
    this.ss(S.CLEAVE);
    this.cleaveArm = 0;
    this.vx = 0;
    if(!this.onGround){
      // Air variant: suspend and aim
      this.cleaveAir = true;
      this.cleaveAimAngle = 0;
      this.cleaveAimTime = AIR_CLEAVE_AIM;
      this.vy = 0; // suspend
    } else {
      this.cleaveAir = false;
      this.cleaveWindup = CLEAVE_WINDUP;
    }
  }

  _tickCleave(dt, other){
    // If hit during any cleave state → cancel
    if(this.state === S.STUN){ this.cleaveArm=0; this.cleaveCooldown=0; return; }

    if(this.cleaveAir){
      // ── AIR VARIANT ──
      // Keep suspended
      this.vy = 0; this.vx = 0;

      // Aim with up/down keys — clamp to ±70°
      const ctrl = this.ctrl;
      if(keys[ctrl.jmp])  this.cleaveAimAngle = Math.max(-Math.PI*0.39, this.cleaveAimAngle - AIR_CLEAVE_AIM_SPEED*dt);
      if(keys[ctrl.left] === false && keys[ctrl.right] === false && keys['ArrowDown'])
        this.cleaveAimAngle = Math.min(Math.PI*0.39, this.cleaveAimAngle + AIR_CLEAVE_AIM_SPEED*dt);
      // P1 uses S for down, P2 uses ArrowDown
      if(this.ctrl.left==='KeyA' && keys['KeyS'])
        this.cleaveAimAngle = Math.min(Math.PI*0.39, this.cleaveAimAngle + AIR_CLEAVE_AIM_SPEED*dt);
      if(this.ctrl.left==='ArrowLeft' && keys['ArrowDown'])
        this.cleaveAimAngle = Math.min(Math.PI*0.39, this.cleaveAimAngle + AIR_CLEAVE_AIM_SPEED*dt);

      // Arm tracks aim angle
      this.cleaveArm = 1;

      this.cleaveAimTime -= dt;
      if(this.cleaveAimTime <= 0){
        // Fire at aimed angle
        const sx = this.x + (this.facing===1 ? PW+8 : -8);
        const sy = this.y + PH*0.32;
        addCleave(sx, sy, this.facing, this, this.cleaveAimAngle);
        addParts(sx, sy, '#ddd', 10, 5);
        addRing(sx, sy, '#fff', 48);
        doShake(5);
        this.cleaveArm = 0;
        this.cleaveAir = false;
        this.cleaveCooldown = CLEAVE_COOLDOWN;
        // Resume falling
        this.vy = 2;
        this.ss(S.AIR);
      }
    } else {
      // ── GROUND VARIANT ──
      if(this.cleaveWindup > 0){
        this.cleaveWindup -= dt;
        this.cleaveArm = Math.min(1, 1 - this.cleaveWindup / CLEAVE_WINDUP);
      } else {
        const sx = this.x + (this.facing===1 ? PW+8 : -8);
        const sy = this.y + PH*0.32;
        addCleave(sx, sy, this.facing, this, 0);
        addParts(sx, sy, '#ddd', 10, 5);
        addRing(sx, sy, '#fff', 48);
        doShake(5);
        this.cleaveArm = 0;
        this.cleaveCooldown = CLEAVE_COOLDOWN;
        this.ss(S.IDLE);
      }
    }
  }

  _doAttack(){
    if([S.ATCK,S.DIVE,S.STUN,S.RAGD,S.SLAM,S.DEAD].includes(this.state)) return;
    if(this.type==='yuji'||this.type==='sukuna'||this.type==='gojo'||this.type==='yuta') this.vx=0;
    if(this.combo>=3&&!this.onGround){ this.ss(S.DIVE,2000); this.diveVy=5; this.atkHit=false; }
    else{ this.ss(S.ATCK,ATK_START+ATK_ACT+ATK_REC); this.atkPhase=0; this.atkTimer=0; this.atkHit=false; this.atkAnim=0; this._wasFinisher=(this.combo>=3); }
  }

  _tickAtk(dt,atkEdge){
    this.atkTimer+=dt;
    if(this.atkPhase===0&&this.atkTimer>=ATK_START){ this.atkPhase=1; this.atkTimer=0; }
    else if(this.atkPhase===1){
      this.atkAnim=this.atkTimer/ATK_ACT;
      if(this.atkTimer>=ATK_ACT){ this.atkPhase=2; this.atkTimer=0; this.atkAnim=0; }
    } else if(this.atkPhase===2&&this.atkTimer>=ATK_REC){
      if(atkEdge){ this.atkDown=true; this.atkPhase=0; this.atkTimer=0; this.atkHit=false; this.atkAnim=0; }
      else {
        // If this was a finisher attempt and it missed, lose the combo
        if(this._wasFinisher && !this.atkHit) this.combo=0;
        this._wasFinisher=false;
        this.ss(this.onGround?S.IDLE:S.AIR);
      }
    }
  }

  _tickDive(dt){
    const f=dt/16.67;
    this.diveVy=Math.min(this.diveVy+1.5*f,28);
    this.y+=this.diveVy*f; this.x+=this.vx*.1*f;
    this.x=Math.max(10,Math.min(W-PW-10,this.x));
    if(this.y>=GND-PH){this.y=GND-PH;this.vy=-7;this.vx=0;this.onGround=false;
      if(!this.atkHit) this.combo=0; // missed — lose finisher
      this.ss(S.AIR);}
    if(this.sTimer>=this.sDur){this.y=GND-PH;
      if(!this.atkHit) this.combo=0; // timed out without hitting
      this.ss(S.IDLE);}
  }

  _phys(dt){
    const f=dt/16.67;
    this.vy+=GRAV*f; this.x+=this.vx*f; this.y+=this.vy*f;
    if(this.y>=GND-PH){this.y=GND-PH;this.vy=0;this.onGround=true;} else this.onGround=false;
    this.x=Math.max(10,Math.min(W-PW-10,this.x));
    if([S.IDLE,S.WALK,S.AIR].includes(this.state))
      this.state=!this.onGround?S.AIR:Math.abs(this.vx)>.15?S.WALK:S.IDLE;
  }

  _rdPhys(dt){
    const f=dt/16.67;
    this.rdVy+=GRAV*f; this.rdVx*=Math.pow(.976,f);
    this.rdX+=this.rdVx*f; this.rdY+=this.rdVy*f;
    this.rdRot+=this.rdAngV*f; this.rdAngV*=Math.pow(.93,f);
    if(this.rdY>=GND-PH){
      this.rdY=GND-PH;
      if(Math.abs(this.rdVy)>1.5){this.rdVy*=-.28;addParts(this.rdX+PW/2,GND,'#999',4,2);}
      else this.rdVy=0;
      this.rdVx*=.65; this.rdAngV*=.4;
    }
    if(this.rdX<10){this.rdX=10;this.rdVx*=-.4;}
    if(this.rdX>W-PW-10){this.rdX=W-PW-10;this.rdVx*=-.4;}
    this.x=this.rdX; this.y=this.rdY;
  }

  _exitRd(){
    this.x=Math.max(10,Math.min(W-PW-10,this.rdX));
    this.y=GND-PH; this.vx=0; this.vy=0; this.rdRot=0; this.ss(S.IDLE);
  }

  landHit(def){
    if(this.atkHit) return;
    this.atkHit=true; this.comboTimer=0;
    const isSlam    =this.state===S.DIVE;
    const isFinisher=!isSlam&&this.combo>=3;
    const mx=def.x+PW/2, my=def.y+PH/2;
    const inLove = this.type==='yuta' && activeDomain && activeDomain.owner===this && activeDomain.type==='love';

    // Yuta inside domain: 4th M1 (combo==3) triggers random ability + charges Jacob's Ladder
    if(inLove && !isSlam && this.combo===3){
      this.combo=0;
      def.hp=Math.max(0,def.hp-DMG_KB); def.flash=300;
      addDmg(mx,def.y-14,DMG_KB,'#cc88ff'); doShake(8);
      addParts(mx,my,'#cc44ff',14,5); addRing(mx,my,'#cc44ff',55);
      if(def.hp<=0){def._initRd(this.facing*6,-5,.12*this.facing);def.ss(S.DEAD);}
      else{def._initRd(this.facing*8,-4,.10*this.facing);def.ss(S.RAGD,RAGD_MS);}
      this.jacobLadderCharge = Math.min(JACOB_LADDER_REQ, this.jacobLadderCharge+1);
      if(this.jacobLadderCharge>=JACOB_LADDER_REQ) this.jacobReady=true;
      this._yutaDomainRandomAbility(def);
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+DMG_KB);
      return;
    }

    if(isSlam){
      this.combo=0; def.getSlam(this);
      addParts(mx,GND,'#aaa',20,5); addRing(mx,GND,'#aaa',80);
      addDmg(mx,def.y-14,DMG_SLAM,'#ccc'); doShake(14); this.vy=-8;
      if(this.type==='sukuna') this.fugaCharge=Math.min(FUGA_CHARGE_REQ,this.fugaCharge+DMG_SLAM);
      if(this.type==='gojo')   this.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,this.hollowCharge+DMG_SLAM);
      if(this.type==='yuji')   this.yujiUltCharge=Math.min(YUJI_ULT_COST,this.yujiUltCharge+DMG_SLAM);
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+DMG_SLAM);
    } else if(isFinisher){
      this.combo=0; def.getKnockback(this);
      addParts(mx,my,'#aaa',14,5); addRing(mx,my,'#aaa',55);
      addDmg(mx,def.y-14,DMG_KB,'#ccc'); doShake(8);
      if(this.type==='sukuna') this.fugaCharge=Math.min(FUGA_CHARGE_REQ,this.fugaCharge+DMG_KB);
      if(this.type==='gojo')   this.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,this.hollowCharge+DMG_KB);
      if(this.type==='yuji')   this.yujiUltCharge=Math.min(YUJI_ULT_COST,this.yujiUltCharge+DMG_KB);
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+DMG_KB);
    } else {
      this.combo++; def.getStun(this);
      addParts(mx,my,'#aaa',7,3); addRing(mx,my,'#888',28);
      addDmg(mx,def.y-14,DMG_HIT,'#ccc'); doShake(3);
      if(this.type==='sukuna') this.fugaCharge=Math.min(FUGA_CHARGE_REQ,this.fugaCharge+DMG_HIT);
      if(this.type==='gojo')   this.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,this.hollowCharge+DMG_HIT);
      if(this.type==='yuji')   this.yujiUltCharge=Math.min(YUJI_ULT_COST,this.yujiUltCharge+DMG_HIT);
      this.domainCharge=Math.min(DOMAIN_CHARGE_REQ,this.domainCharge+DMG_HIT);
      if(this.type==='yuji' && this.combo===3){
        this._startBlackFlashMinigame(def);
      }
    }
  }

  getStun(atk){
    // Cancel cleave windup if in progress
    if(this.state===S.CLEAVE){ this.cleaveArm=0; this.cleaveCooldown=0; }
    if(this.state===S.FUGA){ this.fugaArm=0; }
    this.hp=Math.max(0,this.hp-DMG_HIT); this.flash=200;
    if(this.hp<=0){this._initRd(atk.facing*5,-4.5,.11*atk.facing);this.ss(S.DEAD);return;}
    this.vx=atk.facing*2; this.ss(S.STUN,STUN_MS);
  }
  getKnockback(atk){
    if(this.state===S.CLEAVE){ this.cleaveArm=0; this.cleaveCooldown=0; }
    if(this.state===S.FUGA){ this.fugaArm=0; }
    this.hp=Math.max(0,this.hp-DMG_KB); this.flash=320;
    if(this.hp<=0){this._initRd(atk.facing*10,-7,.13*atk.facing);this.ss(S.DEAD);return;}
    this._initRd(atk.facing*10.5,-7,.13*atk.facing); this.ss(S.RAGD,RAGD_MS);
  }
  getSlam(atk){
    this.hp=Math.max(0,this.hp-DMG_SLAM); this.flash=400;
    if(this.hp<=0){this._initRd(atk.facing*4,-1,.05*atk.facing);this.ss(S.DEAD);return;}
    this.x=this.rdX; this.y=this.rdY=GND-PH;
    this._initRd(atk.facing*4,0,.05*atk.facing); this.ss(S.SLAM,SLAM_MS);
  }
  _initRd(vx,vy,angV){ this.rdX=this.x;this.rdY=this.y;this.rdVx=vx;this.rdVy=vy;this.rdRot=0;this.rdAngV=angV; }

  draw(){
    const phys=[S.RAGD,S.SLAM,S.DEAD].includes(this.state);
    ctx.save();
    if(this.flash>0) ctx.globalAlpha=.45+.55*Math.abs(Math.sin(this.flash*.055));
    this._shadow();

    // ── Sprite-based rendering (if character has a sprite sheet) ──
    if(this.spriteAnim){
      // Update frame timing
      this.spriteAnim._ownerVy = this.vy;
      this.spriteAnim.update(this.state, 16.67, this.combo);
      const flipX = this.facing === -1;
      const footX = phys ? this.rdX + PW/2 : this.x + PW/2;
      const footY = phys ? this.rdY + PH   : this.y + PH;
      if(phys){
        // Ragdoll: rotate sprite around its center
        ctx.save();
        ctx.translate(footX, footY - PH/2);
        ctx.rotate(this.rdRot);
        ctx.translate(-footX, -(footY - PH/2));
        this.spriteAnim.draw(footX, footY, flipX);
        ctx.restore();
      } else {
        this.spriteAnim.draw(footX, footY, flipX);
      }
      ctx.restore();
      // Still draw ability overlays (HUD, special effects drawn elsewhere)
      this._drawAbilityOverlays();
      return;
    }

    // ── Stick-figure rendering (fallback) ──
    if(phys){
      ctx.translate(this.rdX+PW/2,this.rdY+PH/2); ctx.rotate(this.rdRot); this._stick(0,0);
    } else if(this.state===S.DIVE){
      ctx.translate(this.x+PW/2,this.y+PH/2); ctx.rotate(this.facing*.85); this._stick(0,0);
    } else if(this.state===S.CLEAVE && this.cleaveAir){
      // Body tilts to match aimed angle
      ctx.translate(this.x+PW/2,this.y+PH/2);
      ctx.rotate(this.cleaveAimAngle * this.facing * 0.75);
      this._stick(0,0);
    } else {
      this._stick(this.x+PW/2,this.y+PH/2);
    }
    ctx.restore();
    this._drawAbilityOverlays();
  }

  // Overlays that draw on top regardless of sprite vs stick figure
  _drawAbilityOverlays(){

    // Flashing red outline when dismantle is out of range
    if(this.dismantleOutline > 0){
      const pulse = Math.abs(Math.sin(this.dismantleOutline * 0.018));
      ctx.save();
      ctx.globalAlpha = pulse * 0.85;
      ctx.strokeStyle = '#f00';
      ctx.lineWidth = 2.5;
      const pad = 6;
      ctx.strokeRect(this.x - pad, this.y - pad, PW + pad*2, PH + pad*2);
      ctx.restore();
    }

    // Yuji: red outline flash when Piercing Blood is fully charged
    if(this.type==='yuji' && this.pbChargeTime >= PB_CHARGE_MAX){
      const t2 = Date.now();
      // Rapid erratic flicker — multiple sine waves at different speeds
      const flicker = Math.abs(Math.sin(t2*0.022)) * Math.abs(Math.sin(t2*0.007+1.3)) + 0.3;
      const pad = 7;
      ctx.save();
      // Outer glow
      ctx.globalAlpha = flicker * 0.5;
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 22;
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 6;
      ctx.strokeRect(this.x - pad - 2, this.y - pad - 2, PW + (pad+2)*2, PH + (pad+2)*2);
      // Inner sharp outline
      ctx.globalAlpha = 0.6 + flicker * 0.4;
      ctx.shadowBlur = 8;
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(this.x - pad, this.y - pad, PW + pad*2, PH + pad*2);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Air cleave aim indicator
    if(this.state===S.CLEAVE && this.cleaveAir){
      const ox = this.x + PW/2;
      const oy = this.y + PH*0.32;
      const ang = this.cleaveAimAngle;
      const lineLen = 55;
      const ex2 = ox + this.facing * Math.cos(ang) * lineLen;
      const ey2 = oy + Math.sin(ang) * lineLen;
      const pulse = 0.45 + 0.45 * Math.abs(Math.sin(Date.now() * 0.008));
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex2, ey2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex2, ey2, 2.5, 0, Math.PI*2); ctx.fill();
      const barW = 36;
      const barPct = this.cleaveAimTime / AIR_CLEAVE_AIM;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(ox - barW/2, this.y - 12, barW, 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(ox - barW/2, this.y - 12, barW * barPct, 4);
      ctx.restore();
    }

    // Hollow Purple windup — two balls converge into one
    if(this.state===S.HOLLOW){
      const cx = this.x + PW/2;
      const cy = this.y + PH*0.3;
      const prog = this.hollowArm; // 0→1
      const t = Date.now();

      // Orbit radius shrinks as they converge
      const orbitR = 50 * (1 - prog);
      // Convergence point (in front of Gojo)
      const targetX = cx + this.facing * 30;

      // Red ball position — starts behind, orbits in
      const redAng = -Math.PI*0.4 + prog * Math.PI*0.4;
      const rx = cx + Math.cos(redAng) * orbitR * this.facing + this.facing * 30*prog;
      const ry = cy + Math.sin(redAng) * orbitR * 0.5;

      // Blue ball position — starts above-front, orbits in
      const blueAng = Math.PI*0.4 - prog * Math.PI*0.4;
      const bx2 = cx + Math.cos(blueAng) * orbitR * this.facing + this.facing * 30*prog;
      const by2 = cy + Math.sin(blueAng) * orbitR * 0.5;

      const ballR = 9 + prog * 5;

      if(prog < 0.9){
        // Draw red ball
        ctx.save();
        ctx.globalAlpha = 1 - prog*1.1;
        const rg = ctx.createRadialGradient(rx,ry,0,rx,ry,ballR);
        rg.addColorStop(0,'rgba(255,200,200,1)');
        rg.addColorStop(0.4,'rgba(255,50,50,1)');
        rg.addColorStop(1,'rgba(180,0,0,0)');
        ctx.fillStyle=rg;
        ctx.beginPath(); ctx.arc(rx,ry,ballR,0,Math.PI*2); ctx.fill();
        ctx.restore();

        // Draw blue ball
        ctx.save();
        ctx.globalAlpha = 1 - prog*1.1;
        const bg2 = ctx.createRadialGradient(bx2,by2,0,bx2,by2,ballR);
        bg2.addColorStop(0,'rgba(200,220,255,1)');
        bg2.addColorStop(0.4,'rgba(40,120,255,1)');
        bg2.addColorStop(1,'rgba(0,40,200,0)');
        ctx.fillStyle=bg2;
        ctx.beginPath(); ctx.arc(bx2,by2,ballR,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // Purple merged ball grows as they converge
      if(prog > 0.5){
        const mergeAlpha = (prog-0.5)*2;
        const mergeR = (prog-0.5) * HOLLOW_BALL_R * 2.2;
        const pulse = 0.88+0.12*Math.sin(t*0.018);
        ctx.save();
        ctx.globalAlpha = mergeAlpha;
        const pg = ctx.createRadialGradient(targetX,cy,0,targetX,cy,mergeR*pulse);
        pg.addColorStop(0,'rgba(255,255,255,1)');
        pg.addColorStop(0.3,'rgba(210,100,255,1)');
        pg.addColorStop(0.7,'rgba(130,0,220,0.8)');
        pg.addColorStop(1,'rgba(80,0,160,0)');
        ctx.fillStyle=pg;
        ctx.beginPath(); ctx.arc(targetX,cy,mergeR*pulse,0,Math.PI*2); ctx.fill();
        // Pulsing ring
        ctx.globalAlpha = mergeAlpha * 0.6;
        ctx.strokeStyle='#c080ff'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(targetX,cy,mergeR*1.4,0,Math.PI*2); ctx.stroke();
        ctx.restore();
        ctx.globalAlpha=1;
      }
    }
    // Yuji Black Flash minigame overlay
    if(this.type==='yuji') this._drawBlackFlashMinigame();
    // Yuji Ultimate overlay
    if(this.type==='yuji') this._drawYujiUlt();

    // Yuta Cursed Fist — glowing fist + aim indicator
    if(this.type==='yuta' && this.state===S.YUTAFIST){
      const phase=this.yutaFistPhase, ga=this.yutaFistGlowAnim;
      const fistX=this.x+PW/2+this.facing*14;
      const fistY=this.y+PH*0.38;

      if(phase>=1 && phase<=2){
        // Pulsing pink glow on fist
        const pulse=0.6+0.4*Math.sin(ga*3);
        ctx.save();
        ctx.globalAlpha=pulse*0.85;
        const g=ctx.createRadialGradient(fistX,fistY,0,fistX,fistY,22);
        g.addColorStop(0,'rgba(255,136,204,0.9)');
        g.addColorStop(0.4,'rgba(255,100,180,0.6)');
        g.addColorStop(1,'rgba(255,100,180,0)');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(fistX,fistY,22,0,Math.PI*2); ctx.fill();
        // White core
        ctx.globalAlpha=pulse;
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(fistX,fistY,5,0,Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.globalAlpha=1;
      }

      if(phase===2){
        // Slam trail — motion lines behind Yuta
        ctx.save();
        for(let i=0;i<5;i++){
          ctx.globalAlpha=0.15*(5-i)/5;
          ctx.fillStyle='#ff88cc';
          ctx.fillRect(this.x+2, this.y+i*8, PW-4, 6);
        }
        ctx.restore(); ctx.globalAlpha=1;
      }

      if(phase===3){
        // Impact shockwave ring expanding from ground
        const prog=Math.min(1,this.yutaFistTimer/350);
        const r=prog*YUTAFIST_RADIUS*1.2;
        ctx.save();
        ctx.globalAlpha=(1-prog)*0.7;
        ctx.strokeStyle='#ff88cc'; ctx.lineWidth=4*(1-prog)+1;
        ctx.beginPath(); ctx.arc(this.x+PW/2, GND, r, Math.PI,0); ctx.stroke();
        ctx.globalAlpha=(1-prog)*0.35;
        ctx.beginPath(); ctx.arc(this.x+PW/2, GND, r*0.65, Math.PI,0); ctx.stroke();
        ctx.restore(); ctx.globalAlpha=1;
      }

      // Sheathe animation — sword fades (phase 0)
      if(phase===0){
        const prog=this.yutaFistTimer/YUTAFIST_SHEATHE_DUR;
        ctx.save();
        ctx.globalAlpha=(1-prog)*0.8;
        // Just a quick bright flash suggesting the sword being put away
        ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(fistX, fistY);
        ctx.lineTo(fistX+this.facing*(1-prog)*26, fistY-(1-prog)*24);
        ctx.stroke();
        ctx.restore(); ctx.globalAlpha=1;
      }
    }
    // Yuta Rika
    // Yuta Rika Combo overlay
  }

  _shadow(){
    const dist=GND-(this.y+PH), sc=Math.max(.15,1-dist/280);
    ctx.save(); ctx.globalAlpha=.18*sc; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(this.x+PW/2,GND+4,20*sc,5*sc,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  _stick(cx,cy){
    const f      = this.facing;
    const isAtk  = this.state===S.ATCK&&this.atkPhase===1;
    const aa     = isAtk?this.atkAnim:0;
    const isCleave = this.state===S.CLEAVE;
    const ca     = isCleave ? this.cleaveArm : 0;
    const isDismantle = this.state===S.DISMANTLE;
    const da     = isDismantle ? this.dismantleArm : 0;
    const isReversal = this.state===S.REVERSAL;
    const ra     = isReversal ? this.reversalArm : 0;
    const walking= this.state===S.WALK;
    const wt     = this.walkT;
    const main   = this.charColor;
    const dim    = this.charDimColor;

    const top   = -PH/2;
    const headY = top+HEAD_R+1;
    const neckY = headY+HEAD_R+3;
    const hipY  = neckY+BODY_H;
    const footY = hipY+LEG_H;

    // Yuji Piercing Blood charging — crouch offset
    const pbCharge = (this.type==='yuji') ? Math.min(1, this.pbChargeTime / PB_CHARGE_MAX) : 0;
    const crouchY  = pbCharge * 7; // squat down

    // ── WALK CYCLE — 5 key positions from reference ──────────
    // wt advances each frame; one full cycle = 2π
    // sin(wt): front leg phase    sin(wt+π): back leg phase
    // Key positions (per half-cycle):
    //  Contact (wt=0)  : front leg extended forward, heel strike
    //  Recoil  (wt=π/4): body dips, back leg bends up at knee
    //  Passing (wt=π/2): legs cross under hip, one straight down
    //  Mid pt  (wt=3π/4): leg sweeping back, body rises
    //  Contact (wt=π)  : opposite foot strikes

    // Body vertical bob — dips at contact, rises at passing
    const bob = walking ? Math.abs(Math.sin(wt)) * -3.5 : 0; // negative = dip downward

    // Hip horizontal sway
    const hipSway = walking ? Math.sin(wt) * 2.5 : 0;

    // Compute per-leg angles using the walk cycle phase
    // Front leg (in-phase with wt)
    const frontPhase = Math.sin(wt);   // -1..1
    const backPhase  = -frontPhase;    // opposite

    // Thigh (upper leg) swing angle — large rotation
    const frontThighAngle = frontPhase * 0.55;  // radians forward/back
    const backThighAngle  = backPhase  * 0.55;

    // Shin (lower leg) — bends at knee, especially during recoil
    // Knee bends most when leg is behind (recoil phase)
    const frontShinBend = Math.max(0, -frontPhase) * 0.5;  // bends when swinging back
    const backShinBend  = Math.max(0,  backPhase)  * 0.7;  // bends more during recoil

    const thighLen = LEG_H * 0.52;
    const shinLen  = LEG_H * 0.52;
    const hip      = { x: cx + hipSway, y: cy + hipY + bob + crouchY };

    // Helper: compute knee and foot from hip, thigh angle, shin bend
    function legPoints(hx, hy, thighAng, shinBend, side){
      // thighAng: positive = forward (in direction of facing)
      const kx = hx + f * Math.sin(thighAng) * thighLen;
      const ky = hy + Math.cos(thighAng) * thighLen;
      // shin hangs from knee; bend angle adds inward curve
      const shinAng = thighAng - shinBend * side;
      const fx2 = kx + f * Math.sin(shinAng) * shinLen;
      const fy2 = ky + Math.cos(shinAng) * shinLen;
      return { kx, ky, fx: fx2, fy: fy2 };
    }

    const backLeg  = legPoints(hip.x - f*3, hip.y, backThighAngle,  backShinBend,  1);
    const frontLeg = legPoints(hip.x + f*3, hip.y, frontThighAngle, frontShinBend, 1);

    ctx.lineCap='round'; ctx.lineJoin='round';

    // ── Draw back leg ──
    ctx.strokeStyle=dim; ctx.lineWidth=LIMB_W*.85;
    if(walking){
      ctx.beginPath();
      ctx.moveTo(hip.x - f*3, hip.y);
      ctx.lineTo(backLeg.kx, backLeg.ky);
      ctx.lineTo(backLeg.fx, backLeg.fy);
      ctx.stroke();
      // Foot/heel
      ctx.beginPath(); ctx.moveTo(backLeg.fx, backLeg.fy);
      ctx.lineTo(backLeg.fx + f*5, backLeg.fy); ctx.stroke();
    } else {
      // Idle back leg — straight
      const kx=cx+f*(-4), ky=cy+hipY+11+crouchY*1.5;
      const fx=cx+f*(-4), fy=cy+footY;
      ctx.beginPath(); ctx.moveTo(cx,cy+hipY+crouchY); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+f*5,fy); ctx.stroke();
    }
    // Back arm (counter-swings with opposite leg = front leg phase)
    {
      // Arms swing OPPOSITE to same-side leg, so back arm swings with FRONT leg phase
      const armSwB = walking ? frontPhase * 13 : 0;
      let ex,ey,hx,hy;
      if(pbCharge>0){
        ex=cx+f*(-10+pbCharge*13); ey=cy+neckY+8+bob+crouchY*0.5+pbCharge*6;
        hx=cx+f*(-2 +pbCharge*4 ); hy=cy+neckY+16+bob+crouchY*0.5+pbCharge*5;
      } else if(this.state===S.BLACKBLUR){
        const bp=this.bbPhase, ba=this.bbAnimProg;
        if(bp===1){
          const pull = ba < 0.5 ? 0 : (ba-0.5)/0.5;
          ex=cx+f*(-10-pull*8); ey=cy+neckY+8+bob-pull*6;
          hx=cx+f*(-16-pull*10); hy=cy+neckY+18+bob-pull*8;
        } else if(bp===2){
          const punch = ba < 0.45 ? ba/0.45 : 1-(ba-0.45)/0.55;
          const pEase = punch*(2-punch);
          ex=cx+f*(-10+pEase*20); ey=cy+neckY+6+bob - pEase*8;
          hx=cx+f*(-14+pEase*30); hy=cy+neckY+14+bob - pEase*12;
        } else if(bp===3){
          ex=cx+f*(-6); ey=cy+neckY+4+bob;
          hx=cx+f*(-10); hy=cy+neckY-2+bob;
        } else if(bp===4){
          const kick = ba*(2-ba);
          ex=cx+f*(-8-kick*6); ey=cy+neckY+6+bob+kick*4;
          hx=cx+f*(-14-kick*8); hy=cy+neckY+16+bob+kick*6;
        } else {
          ex=cx+f*(-10)+armSwB*f*.35; ey=cy+neckY+8+bob - armSwB*.4;
          hx=cx+f*(-16)+armSwB*f*.65; hy=cy+neckY+20+bob - armSwB*.6;
        }
      } else {
        ex=cx+f*(-10)+armSwB*f*.35; ey=cy+neckY+8+bob - armSwB*.4;
        hx=cx+f*(-16)+armSwB*f*.65; hy=cy+neckY+20+bob - armSwB*.6;
      }
      ctx.strokeStyle=dim; ctx.lineWidth=LIMB_W*.85;
      ctx.beginPath(); ctx.moveTo(cx,cy+neckY+bob+crouchY*0.5); ctx.lineTo(ex,ey); ctx.lineTo(hx,hy); ctx.stroke();
    }
    // Torso (shifts with bob)
    ctx.strokeStyle=main; ctx.lineWidth=LIMB_W*1.5;
    ctx.beginPath(); ctx.moveTo(cx,cy+neckY+bob+crouchY*0.5); ctx.lineTo(hip.x, hip.y); ctx.stroke();
    // Front leg (walk cycle or kick animation)
    {
      const isBBKick = this.state===S.BLACKBLUR && this.bbPhase===4;
      const kick  = isBBKick ? this.bbAnimProg*(2-this.bbAnimProg) : 0;
      ctx.strokeStyle=main; ctx.lineWidth=LIMB_W;
      if(kick>0){
        const kx = cx+f*(6+kick*14);
        const ky = cy+hipY+11+bob - kick*30;
        const fx = cx+f*(8+kick*32);
        const fy = cy+footY+bob - kick*14;
        ctx.beginPath(); ctx.moveTo(cx,hip.y); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+f*6,fy); ctx.stroke();
        if(kick>0.5){ ctx.fillStyle=main; ctx.beginPath(); ctx.arc(fx,fy,4,0,Math.PI*2); ctx.fill(); }
      } else if(walking){
        ctx.beginPath();
        ctx.moveTo(hip.x + f*3, hip.y);
        ctx.lineTo(frontLeg.kx, frontLeg.ky);
        ctx.lineTo(frontLeg.fx, frontLeg.fy);
        ctx.stroke();
        // Foot
        ctx.beginPath(); ctx.moveTo(frontLeg.fx, frontLeg.fy);
        ctx.lineTo(frontLeg.fx + f*5, frontLeg.fy); ctx.stroke();
      } else {
        // Idle front leg — straight
        const kx=cx+f*4, ky=cy+hipY+11+crouchY*1.5;
        const fx=cx+f*4, fy=cy+footY;
        ctx.beginPath(); ctx.moveTo(hip.x,hip.y); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+f*5,fy); ctx.stroke();
      }
    }
    // Front arm (punch / cleave raise)
    {
      let ex,ey,hx,hy;
      if(isAtk && this.type==='yuta'){
        // Yuta sword slash: arm sweeps from raised-back to forward-low
        const sweep = aa*(2-aa);
        ex=cx+f*(4  - sweep*2);  ey=cy+neckY+2+bob - (1-sweep)*20 + sweep*8;
        hx=cx+f*(8  + sweep*18); hy=cy+neckY+6+bob - (1-sweep)*32 + sweep*16;
      } else if(isAtk){
        if(aa<0.4){
          const t2=aa/0.4;
          ex=cx+f*8-f*10*t2;  ey=cy+neckY+6+bob;
          hx=cx+f*14-f*18*t2; hy=cy+neckY+14+bob;
        } else {
          const t2=(aa-0.4)/0.6, ease=t2*(2-t2);
          ex=cx+f*(-2)+f*18*ease; ey=cy+neckY+6+bob-4*ease;
          hx=cx+f*(-4)+f*36*ease; hy=cy+neckY+14+bob-8*ease;
        }
      } else if(isCleave){
        // Arm sweeps down on ground; points in aim direction during air variant
        if(this.cleaveAir){
          // Arm extends in the aimed direction
          const ang = this.cleaveAimAngle;
          const armLen1 = 14, armLen2 = 14;
          ex = cx + f * (armLen1 * Math.cos(ang));
          ey = cy + neckY + 10 + bob + armLen1 * Math.sin(ang);
          hx = cx + f * ((armLen1+armLen2) * Math.cos(ang));
          hy = cy + neckY + 10 + bob + (armLen1+armLen2) * Math.sin(ang);
        } else {
          const sweep = ca * 42;
          const startRaise = 28;
          ex=cx+f*10; ey=cy+neckY+6+bob - startRaise + sweep*0.5;
          hx=cx+f*(14+ca*8); hy=cy+neckY+14+bob - startRaise + sweep;
        }
      } else if(isDismantle){
        // Arm thrusts straight up, palm open toward enemy
        const raise = da * 42;
        ex=cx+f*6;          ey=cy+neckY+4+bob - raise*0.45;
        hx=cx+f*8;          hy=cy+neckY+10+bob - raise;
      } else if(this.state===S.FUGA){
        // Bow draw: arm pulls back then thrusts forward
        const fa = this.fugaArm;
        // Pull back phase (0→0.6): hand draws backward
        // Release (0.6→1): snaps forward fast
        if(fa < 0.6){
          const t2 = fa/0.6;
          ex=cx+f*(10-t2*22); ey=cy+neckY+5+bob - t2*8;
          hx=cx+f*(16-t2*30); hy=cy+neckY+12+bob - t2*14;
        } else {
          const t2=(fa-0.6)/0.4, ease=1-(1-t2)*(1-t2);
          ex=cx+f*(-12+ease*28); ey=cy+neckY+5+bob - 8 + ease*6;
          hx=cx+f*(-14+ease*38); hy=cy+neckY+12+bob - 14 + ease*10;
        }
      } else if(isReversal){
        // Arm raises then thrusts forward to fire
        const raise = Math.min(1, ra*2) * 28;
        const thrust = Math.max(0, ra*2-1);
        ex=cx+f*(8 + thrust*10); ey=cy+neckY+5+bob - raise + thrust*raise*0.6;
        hx=cx+f*(14 + thrust*22); hy=cy+neckY+12+bob - raise + thrust*raise*0.8;
      } else if(this.state===S.DOMAIN){
        // Hand sign: both arms raised and clasped together in front
        const dh = this.domainHandsign;
        const raise = dh * 20;
        // Front arm comes up and inward
        ex=cx+f*(8 - dh*10); ey=cy+neckY+6+bob - raise*0.6;
        hx=cx+f*(6 - dh*8);  hy=cy+neckY+12+bob - raise;
      } else if(this.type==='yuji' && this.pbChargeTime > 0){
        // Piercing Blood: front arm folds inward, hands clasp at center
        const charge = Math.min(1, this.pbChargeTime / PB_CHARGE_MAX);
        ex = cx + f*(10 - charge*16); ey = cy + neckY + 6 + bob + charge*8;
        hx = cx + f*(2  - charge*3);  hy = cy + neckY + 16 + bob + charge*6;
      } else if(this.state===S.BLACKBLUR){
        const bp = this.bbPhase, ba = this.bbAnimProg;
        const ease = ba*(2-ba); // ease out

        if(bp===0){
          // LUNGE: arm sweeps back, body leans
          ex=cx+f*(8 - ease*16); ey=cy+neckY+6+bob - ease*4;
          hx=cx+f*(12- ease*22); hy=cy+neckY+14+bob - ease*6;
        } else if(bp===1){
          // PUNCH 1: right jab thrusts far forward fast then retracts
          const punch = ba < 0.45 ? ba/0.45 : 1-(ba-0.45)/0.55;
          const pEase = punch*(2-punch);
          ex=cx+f*(8 + pEase*18); ey=cy+neckY+5+bob - pEase*6;
          hx=cx+f*(14+ pEase*32); hy=cy+neckY+10+bob - pEase*10;
        } else if(bp===2){
          // PUNCH 2: left hook — arm swings across from the other side
          const punch = ba < 0.45 ? ba/0.45 : 1-(ba-0.45)/0.55;
          const pEase = punch*(2-punch);
          // Hook comes from the inside going outward
          ex=cx+f*(6 - pEase*4) ; ey=cy+neckY+8+bob - pEase*10;
          hx=cx+f*(10+ pEase*20); hy=cy+neckY+18+bob - pEase*16;
        } else if(bp===3){
          // SLOW / MINIGAME: fighting guard stance — both fists raised
          ex=cx+f*6; ey=cy+neckY+4+bob;
          hx=cx+f*10; hy=cy+neckY-4+bob;
        } else {
          // KICK (phase 4): leg swings up and snaps out
          // Front arm swings back for balance
          ex=cx+f*(-6); ey=cy+neckY+8+bob;
          hx=cx+f*(-14); hy=cy+neckY+18+bob;
        }
      } else if(this.type==='yuta' && this.state===S.YUTASLICE){
        const isDown = this.yutaSliceIdx%2===0;
        const sweep = this.yutaSliceAnim*(2-this.yutaSliceAnim);
        if(isDown){
          ex=cx+f*(8+sweep*4); ey=cy+neckY+2+bob-sweep*18;
          hx=cx+f*(14+sweep*6); hy=cy+neckY+8+bob-sweep*28;
        } else {
          ex=cx+f*(8-sweep*2); ey=cy+neckY+20+bob+sweep*6;
          hx=cx+f*(14-sweep*4); hy=cy+neckY+30+bob+sweep*8;
        }
      } else {
        // Front arm counter-swings with back leg (backPhase)
        const armSwF = walking ? backPhase * 13 : 0;
        ex=cx+f*10 - armSwF*f*.35; ey=cy+neckY+8+bob + armSwF*.4;
        hx=cx+f*16 - armSwF*f*.65; hy=cy+neckY+20+bob + armSwF*.6;
      }
      ctx.strokeStyle = (isCleave||isDismantle) ? `rgba(200,200,200,${0.5+(isCleave?ca:da)*0.5})` : main;
      ctx.lineWidth=LIMB_W;
      ctx.beginPath(); ctx.moveTo(cx,cy+neckY+bob); ctx.lineTo(ex,ey); ctx.lineTo(hx,hy); ctx.stroke();
      if(isAtk && this.type!=='yuta'){ ctx.fillStyle=main; ctx.beginPath(); ctx.arc(hx,hy,3.5,0,Math.PI*2); ctx.fill(); }
      // Yuta melee: pink slash arc + sword tip glow
      if(isAtk && this.type==='yuta' && aa>0.05){
        const slashAlpha = Math.sin(aa*Math.PI)*0.8;
        ctx.save();
        ctx.globalAlpha=slashAlpha;
        ctx.strokeStyle='#ff88cc'; ctx.lineWidth=3; ctx.lineCap='round';
        ctx.shadowColor='#ff88cc'; ctx.shadowBlur=10;
        // Arc from start of swing to current position
        const arcStart = -Math.PI*0.6 * f;
        const arcEnd   = (Math.PI*0.2 - aa*Math.PI*0.8) * f;
        ctx.beginPath();
        ctx.arc(cx+f*6, cy+neckY+4+bob, 30, Math.min(arcStart,arcEnd), Math.max(arcStart,arcEnd));
        ctx.stroke();
        // Bright tip
        ctx.globalAlpha=slashAlpha*0.9;
        ctx.fillStyle='#fff';
        ctx.shadowColor='#ff88cc'; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.arc(hx,hy,3,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.restore();
        ctx.globalAlpha=1;
      }
      if(isCleave && ca>0.3){
        ctx.shadowColor='#fff'; ctx.shadowBlur=14;
        ctx.fillStyle=`rgba(220,220,220,${ca})`;
        ctx.beginPath(); ctx.arc(hx,hy,4,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
      if(isDismantle && da>0.2){
        ctx.shadowColor='#88f'; ctx.shadowBlur=10;
        ctx.fillStyle=`rgba(180,180,255,${da*0.7})`;
        ctx.beginPath(); ctx.arc(hx,hy,3.5,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
      if(isReversal && ra>0.2){
        ctx.shadowColor='#f00'; ctx.shadowBlur=12;
        ctx.fillStyle=`rgba(255,80,80,${ra})`;
        ctx.beginPath(); ctx.arc(hx,hy,4,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
      if(this.state===S.DOMAIN && this.domainHandsign>0.2){
        // Dark cursed energy glow on hands
        ctx.shadowColor='#8a3000'; ctx.shadowBlur=16;
        ctx.fillStyle=`rgba(180,60,0,${this.domainHandsign*0.9})`;
        ctx.beginPath(); ctx.arc(hx,hy,5,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    // Neck
    ctx.strokeStyle=main; ctx.lineWidth=LIMB_W;
    ctx.beginPath(); ctx.moveTo(cx,cy+headY+HEAD_R); ctx.lineTo(cx,cy+neckY+bob); ctx.stroke();
    // Head
    ctx.lineWidth=LIMB_W; ctx.strokeStyle=main; ctx.fillStyle='#ccc';
    ctx.beginPath(); ctx.arc(cx,cy+headY+bob*.5,HEAD_R,0,Math.PI*2); ctx.fill(); ctx.stroke();

    // ── YUTA SWORD ── shown only when sword is visible
    if(this.type==='yuta' && this.yutaSwordVisible!==false){
      const isSlicing = this.state===S.YUTASLICE;
      const sliceAnim = isSlicing ? this.yutaSliceAnim : 0;
      const sliceIdx  = isSlicing ? this.yutaSliceIdx  : 0;

      // Base hand position: front arm hand (hx/hy from above isn't accessible here,
      // so we recompute a simplified sword origin)
      const handX = cx + f*16;
      const handY = cy + neckY + 18 + bob;

      // Sword angle: idle = angled down/forward; slicing = sweeps from high to low
      let swordAng;
      if(isSlicing){
        // Alternate slash directions: even idx = top-to-bottom, odd = bottom-to-top
        const isDown = sliceIdx%2===0;
        const sweep = sliceAnim*(2-sliceAnim); // ease out
        if(isDown){
          swordAng = -Math.PI*0.6 + sweep*Math.PI*0.9;
        } else {
          swordAng =  Math.PI*0.3 - sweep*Math.PI*0.9;
        }
      } else {
        swordAng = Math.PI*0.15; // idle: angled down
      }

      const sLen = 28;  // blade length
      const sWid = 3;   // blade width
      ctx.save();
      ctx.translate(handX, handY);
      ctx.rotate(swordAng * f);

      // Guard
      ctx.fillStyle='#888';
      ctx.fillRect(-3, -4, 6, 4);

      // Blade — tapers to point
      const grad = ctx.createLinearGradient(0, 0, 0, -sLen);
      grad.addColorStop(0, '#ddd');
      grad.addColorStop(0.5, '#fff');
      grad.addColorStop(1, '#eee');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-sWid/2, 0);
      ctx.lineTo(-1, -sLen);
      ctx.lineTo(1, -sLen);
      ctx.lineTo(sWid/2, 0);
      ctx.closePath(); ctx.fill();

      // Blade edge highlight
      ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-sLen); ctx.stroke();

      // Slash arc visual during slice
      if(isSlicing && sliceAnim>0.1 && sliceAnim<0.85){
        const arcAlpha = Math.sin(sliceAnim*Math.PI)*0.6;
        ctx.globalAlpha = arcAlpha;
        ctx.strokeStyle='#ffaadd'; ctx.lineWidth=2.5;
        ctx.shadowColor='#ff88cc'; ctx.shadowBlur=8;
        ctx.beginPath();
        ctx.arc(0, 0, sLen*0.9, -Math.PI*0.5, Math.PI*0.2);
        ctx.stroke();
        ctx.shadowBlur=0;
      }

      ctx.restore();
      ctx.globalAlpha=1;
    }
  }

  drawHUD(x,flip){
    const y=16,bw=278,bh=20,bx=flip?x-bw:x;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(bx-2,y-2,bw+4,bh+4);
    const pct=this.hp/this.maxHp;
    const col=pct>.5?'#888':pct>.25?'#666':'#444';
    ctx.fillStyle=col; ctx.fillRect(flip?bx+bw-Math.floor(bw*pct):bx,y,Math.floor(bw*pct),bh);
    ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1; ctx.strokeRect(bx,y,bw,bh);
    ctx.fillStyle='#ccc'; ctx.font=`700 13px 'Rajdhani',sans-serif`;
    ctx.textAlign=flip?'right':'left'; ctx.fillText(this.name,flip?bx+bw-5:bx+5,y+14);
    for(let i=0;i<3;i++){
      const px=flip?bx+bw-14-(2-i)*16:bx+14+i*16;
      ctx.fillStyle=i<this.combo?'#ccc':'rgba(255,255,255,.1)';
      ctx.beginPath(); ctx.arc(px,y+bh+12,5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#888'; ctx.lineWidth=1; ctx.stroke();
    }
    if(this.combo>=3){
      ctx.globalAlpha=.55+.45*Math.abs(Math.sin(Date.now()*.006));
      ctx.fillStyle='#ccc'; ctx.font=`700 11px 'Rajdhani',sans-serif`;
      ctx.textAlign=flip?'right':'left';
      ctx.fillText('FINISHER READY',flip?bx+bw-5:bx+5,y+bh+30);
      ctx.globalAlpha=1;
    }
    // Ability system HUD for Sukuna
    if(this.type==='sukuna'){
      const k1 = this.playerNum===1 ? '1' : ',';
      const k2 = this.playerNum===1 ? '2' : '.';
      const k3 = this.playerNum===1 ? '3' : '/';
      const kQ = this.playerNum===1 ? 'Q' : "'";
      const abilityNames = [`CLEAVE [${k1}]`, `DISMANTLE [${k2}]`, `FUGA [${k3}]`];
      const abY = y+bh+38;

      for(let i=0;i<3;i++){
        const aw=86, gap=4;
        const ax = flip ? bx+bw - (i+1)*(aw+gap) + gap : bx + i*(aw+gap);

        let fillPct=1;
        if(i===0) fillPct=Math.max(0,1-this.cleaveCooldown/CLEAVE_COOLDOWN);
        if(i===1) fillPct=Math.max(0,1-this.dismantleCooldown/DISMANTLE_COOLDOWN);
        if(i===2) fillPct=Math.min(1,this.fugaCharge/FUGA_CHARGE_REQ);

        const ready = fillPct>=1;
        const isUlt = i===2;

        ctx.fillStyle='rgba(0,0,0,0.55)';
        ctx.fillRect(ax,abY,aw,22);
        const barCol = isUlt ? (ready?'#ffe066':'#886600') : (ready?'#bbb':'#555');
        ctx.fillStyle=barCol;
        ctx.fillRect(flip?ax+aw-Math.floor(aw*fillPct):ax, abY+18, Math.floor(aw*fillPct), 4);
        ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
        ctx.strokeRect(ax,abY,aw,22);
        const labelCol = !ready ? '#555' : isUlt ? '#ffe066' : '#ccc';
        ctx.fillStyle = labelCol;
        ctx.font=`700 8px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(abilityNames[i], ax+aw/2, abY+13);
      }

      // Domain charge bar
      const domY = abY+30;
      const domPct = Math.min(1, this.domainCharge/DOMAIN_CHARGE_REQ);
      const domReady = domPct>=1;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx,domY,bw,14);
      ctx.fillStyle = domReady
        ? `rgba(220,100,0,${0.7+0.3*Math.abs(Math.sin(Date.now()*0.005))})`
        : '#5a2200';
      ctx.fillRect(flip?bx+bw-Math.floor(bw*domPct):bx, domY, Math.floor(bw*domPct), 14);
      ctx.strokeStyle = domReady ? 'rgba(255,140,0,0.7)' : 'rgba(120,50,0,0.4)';
      ctx.lineWidth=1; ctx.strokeRect(bx,domY,bw,14);
      ctx.fillStyle = domReady ? '#ffcc88' : '#885533';
      ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
      ctx.fillText(domReady ? `MALEVOLENT SHRINE [${kQ}]` : `DOMAIN ${Math.floor(domPct*100)}%`, bx+bw/2, domY+10);
      if(activeDomain && activeDomain.owner===this){
        ctx.fillStyle='#f80'; ctx.fillText('DOMAIN ACTIVE', bx+bw/2, domY+10);
      }
    }

    // Gojo ability HUD
    if(this.type==='gojo'){
      const k1 = this.playerNum===1 ? '1' : ',';
      const k2 = this.playerNum===1 ? '2' : '.';
      const k3 = this.playerNum===1 ? '3' : '/';
      const kQ = this.playerNum===1 ? 'Q' : "'";
      const abY = y+bh+38;
      const abilityNames = [`LAPSE BLUE [${k1}]`, `REVERSAL RED [${k2}]`, `HOLLOW PURPLE [${k3}]`];
      const cooldowns    = [this.lapseCooldown, this.reversalCooldown, 0];
      const cdMaxes      = [LAPSE_COOLDOWN, REVERSAL_COOLDOWN, 1];
      const charges      = [1, 1, Math.min(1, this.hollowCharge/HOLLOW_CHARGE_REQ)];
      const colors       = ['#4af','#f44','#c060ff'];
      const dimColors    = ['#246','#622','#502080'];

      for(let i=0;i<3;i++){
        const aw=86, gap=4;
        const ax = flip ? bx+bw-(i+1)*(aw+gap)+gap : bx+i*(aw+gap);
        const fillPct = i<2 ? Math.max(0,1-cooldowns[i]/cdMaxes[i]) : charges[i];
        const ready = fillPct>=1;
        ctx.fillStyle='rgba(0,0,0,0.55)';
        ctx.fillRect(ax,abY,aw,22);
        ctx.fillStyle = ready ? colors[i] : dimColors[i];
        ctx.fillRect(flip?ax+aw-Math.floor(aw*fillPct):ax, abY+18, Math.floor(aw*fillPct), 4);
        ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
        ctx.strokeRect(ax,abY,aw,22);
        const labelCol = !ready ? '#556' : i===0?'#adf':i===1?'#faa':'#e0b0ff';
        ctx.fillStyle = labelCol;
        ctx.font=`700 8px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(abilityNames[i], ax+aw/2, abY+13);
      }

      // Gojo domain charge bar
      const gDomY = abY+30;
      const gDomPct = Math.min(1, this.domainCharge/DOMAIN_CHARGE_REQ);
      const gDomReady = gDomPct>=1;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx,gDomY,bw,14);
      ctx.fillStyle = gDomReady ? `rgba(60,160,240,${0.7+0.3*Math.abs(Math.sin(Date.now()*0.005))})` : '#0a2a4a';
      ctx.fillRect(flip?bx+bw-Math.floor(bw*gDomPct):bx, gDomY, Math.floor(bw*gDomPct), 14);
      ctx.strokeStyle = gDomReady ? 'rgba(80,160,240,0.7)' : 'rgba(30,80,140,0.4)';
      ctx.lineWidth=1; ctx.strokeRect(bx,gDomY,bw,14);
      ctx.fillStyle = gDomReady ? '#8cf' : '#358';
      ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
      ctx.fillText(gDomReady ? `INFINITE VOID [${kQ}]` : `DOMAIN ${Math.floor(gDomPct*100)}%`, bx+bw/2, gDomY+10);
      if(activeDomain && activeDomain.owner===this){
        ctx.fillStyle='#4af'; ctx.fillText('DOMAIN ACTIVE', bx+bw/2, gDomY+10);
      }
    }

    // Yuji HUD
    if(this.type==='yuji'){
      const abY = y+bh+38;
      const pbLabel = this.playerNum===1 ? 'PIERCING BLOOD [1]' : 'PIERCING BLOOD [,]';
      const onCooldown = this.pbCooldown > 0;
      const isCharging = this.pbChargeTime > 0;
      const tier = this.pbChargeTime>=2000 ? 2 : this.pbChargeTime>=1000 ? 1 : 0;
      const fullyCharged = this.pbChargeTime >= PB_CHARGE_MAX;

      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx,abY,bw,14);

      if(onCooldown){
        // Cooldown: grey drain bar showing time remaining
        const cdPct = this.pbCooldown / PB_COOLDOWN;
        const cdW = Math.floor(bw * (1 - cdPct));
        ctx.fillStyle='#222'; ctx.fillRect(bx,abY,bw,14);
        ctx.fillStyle='#443333'; ctx.fillRect(flip?bx+bw-cdW:bx, abY, cdW, 14);
        // Animated stripe sweep
        ctx.globalAlpha=0.18;
        for(let sx2=0;sx2<bw;sx2+=12){
          const ox2 = ((Date.now()*0.04)%12);
          ctx.fillStyle='#fff';
          ctx.fillRect(bx+(sx2+ox2)%bw, abY, 5, 14);
        }
        ctx.globalAlpha=1;
        ctx.strokeStyle='rgba(100,40,40,0.5)'; ctx.lineWidth=1; ctx.strokeRect(bx,abY,bw,14);
        ctx.fillStyle='#775555'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`COOLDOWN  ${(this.pbCooldown/1000).toFixed(1)}s`, bx+bw/2, abY+10);
      } else if(isCharging){
        // Charging: fill red based on charge
        const chargePct = Math.min(1, this.pbChargeTime / PB_CHARGE_MAX);
        const barCol = fullyCharged ? '#ff2222' : tier===2 ? '#cc1111' : tier===1 ? '#880000' : '#550000';
        ctx.fillStyle=barCol;
        if(fullyCharged){
          // Pulse the whole bar when full
          ctx.globalAlpha = 0.7 + 0.3*Math.abs(Math.sin(Date.now()*0.015));
        }
        ctx.fillRect(flip?bx+bw-Math.floor(bw*chargePct):bx, abY, Math.floor(bw*chargePct), 14);
        ctx.globalAlpha=1;
        ctx.strokeStyle='rgba(200,0,0,0.5)'; ctx.lineWidth=1; ctx.strokeRect(bx,abY,bw,14);
        // Tier markers
        for(const m of [1000/PB_CHARGE_MAX, 2000/PB_CHARGE_MAX]){
          const mx2 = flip ? bx+bw-bw*m : bx+bw*m;
          ctx.strokeStyle='rgba(255,100,100,0.6)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(mx2,abY); ctx.lineTo(mx2,abY+14); ctx.stroke();
        }
        const dmgLabels = ['10▸','20▸▸','30 MAX▸▸▸'];
        ctx.fillStyle = fullyCharged ? '#ff6666' : '#ffaaaa';
        ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(fullyCharged ? '▸▸▸ MAX CHARGE ▸▸▸' : `CHARGING  ${dmgLabels[tier]}`, bx+bw/2, abY+10);
      } else {
        // Ready
        ctx.fillStyle='#330000'; ctx.fillRect(bx,abY,bw,14);
        ctx.strokeStyle='rgba(180,0,0,0.3)'; ctx.lineWidth=1; ctx.strokeRect(bx,abY,bw,14);
        ctx.fillStyle='#884444'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`${pbLabel}  —  hold to charge`, bx+bw/2, abY+10);
      }

      // Black Blur cooldown bar
      const bbLabel = this.playerNum===1 ? 'BLACK BLUR [2]' : 'BLACK BLUR [.]';
      const bbY = abY + 18;
      const bbOnCD = this.bbCooldown > 0;
      const bbInUse = this.state === S.BLACKBLUR;
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx,bbY,bw,12);
      if(bbOnCD){
        const cdPct2 = 1 - this.bbCooldown/BB_COOLDOWN;
        ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx,bbY,bw,12);
        ctx.fillStyle='#222233'; ctx.fillRect(flip?bx+bw-Math.floor(bw*cdPct2):bx,bbY,Math.floor(bw*cdPct2),12);
        ctx.globalAlpha=0.15;
        for(let sx2=0;sx2<bw;sx2+=12){
          const ox2=((Date.now()*0.04)%12);
          ctx.fillStyle='#fff'; ctx.fillRect(bx+(sx2+ox2)%bw,bbY,5,12);
        }
        ctx.globalAlpha=1;
        ctx.fillStyle='#556'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`${bbLabel}  CD ${(this.bbCooldown/1000).toFixed(1)}s`, bx+bw/2, bbY+9);
      } else if(bbInUse){
        ctx.fillStyle='#334'; ctx.fillRect(bx,bbY,bw,12);
        const pulse=0.6+0.4*Math.abs(Math.sin(Date.now()*0.012));
        ctx.globalAlpha=pulse; ctx.fillStyle='#aaccff';
        ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText('▸▸▸ BLACK BLUR ACTIVE ▸▸▸', bx+bw/2, bbY+9);
        ctx.globalAlpha=1;
      } else {
        ctx.fillStyle='#1a1a2a'; ctx.fillRect(bx,bbY,bw,12);
        ctx.strokeStyle='rgba(80,80,160,0.4)'; ctx.lineWidth=1; ctx.strokeRect(bx,bbY,bw,12);
        ctx.fillStyle='#6688aa'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`${bbLabel}  —  lunge combo`, bx+bw/2, bbY+9);
      }

      // Yuji Ultimate charge bar
      const ultLabel = this.playerNum===1 ? 'DISMANTLE [Q]' : "DISMANTLE [']";
      const ultY = bbY + 16;
      const ultPct = Math.min(1, this.yujiUltCharge / YUJI_ULT_COST);
      const ultReady = ultPct >= 1 && this.yujiUltCooldown <= 0;
      const ultActive = this.state === S.YUJIULT;
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx,ultY,bw,12);
      if(ultActive){
        const p2=0.6+0.4*Math.abs(Math.sin(Date.now()*0.01));
        ctx.globalAlpha=p2; ctx.fillStyle='#fff'; ctx.fillRect(bx,ultY,bw,12); ctx.globalAlpha=1;
        ctx.fillStyle='#111'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText('▸▸▸ DISMANTLE ▸▸▸', bx+bw/2, ultY+9);
      } else if(this.yujiUltCooldown>0){
        const cdPct2=1-this.yujiUltCooldown/YUJI_ULT_COOLDOWN;
        ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx,ultY,bw,12);
        ctx.fillStyle='#2a2a2a'; ctx.fillRect(flip?bx+bw-Math.floor(bw*cdPct2):bx,ultY,Math.floor(bw*cdPct2),12);
        ctx.fillStyle='#666'; ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(`${ultLabel}  CD ${(this.yujiUltCooldown/1000).toFixed(1)}s`, bx+bw/2, ultY+9);
      } else {
        const fillCol = ultReady ? `rgba(245,200,50,${0.7+0.3*Math.abs(Math.sin(Date.now()*0.006))})` : 'rgba(180,160,40,0.6)';
        ctx.fillStyle='#111'; ctx.fillRect(bx,ultY,bw,12);
        ctx.fillStyle=fillCol; ctx.fillRect(flip?bx+bw-Math.floor(bw*ultPct):bx,ultY,Math.floor(bw*ultPct),12);
        ctx.strokeStyle=ultReady?'rgba(245,200,50,0.7)':'rgba(100,90,20,0.3)'; ctx.lineWidth=1; ctx.strokeRect(bx,ultY,bw,12);
        ctx.fillStyle=ultReady?'#ffe566':'#886';
        ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(ultReady?`${ultLabel}  — READY`:
          `${ultLabel}  ${Math.floor(ultPct*100)}%`, bx+bw/2, ultY+9);
      }
    }

    // Yuta HUD — panel style matching Gojo/Sukuna
    if(this.type==='yuta'){
      const k1 = this.playerNum===1 ? '1' : ',';
      const k2 = this.playerNum===1 ? '2' : '.';
      const k3 = this.playerNum===1 ? '3' : '/';
      const kQ = this.playerNum===1 ? 'Q' : "'";
      const abY = y+bh+38;

      for(let i=0;i<3;i++){
        const aw=86, gap=4;
        const ax = flip ? bx+bw-(i+1)*(aw+gap)+gap : bx+i*(aw+gap);
        const isActive = (i===0 && this.state===S.YUTASLICE) ||
                         (i===1 && this.state===S.YUTAFIST);

        let fillPct;
        if(i===0)      fillPct = Math.max(0, 1-this.yutaSliceCooldown/YUTA_SLICE_COOLDOWN);
        else if(i===1) fillPct = Math.max(0, 1-this.yutaFistCooldown/YUTAFIST_COOLDOWN);
        else           fillPct = this.yutaCopiedUlt ? 1 : Math.min(1, this.yutaCopyUltCharge/YUTA_COPY_ULT_REQ);

        const ready = fillPct>=1;
        const isUlt = i===2;

        ctx.fillStyle='rgba(0,0,0,0.55)';
        ctx.fillRect(ax,abY,aw,22);

        const barCol = isActive ? 'rgba(255,136,204,0.9)'
                     : isUlt ? (ready?'#ff88cc':'#662244')
                     : (ready?'#ff88cc':'#553344');
        ctx.fillStyle=barCol;
        ctx.fillRect(flip?ax+aw-Math.floor(aw*fillPct):ax, abY+18, Math.floor(aw*fillPct), 4);

        ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
        ctx.strokeRect(ax,abY,aw,22);

        const labelCol = (!ready && !isActive) ? '#554' : isUlt && this.yutaCopiedUlt ? '#ffccee' : '#ffaadd';
        ctx.fillStyle = labelCol;
        ctx.font=`700 8px 'Rajdhani',sans-serif`; ctx.textAlign='center';

        // Key+name label inside box — matches Gojo/Sukuna style
        let label;
        if(i===0)      label = `SLICE [${k1}]`;
        else if(i===1) label = `FIST [${k2}]`;
        else if(this.yutaCopiedUlt){
          const n = this.yutaCopiedUlt==='yuji'?'DISMANTLE'
                  : this.yutaCopiedUlt==='gojo'?'HOLLOW'
                  : this.yutaCopiedUlt==='sukuna'?'FUGA':'SLICE';
          label = `COPY: ${n} [${k3}]`;
          ctx.fillStyle='#ffccee';
        } else {
          label = `COPY [${k3}]`;
        }
        ctx.fillText(label, ax+aw/2, abY+13);
      }

      // Domain charge bar (moved up — no subtext between panels and bar)
      const domY = abY+30;
      const domPct = Math.min(1, this.domainCharge/DOMAIN_CHARGE_REQ);
      const domReady = domPct>=1;
      const domActive = activeDomain && activeDomain.owner===this && activeDomain.type==='love';
      const domLabel = `AUTHENTIC MUTUAL LOVE [${kQ}]`;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx,domY,bw,14);
      if(domActive){
        // Domain active — show Jacob's Ladder progress instead
        const jPct = Math.min(1, this.jacobLadderCharge/JACOB_LADDER_REQ);
        const jReady = this.jacobReady;
        ctx.fillStyle = jReady
          ? `rgba(180,0,255,${0.7+0.3*Math.abs(Math.sin(Date.now()*0.007))})`
          : 'rgba(100,0,180,0.7)';
        ctx.fillRect(flip?bx+bw-Math.floor(bw*jPct):bx, domY, Math.floor(bw*jPct), 14);
        ctx.strokeStyle='rgba(200,80,255,0.6)'; ctx.lineWidth=1; ctx.strokeRect(bx,domY,bw,14);
        // Katana pip markers
        for(let m=1;m<JACOB_LADDER_REQ;m++){
          const mx2 = flip ? bx+bw-bw*(m/JACOB_LADDER_REQ) : bx+bw*(m/JACOB_LADDER_REQ);
          ctx.strokeStyle='rgba(255,150,255,0.5)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(mx2,domY); ctx.lineTo(mx2,domY+14); ctx.stroke();
        }
        ctx.fillStyle = jReady ? '#ffccff' : '#cc88ff';
        ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(jReady ? "JACOB'S LADDER — READY!" : `JACOB'S LADDER  ${this.jacobLadderCharge}/${JACOB_LADDER_REQ}`, bx+bw/2, domY+10);
      } else {
        ctx.fillStyle = domReady
          ? `rgba(200,80,255,${0.7+0.3*Math.abs(Math.sin(Date.now()*0.005))})`
          : '#3a0055';
        ctx.fillRect(flip?bx+bw-Math.floor(bw*domPct):bx, domY, Math.floor(bw*domPct), 14);
        ctx.strokeStyle = domReady ? 'rgba(200,80,255,0.7)' : 'rgba(100,30,150,0.4)';
        ctx.lineWidth=1; ctx.strokeRect(bx,domY,bw,14);
        ctx.fillStyle = domReady ? '#ffaaff' : '#885599';
        ctx.font=`700 9px 'Rajdhani',sans-serif`; ctx.textAlign='center';
        ctx.fillText(domReady ? domLabel : `DOMAIN  ${Math.floor(domPct*100)}%`, bx+bw/2, domY+10);
      }

      ctx.globalAlpha=1;
    }
  }
}

function overlaps(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

// ═══════════════════════════════════════════════════════════
//  CHARACTER REGISTRY
//  To add your own character:
//  1. Push a new object into the CHARACTERS array below.
//  2. Required fields:
//       name   – Display name (string)
//       type   – Unique id string used in ability logic (e.g. 'mychar')
//       color  – Main limb color (CSS color string)
//       dimColor – Shadow/dim limb color
//  3. Optional fields:
//       image  – URL or base64 data-URI for a custom avatar image shown
//                in the character select screen (64×64 display size).
//                Example: image: 'https://example.com/mychar.png'
//       description – Short description shown on the select screen.
//  4. Custom abilities:
//       Add ability logic inside Player._startAbilityA() / _tickAbilityA()
//       methods and gate them with  if(this.type==='mychar'){ ... }
//       Then add the type to the ability system switch in update().
//  5. Ability keys are shared (G/H for P1, P/[ for P2, T/Y for domains).
// ═══════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
//  SPRITE ANIMATION SYSTEM
//
//  To add sprites for a character, add a `sprites` object to
//  their entry in CHARACTERS (see documentation below).
//
//  SpriteAnimator handles:
//    - Loading & caching sprite sheet images
//    - Mapping game states → animation clips
//    - Frame timing & looping
//    - Horizontal flip for facing direction
//    - Fallback to stick figures if no sheet defined
// ═══════════════════════════════════════════════════════════

const _spriteCache = {};   // url → HTMLImageElement
const _spriteLoaded = {};  // url → boolean

function _loadSprite(url){
  if(_spriteCache[url]) return _spriteCache[url];
  const img = new Image();
  img.onload  = () => { _spriteLoaded[url] = true; };
  img.onerror = () => { _spriteLoaded[url] = false; console.warn('Sprite failed:', url); };
  img.src = url;
  _spriteCache[url] = img;
  return img;
}

// ── SpriteAnimator ──────────────────────────────────────────
//  Created once per Player when their character has `sprites`.
//  Tracks current clip, frame index, and elapsed time.
class SpriteAnimator {
  constructor(config){
    this.sheet  = _loadSprite(config.url);
    this.fw     = config.frameWidth;    // px width of one frame on sheet
    this.fh     = config.frameHeight;   // px height of one frame
    this.scale  = config.scale  || 1;   // draw scale (1 = native size)
    this.clips  = config.clips;         // map: stateName → clip def (see below)
    this.defaultClip = config.defaultClip || 'idle';

    this._clip  = null;  // current clip def
    this._frame = 0;     // current frame index within clip
    this._t     = 0;     // ms elapsed in current frame
    this._name  = '';    // name of current clip

    // Anchor: where the sprite's "feet" are relative to sprite top-left.
    // Used to align sprite to the physics body position.
    this.anchorX = config.anchorX || config.frameWidth  * 0.5;
    this.anchorY = config.anchorY || config.frameHeight * 1.0;
  }

  // Call every frame with the current game state name and dt
  update(stateName, dt, combo){
    const clipName = this._resolveClip(stateName, this._ownerVy || 0, combo || 0);
    if(clipName !== this._name){
      this._name  = clipName;
      this._clip  = this.clips[clipName] || this.clips[this.defaultClip];
      this._frame = 0;
      this._t     = 0;
    }
    if(!this._clip) return;
    this._t += dt;
    const spf = 1000 / (this._clip.fps || 12);  // ms per frame
    if(this._t >= spf){
      this._t -= spf;
      this._frame++;
      const len = this._clip.frames.length;
      if(this._frame >= len){
        this._frame = this._clip.loop !== false ? 0 : len - 1;
      }
    }
  }

  // Draw the current frame at world position (px, py) with optional x-flip
  draw(px, py, flipX){
    if(!_spriteLoaded[this.sheet.src] || !this._clip) return false;
    const frame = this._clip.frames[this._frame];
