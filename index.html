    if(frame === undefined) return false;

    // Each frame is an [col, row] index into the sheet grid
    const [col, row] = Array.isArray(frame) ? frame : [frame, 0];
    const sx = col * this.fw;
    const sy = row * this.fh;
    const dw = this.fw  * this.scale;
    const dh = this.fh  * this.scale;
    const dx = px - this.anchorX * this.scale;
    const dy = py - this.anchorY * this.scale;

    ctx.save();
    if(flipX){
      // Flip horizontally around the anchor point
      ctx.translate(px, py);
      ctx.scale(-1, 1);
      ctx.translate(-px, -py);
    }
    ctx.drawImage(this.sheet, sx, sy, this.fw, this.fh, dx, dy, dw, dh);
    ctx.restore();
    return true;
  }

  _resolveClip(stateName, vy, combo){
    // Distinguish jump (rising) vs fall (falling) for air state
    if(stateName === 'air'){
      if(this.clips['fall'] && vy > 0) return 'fall';
      if(this.clips['jump']) return 'jump';
    }
    // Combo-based attack clips
    if(stateName === 'atck'){
      if(this.clips['finisher'] && combo >= 3) return 'finisher';
      if(this.clips['attack3']  && combo === 2) return 'attack3';
      if(this.clips['attack2']  && combo === 1) return 'attack2';
      if(this.clips['atck']) return 'atck';
    }
    if(this.clips[stateName]) return stateName;
    const fallbacks = {
      atck:'attack', walk:'walk', air:'jump', idle:'idle',
      stun:'stun', ragd:'hurt', slam:'hurt', dead:'dead',
      cleave:'attack', dismantle:'attack', fuga:'attack',
      lapse:'ability', reversal:'ability', hollow:'ability',
      domain:'ability', blackflash:'attack', blackblur:'attack',
      yujiult:'ability', yutaslice:'attack', yutafist:'attack',
      yutacopy:'ability',
    };
    const mapped = fallbacks[stateName];
    if(mapped && this.clips[mapped]) return mapped;
    return this.defaultClip;
  }
}

/* ── HOW TO ADD SPRITES TO A CHARACTER ─────────────────────
 *
 *  In the CHARACTERS array, add a `sprites` object:
 *
 *  {
 *    name: 'MYCHAR',
 *    type: 'mychar',
 *    color: '#ff0000',
 *    dimColor: '#aa0000',
 *    sprites: {
 *      url: 'https://example.com/mychar_sheet.png',
 *
 *      // Size of ONE frame on the sheet (in pixels)
 *      frameWidth:  64,
 *      frameHeight: 64,
 *
 *      // Draw scale — 2 means each frame drawn at 128×128 px
 *      scale: 2,
 *
 *      // Anchor point: where the character's feet are on the frame.
 *      // anchorX = horizontal center of sprite (default: frameWidth/2)
 *      // anchorY = bottom of sprite           (default: frameHeight)
 *      anchorX: 32,
 *      anchorY: 64,
 *
 *      // Which clip to use when no specific mapping is found
 *      defaultClip: 'idle',
 *
 *      // Animation clips — keys are game state names OR generic names.
 *      // Generic names used as fallbacks: idle, walk, jump, attack,
 *      //   hurt, dead, ability, stun
 *      //
 *      // Each clip:
 *      //   frames: array of [col, row] indices into the sheet grid,
 *      //           OR just [col] if all frames are on row 0
 *      //   fps:    playback speed (frames per second, default 12)
 *      //   loop:   false to hold on last frame (default: true)

 *        walk:   { frames: [[0,1],[1,1],[2,1],[3,1]],  fps: 12 },

 *  The sprite will automatically replace the stick figure for

function buildPlayer(charIdx, startX, facing, ctrl, playerNum){
  const ch = CHARACTERS[charIdx] || CHARACTERS[0];
  const p = new Player({
    x: startX,
    name: ch.name,
    type: ch.type,
    facing,
    ctrl,
    charColor: ch.color,
    charDimColor: ch.dimColor,
    playerNum: playerNum
  });
  // Attach sprite animator if the character has a sprites config
  if(ch.sprites){
    p.spriteAnim = new SpriteAnimator(ch.sprites);
  } else {
    p.spriteAnim = null;
  }
  return p;
}

const bgKanji=[{ch:'呪',x:88,y:200,s:115,a:.04},{ch:'術',x:790,y:178,s:115,a:.04},{ch:'廻',x:440,y:260,s:88,a:.025}];
const driftP=Array.from({length:28},()=>({x:Math.random()*W,y:Math.random()*H,vy:-(0.14+Math.random()*.3),r:.5+Math.random()*1.2,a:.05+Math.random()*.1}));

function drawBG(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#3a3830'); bg.addColorStop(.5,'#2e2c26'); bg.addColorStop(1,'#242220');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.018)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GND);ctx.stroke();}
  for(let y=60;y<GND;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const k of bgKanji){ctx.font=`${k.s}px serif`;ctx.fillStyle='#888';ctx.globalAlpha=k.a;ctx.fillText(k.ch,k.x,k.y);}
  ctx.globalAlpha=1; ctx.textBaseline='alphabetic';
  for(const p of driftP){p.y+=p.vy;if(p.y<0)p.y=H;ctx.globalAlpha=p.a;ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  const gf=ctx.createLinearGradient(0,GND,0,H);
  gf.addColorStop(0,'#1e1c18'); gf.addColorStop(1,'#141210');
  ctx.fillStyle=gf; ctx.fillRect(0,GND,W,H-GND);
  ctx.strokeStyle='rgba(200,195,185,.38)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,GND); ctx.lineTo(W,GND); ctx.stroke();
}

function drawHUDOverlay(){
  ctx.textAlign='center'; ctx.font=`700 14px 'Rajdhani',sans-serif`;
  ctx.fillStyle='rgba(200,195,185,.2)'; ctx.fillText('CURSED CLASH',W/2,30);
  p1.drawHUD(22,false); p2.drawHUD(W-22,true);
  if(gameMode==='endless'){
    // Kills counter
    const ky=130;
    ctx.font=`700 13px 'Rajdhani',sans-serif`;
    ctx.fillStyle='rgba(200,195,185,0.85)';
    ctx.textAlign='left';  ctx.fillText(`KILLS: ${p1kills}`, 22, ky);
    ctx.textAlign='right'; ctx.fillText(`KILLS: ${p2kills}`, W-22, ky);
    // Mode label
    ctx.textAlign='center';
    ctx.font=`500 10px 'Rajdhani',sans-serif`;
    ctx.fillStyle='rgba(200,195,185,0.35)';
    ctx.fillText('ENDLESS', W/2, ky);
  } else {
    // Lives indicators
    const livesY = 130;
    for(let i=0;i<3;i++){
      const px = 22 + i*16;
      ctx.fillStyle = i<p1lives ? '#cc2222' : 'rgba(180,50,50,0.15)';
      ctx.strokeStyle = i<p1lives ? '#ff4444' : 'rgba(180,50,50,0.3)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(px, livesY, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }
    for(let i=0;i<3;i++){
      const px = W-22 - i*16;
      ctx.fillStyle = i<p2lives ? '#cc2222' : 'rgba(180,50,50,0.15)';
      ctx.strokeStyle = i<p2lives ? '#ff4444' : 'rgba(180,50,50,0.3)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(px, livesY, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }
  }
}

function drawFightText(dt){
  if(fightTxtT<=0) return;
  fightTxtT=Math.max(0,fightTxtT-dt);
  const life=fightTxtT/900;
  ctx.save(); ctx.globalAlpha=Math.min(1,life*2.5); ctx.textAlign='center';
  ctx.translate(W/2,H/2-50); ctx.scale(1+(1-life)*.1,1+(1-life)*.1);
  ctx.font=`700 62px 'Rajdhani',sans-serif`;
  ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.lineWidth=5; ctx.strokeText(fightTxt,0,0);
  ctx.fillStyle='#d8d4cc'; ctx.fillText(fightTxt,0,0);
  ctx.restore();
}

function drawHome(){
  const a=Math.min(1,homeT/500);
  ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center';
  // Title
  ctx.font=`700 80px 'Rajdhani',sans-serif`;
  ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.lineWidth=6;
  ctx.strokeText('CURSED CLASH',W/2,H/2-100);
  ctx.fillStyle='#d8d4cc'; ctx.fillText('CURSED CLASH',W/2,H/2-100);
  // Subtitle
  ctx.font=`500 15px 'Rajdhani',sans-serif`; ctx.fillStyle='rgba(180,175,165,.7)';
  ctx.fillText('P1: A / D move  ·  W jump  ·  F attack  ·  G/H abilities',W/2,H/2-44);
  ctx.fillText('P2: ← / → move  ·  ↑ jump  ·  ; attack  ·  P/[ abilities',W/2,H/2-22);
  ctx.fillText('Best of 3 lives',W/2,H/2+6);
  // Start button
  const bw=220,bh=48,bx=W/2-bw/2,by=H/2+38;
  const btnHover = homeT>600;
  ctx.fillStyle=btnHover?'rgba(200,195,185,0.18)':'rgba(200,195,185,0.08)';
  ctx.strokeStyle=btnHover?'rgba(200,195,185,0.7)':'rgba(200,195,185,0.35)';
  ctx.lineWidth=1.5;
  // Manual rounded rect (roundRect not supported in all browsers)
  const r=6;
  ctx.beginPath();
  ctx.moveTo(bx+r,by); ctx.lineTo(bx+bw-r,by);
  ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+r);
  ctx.lineTo(bx+bw,by+bh-r);
  ctx.quadraticCurveTo(bx+bw,by+bh,bx+bw-r,by+bh);
  ctx.lineTo(bx+r,by+bh);
  ctx.quadraticCurveTo(bx,by+bh,bx,by+bh-r);
  ctx.lineTo(bx,by+r);
  ctx.quadraticCurveTo(bx,by,bx+r,by);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle=btnHover?'#d8d4cc':'rgba(200,195,185,0.6)';
  ctx.font=`700 20px 'Rajdhani',sans-serif`; ctx.letterSpacing='3px';
  ctx.fillText('START',W/2,by+31);
  ctx.restore();
}

function drawModeSelect(){
  ctx.save();
  ctx.textAlign='center';

  // Title
  ctx.font=`700 38px 'Rajdhani',sans-serif`;
  ctx.fillStyle='#d8d4cc';
  ctx.fillText('SELECT MODE', W/2, 58);
  ctx.font=`500 12px 'Rajdhani',sans-serif`;
  ctx.fillStyle='rgba(180,175,165,0.6)';
  ctx.fillText('A/D or ←/→ to choose  ·  F or ; to confirm', W/2, 78);

  const modes = [
    { id:'normal',  label:'NORMAL',  sub:'Best of 3 lives — classic rounds' },
    { id:'endless', label:'ENDLESS', sub:'Infinite respawns — no intermission' }
  ];

  const panelW=200, panelH=120, gap=40;
  const startX = W/2 - panelW - gap/2;

  for(let i=0;i<modes.length;i++){
    const m = modes[i];
    const px = startX + i*(panelW+gap);
    const py = H/2 - panelH/2;
    const sel = modeSelectIdx===i;

    // Panel
    ctx.fillStyle = sel ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.4)';
    ctx.fillRect(px, py, panelW, panelH);
    ctx.strokeStyle = sel ? '#d8d4cc' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(px, py, panelW, panelH);

    // Mode icon
    ctx.font=`700 32px 'Rajdhani',sans-serif`;
    ctx.fillStyle = sel ? '#d8d4cc' : 'rgba(180,175,165,0.5)';
    ctx.fillText(i===0 ? '⚔' : '∞', px+panelW/2, py+52);

    // Mode name
    ctx.font=`700 18px 'Rajdhani',sans-serif`;
    ctx.fillStyle = sel ? '#d8d4cc' : 'rgba(150,145,135,0.7)';
    ctx.fillText(m.label, px+panelW/2, py+76);

    // Description
    ctx.font=`500 10px 'Rajdhani',sans-serif`;
    ctx.fillStyle='rgba(160,155,145,0.65)';
    ctx.fillText(m.sub, px+panelW/2, py+96);

    // Arrow nav
    if(i===0) ctx.fillText('◀', px+14, py+panelH/2+4);
    if(i===modes.length-1) ctx.fillText('▶', px+panelW-14, py+panelH/2+4);
  }

  // Confirm prompt
  const pulse = 0.6 + 0.4*Math.abs(Math.sin(Date.now()*0.005));
  ctx.globalAlpha = pulse;
  ctx.font=`700 14px 'Rajdhani',sans-serif`;
  ctx.fillStyle='#d8d4cc';
  ctx.fillText('PRESS F OR ; TO CONFIRM', W/2, H-40);
  ctx.globalAlpha=1;

  ctx.restore();
}

function drawCharSelect(){
  ctx.save(); ctx.textAlign='center';
  // Title
  ctx.font=`700 36px 'Rajdhani',sans-serif`;
  ctx.fillStyle='#d8d4cc';
  ctx.fillText('SELECT CHARACTER', W/2, 55);
  ctx.font=`500 12px 'Rajdhani',sans-serif`; ctx.fillStyle='rgba(180,175,165,0.6)';
  ctx.fillText('P1: A/D cycle  F confirm     P2: ←/→ cycle  ; confirm', W/2, 76);

  const panelW=200, panelH=220, gap=40;
  const p1x=W/2-panelW-gap/2, p2x=W/2+gap/2;

  for(let p=0;p<2;p++){
    const px=p===0?p1x:p2x;
    const idx=p===0?p1CharIdx:p2CharIdx;
    const confirmed=p===0?p1Confirmed:p2Confirmed;
    const ch=CHARACTERS[idx];
    const py=H/2-panelH/2;

    // Panel background
    ctx.fillStyle=confirmed?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.4)';
    ctx.fillRect(px,py,panelW,panelH);
    ctx.strokeStyle=confirmed?ch.color:'rgba(255,255,255,0.2)';
    ctx.lineWidth=confirmed?2:1;
    ctx.strokeRect(px,py,panelW,panelH);

    // Player label
    ctx.fillStyle='rgba(180,175,165,0.55)'; ctx.font=`700 11px 'Rajdhani',sans-serif`;
    ctx.fillText(`PLAYER ${p+1}`, px+panelW/2, py+18);

    // Character avatar / color swatch
    const swatchY=py+34;
    if(ch.image){
      const img=new Image(); img.src=ch.image;
      ctx.drawImage(img, px+panelW/2-32, swatchY, 64, 64);
    } else {
      // Stick figure preview in character color
      ctx.strokeStyle=ch.color; ctx.lineWidth=2.5;
      const fx=px+panelW/2, fy=swatchY+16;
      ctx.beginPath(); ctx.arc(fx,fy,10,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx,fy+10); ctx.lineTo(fx,fy+34); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx-14,fy+20); ctx.lineTo(fx+14,fy+20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx,fy+34); ctx.lineTo(fx-10,fy+54); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx,fy+34); ctx.lineTo(fx+10,fy+54); ctx.stroke();
    }

    // Character name
    ctx.fillStyle=ch.color; ctx.font=`700 18px 'Rajdhani',sans-serif`;
    ctx.fillText(ch.name, px+panelW/2, swatchY+78);

    // Description
    ctx.fillStyle='rgba(180,175,165,0.7)'; ctx.font=`500 10px 'Rajdhani',sans-serif`;
    const words=(ch.description||'').split(' · ');
    words.forEach((w,wi)=>ctx.fillText(w, px+panelW/2, swatchY+96+wi*14));

    // Arrow navigation
    ctx.fillStyle='rgba(200,195,185,0.5)'; ctx.font=`700 18px 'Rajdhani',sans-serif`;
    ctx.fillText('◀', px+16, py+panelH/2+6);
    ctx.fillText('▶', px+panelW-16, py+panelH/2+6);

    // Confirm prompt / confirmed state
    if(confirmed){
      ctx.fillStyle=ch.color; ctx.font=`700 13px 'Rajdhani',sans-serif`;
      ctx.fillText('✓ READY', px+panelW/2, py+panelH-14);
    } else {
      ctx.globalAlpha=0.6+0.4*Math.abs(Math.sin(Date.now()*0.005));
      ctx.fillStyle='#d8d4cc'; ctx.font=`700 11px 'Rajdhani',sans-serif`;
      ctx.fillText('PRESS F / ; TO CONFIRM', px+panelW/2, py+panelH-14);
      ctx.globalAlpha=1;
    }
  }

  // Both confirmed — countdown
  if(p1Confirmed && p2Confirmed){
    const elapsed = window._bothConfirmedTimer || 0;
    const pct = elapsed / 1200;
    ctx.globalAlpha = 0.7 + 0.3*Math.abs(Math.sin(Date.now()*0.01));
    ctx.font=`700 22px 'Rajdhani',sans-serif`; ctx.fillStyle='#d8d4cc';
    ctx.fillText('BOTH READY!', W/2, H-56);
    ctx.globalAlpha = 1;
    // Progress bar
    const bw=200, bh=5, bx=W/2-bw/2, by=H-38;
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#d8d4cc'; ctx.fillRect(bx,by,bw*pct,bh);
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
  }
  ctx.restore();
}

function drawRoundEnd(){
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font=`700 48px 'Rajdhani',sans-serif`;
  ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.lineWidth=5;
  ctx.strokeText(roundWinner.name+' WINS THE ROUND',W/2,H/2-16);
  ctx.fillStyle='#d8d4cc'; ctx.fillText(roundWinner.name+' WINS THE ROUND',W/2,H/2-16);
  ctx.font=`500 15px 'Rajdhani',sans-serif`; ctx.fillStyle='rgba(180,175,165,.65)';
  ctx.fillText(`${p1.name}: ${p1lives} ❤  ·  ${p2.name}: ${p2lives} ❤`,W/2,H/2+22);
  ctx.fillText('Next round starting...',W/2,H/2+48);
}

function drawMatchEnd(){
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font=`700 64px 'Rajdhani',sans-serif`;
  ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.lineWidth=6;
  ctx.strokeText(winner.name+' WINS!',W/2,H/2-30);
  ctx.fillStyle='#d8d4cc'; ctx.fillText(winner.name+' WINS!',W/2,H/2-30);
  ctx.font=`500 17px 'Rajdhani',sans-serif`; ctx.fillStyle='rgba(170,165,155,.55)';
  ctx.fillText('Press F or ; to return to menu',W/2,H/2+22);
}

let last=0;
function loop(ts){
  const dt=Math.min(ts-last,50); last=ts;
  let sx=0,sy=0;
  if(shakeMag>.5){sx=(Math.random()-.5)*shakeMag;sy=(Math.random()-.5)*shakeMag;shakeMag*=.78;}else shakeMag=0;
  ctx.save();
  const scaleX=canvas.width/W, scaleY=canvas.height/H;
  ctx.scale(scaleX,scaleY);
  ctx.translate(sx,sy);
  drawBG();

  if(phase==='home'){
    homeT+=dt; p1.draw(); p2.draw(); drawHome();
    if(keys['KeyF']||keys['Semicolon']){
      phase='modeSelect';
      modeSelectIdx=0; modeSelectDown=true;
    }

  } else if(phase==='modeSelect'){
    drawBG(); drawModeSelect();
    const msLeft  = (keys['KeyA']||keys['ArrowLeft'])  && !modeSelectDown;
    const msRight = (keys['KeyD']||keys['ArrowRight']) && !modeSelectDown;
    const msConf  = (keys['KeyF']||keys['Semicolon'])  && !modeSelectDown;
    if(keys['KeyA']||keys['KeyD']||keys['ArrowLeft']||keys['ArrowRight']||keys['KeyF']||keys['Semicolon'])
      modeSelectDown=true;
    else modeSelectDown=false;
    if(msLeft)  modeSelectIdx=Math.max(0,modeSelectIdx-1);
    if(msRight) modeSelectIdx=Math.min(1,modeSelectIdx+1);
    if(msConf){
      gameMode = modeSelectIdx===0 ? 'normal' : 'endless';
      phase='charSelect';
      p1CharIdx=0; p2CharIdx=Math.min(1,CHARACTERS.length-1);
      p1Confirmed=false; p2Confirmed=false;
      p1SelectDown=false; p2SelectDown=false;
      p1ConfirmDown=true; p2ConfirmDown=true;
    }

  } else if(phase==='charSelect'){
    drawBG(); drawCharSelect();
    // P1 navigation: A/D cycle, F confirm
    const p1Left  = keys['KeyA'] && !p1SelectDown;
    const p1Right = keys['KeyD'] && !p1SelectDown;
    const p1Conf  = keys['KeyF'] && !p1ConfirmDown;
    if(keys['KeyA']||keys['KeyD']) p1SelectDown=true; else p1SelectDown=false;
    if(keys['KeyF']) p1ConfirmDown=true; else p1ConfirmDown=false;
    if(!p1Confirmed){
      if(p1Left)  p1CharIdx=(p1CharIdx-1+CHARACTERS.length)%CHARACTERS.length;
      if(p1Right) p1CharIdx=(p1CharIdx+1)%CHARACTERS.length;
    }
    if(p1Conf) p1Confirmed=!p1Confirmed;

    // P2 navigation: ←/→ cycle, ; confirm
    const p2Left  = keys['ArrowLeft'] && !p2SelectDown;
    const p2Right = keys['ArrowRight'] && !p2SelectDown;
    const p2Conf  = keys['Semicolon'] && !p2ConfirmDown;
    if(keys['ArrowLeft']||keys['ArrowRight']) p2SelectDown=true; else p2SelectDown=false;
    if(keys['Semicolon']) p2ConfirmDown=true; else p2ConfirmDown=false;
    if(!p2Confirmed){
      if(p2Left)  p2CharIdx=(p2CharIdx-1+CHARACTERS.length)%CHARACTERS.length;
      if(p2Right) p2CharIdx=(p2CharIdx+1)%CHARACTERS.length;
    }
    if(p2Conf) p2Confirmed=!p2Confirmed;

    // Both confirmed → countdown then start fight
    if(p1Confirmed && p2Confirmed){
      if(!window._bothConfirmedTimer) window._bothConfirmedTimer = 0;
      window._bothConfirmedTimer += dt;
      if(window._bothConfirmedTimer >= 1200){
        window._bothConfirmedTimer = 0;
        p1 = buildPlayer(p1CharIdx, 170,  1, {left:'KeyA',right:'KeyD',jmp:'KeyW',atk:'KeyF'}, 1);
        p2 = buildPlayer(p2CharIdx, 690, -1, {left:'ArrowLeft',right:'ArrowRight',jmp:'ArrowUp',atk:'Semicolon'}, 2);
        p1lives=3; p2lives=3; clearProjectiles();
        activeDomain=null; domainFlash=0;
        winner=null; roundWinner=null;
        phase='fight'; showTxt('FIGHT!');
      }
    } else {
      window._bothConfirmedTimer = 0;
    }

  } else if(phase==='fight'){
    const fdt = dt * timeScale;
    p1.update(fdt,p2); p2.update(fdt,p1);
    for(const [atk,def] of [[p1,p2],[p2,p1]]){
      if(atk.hitboxOn&&!atk.atkHit&&def.hittable){
        const ab=atk.atkBox(), db=def.bodyBox();
        if(ab&&overlaps(ab,db)) atk.landHit(def);
      }
    }
    // Cleave projectile collision
    for(let i=cleaves.length-1;i>=0;i--){
      const cl=cleaves[i];
      if(cl.hit) continue;
      const def = cl.owner===p1 ? p2 : p1;
      if(!def.hittable) continue;
      const db=def.bodyBox();
      const cb={x:cl.x - 48, y:cl.y - 48, w:96, h:96};
      if(overlaps(cb,db)){
        cl.hit=true;
        const mx=def.x+PW/2, my=def.y+PH/2;
        def.hp=Math.max(0,def.hp-CLEAVE_DMG); def.flash=280;
        addParts(mx,my,'#ddd',14,5); addRing(mx,my,'#fff',55);
        addDmg(mx,def.y-14,CLEAVE_DMG,'#eee'); doShake(9);
        if(cl.owner.type==='sukuna') cl.owner.fugaCharge=Math.min(FUGA_CHARGE_REQ,cl.owner.fugaCharge+CLEAVE_DMG);
        cl.owner.domainCharge=Math.min(DOMAIN_CHARGE_REQ,cl.owner.domainCharge+CLEAVE_DMG);
        if(def.hp<=0){ def._initRd(cl.dir*9,-6,.12*cl.dir); def.ss(S.DEAD); }
        else { def._initRd(cl.dir*7,-4,.09*cl.dir); def.ss(S.RAGD,RAGD_MS); }
        cleaves.splice(i,1);
      }
    }
    tickCleaves(fdt);
    tickLapseOrbs(fdt, p1, p2);
    // Reversal Red collision
    for(let i=reversalShots.length-1;i>=0;i--){
      const rs=reversalShots[i];
      if(rs.hit) continue;
      const def = rs.owner===p1 ? p2 : p1;
      if(!def.hittable) continue;
      const db=def.bodyBox();
      const rb={x:rs.x-28,y:rs.y-10,w:56,h:20};
      if(overlaps(rb,db)){
        rs.hit=true;
        const mx=def.x+PW/2, my=def.y+PH/2;
        def.hp=Math.max(0,def.hp-REVERSAL_DMG); def.flash=260;
        addReversalExplosion(mx,my,rs.dir);
        addDmg(mx,def.y-14,REVERSAL_DMG,'#f88');
        if(rs.owner.type==='gojo') rs.owner.hollowCharge=Math.min(HOLLOW_CHARGE_REQ,rs.owner.hollowCharge+REVERSAL_DMG);
        rs.owner.domainCharge=Math.min(DOMAIN_CHARGE_REQ,rs.owner.domainCharge+REVERSAL_DMG);
        if(def.hp<=0){ def._initRd(rs.dir*REVERSAL_KB,-6,.13*rs.dir); def.ss(S.DEAD); }
        else { def._initRd(rs.dir*REVERSAL_KB,-5,.11*rs.dir); def.ss(S.RAGD,RAGD_MS); }
        reversalShots.splice(i,1);
      }
    }
    tickReversalShots(fdt);

    // Hollow Purple collision
    for(let i=hollowShots.length-1;i>=0;i--){
      const hs=hollowShots[i];
      if(hs.hit) continue;
      const def = hs.owner===p1 ? p2 : p1;
      if(!def.hittable) continue;
      const db=def.bodyBox();
      const hb={x:hs.x-HOLLOW_BALL_R,y:hs.y-HOLLOW_BALL_R,w:HOLLOW_BALL_R*2,h:HOLLOW_BALL_R*2};
      if(overlaps(hb,db)){
        hs.hit=true;
        const mx=def.x+PW/2, my=def.y+PH/2;
        addHollowExplosion(mx,my);
        def.hp=Math.max(0,def.hp-HOLLOW_DMG); def.flash=700;
        addDmg(mx,def.y-22,HOLLOW_DMG,'#c060ff'); doShake(20);
        hs.owner.domainCharge=Math.min(DOMAIN_CHARGE_REQ,hs.owner.domainCharge+HOLLOW_DMG);
        if(def.hp<=0){ def._initRd(hs.dir*14,-9,.16*hs.dir); def.ss(S.DEAD); }
        else { def._initRd(hs.dir*14,-8,.15*hs.dir); def.ss(S.RAGD,RAGD_MS*1.8); }
        hollowShots.splice(i,1);
      }
    }
    tickHollowShots(fdt);
    // Fuga shot collision
    for(let i=fugaShots.length-1;i>=0;i--){
      const fs=fugaShots[i];
      if(fs.hit) continue;
      const def = fs.owner===p1 ? p2 : p1;
      if(!def.hittable) continue;
      const db=def.bodyBox();
      const fb={x:fs.x-16,y:fs.y-16,w:32,h:32};
      if(overlaps(fb,db)){
        fs.hit=true;
        const mx=def.x+PW/2, my=def.y+PH/2;
        triggerFugaExplosion(mx, my);
        addParts(mx,my,'#f80',22,7);
        def.hp=Math.max(0,def.hp-FUGA_DMG); def.flash=600;
        addDmg(mx,def.y-20,FUGA_DMG,'#f80'); doShake(18);
        fs.owner.domainCharge=Math.min(DOMAIN_CHARGE_REQ,fs.owner.domainCharge+FUGA_DMG);
        if(def.hp<=0){ def._initRd(fs.dir*12,-8,.15*fs.dir); def.ss(S.DEAD); }
        else { def._initRd(fs.dir*14,-9,.16*fs.dir); def.ss(S.RAGD,RAGD_MS*1.5); }
        fugaShots.splice(i,1);
      }
    }
    tickFugaShots(fdt); tickExplosions(fdt); tickFlameTrails(fdt);
    tickBlackFlashes(fdt);
    tickPiercingBeams(fdt, p1, p2);
    tickGiantCleaves(fdt, p1, p2);
    tickRedOrbs(fdt, p1, p2);
    tickDomain(fdt, p1, p2);
    if(domainFlash>0) domainFlash=Math.max(0,domainFlash-dt);
    tickParts(); tickRings(); tickDmgNums(); tickDismantleEvents(fdt); tickSlashMarks(fdt);

    // Round end check
    if(!roundWinner){
      if(p1.hp<=0 && p2.hp>0){ roundWinner=p2; p1lives--; }
      else if(p2.hp<=0 && p1.hp>0){ roundWinner=p1; p2lives--; }
      else if(p1.hp<=0 && p2.hp<=0){ roundWinner=p1; p1lives--; p2lives--; }
      if(roundWinner){
        timeScale=1;
        if(gameMode==='endless'){
          // Track kills then immediately respawn
          if(roundWinner===p1) p1kills++;
          else if(roundWinner===p2) p2kills++;
          const scorer = roundWinner.name;
          if(p1.hp<=0){ p1.reset(); p1.x=170; }
          if(p2.hp<=0){ p2.reset(); p2.x=690; }
          clearProjectiles(); activeDomain=null; domainFlash=0;
          roundWinner=null;
          showTxt(scorer+' SCORES!', 800);
        } else {
          phase='roundend'; roundDelay=2400;
        }
      }
    }
    drawParts(); drawRings(); drawCleaves(); drawGiantCleaves(); drawLapseOrbs(); drawRedOrbs(); drawReversalShots(); drawHollowShots(Date.now()); drawFlameTrails(); drawExplosions(); drawFugaShots();
    drawDomain();
    drawSlashMarks();
    p1.draw(); p2.draw();
    drawBlackFlashes(); drawPiercingBeams();
    // Domain flash — fade to full black then fade back
    if(domainFlash>0){
      const prog = domainFlash/1000; // 1→0 as flash plays out
      // Peaks at full black halfway through (prog=0.5)
      const alpha = prog > 0.5 ? (1-prog)*2 : prog*2;
      ctx.save();
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.fillStyle = '#000';
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
    // Slow-motion vignette (Black Blur minigame phase)
    if(timeScale < 0.5){
      const depth = 1 - timeScale/0.5;
      ctx.save();
      ctx.globalAlpha = depth * 0.45;
      const vig = ctx.createRadialGradient(W/2,H/2,W*0.25,W/2,H/2,W*0.75);
      vig.addColorStop(0,'rgba(0,0,0,0)');
      vig.addColorStop(1,'rgba(0,0,20,1)');
      ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
      // Subtle blue tint
      ctx.globalAlpha = depth * 0.08;
      ctx.fillStyle='#0044aa'; ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
    drawDmgNums(); drawHUDOverlay(); drawFightText(dt);

  } else if(phase==='roundend'){
    tickParts(); tickRings(); tickExplosions(dt); tickFlameTrails(dt);
    drawParts(); drawRings(); drawFlameTrails(); drawExplosions();
    p1.draw(); p2.draw();
    drawHUDOverlay(); drawRoundEnd();
    roundDelay-=dt;
    if(roundDelay<=0){
      if(p1lives<=0||p2lives<=0){
        winner = p1lives<=0 ? p2 : p1;
        phase='end';
      } else {
        p1.reset(); p2.reset(); clearProjectiles();
        roundWinner=null; activeDomain=null; domainFlash=0; phase='fight'; showTxt('FIGHT!');
      }
    }

  } else {
    tickParts(); tickRings();
    drawParts(); drawRings();
    p1.draw(); p2.draw();
    drawHUDOverlay(); drawMatchEnd();
    if(keys['KeyF']||keys['Semicolon']){
      p1.reset(); p2.reset(); clearProjectiles();
      p1lives=3; p2lives=3; p1kills=0; p2kills=0;
      winner=null; roundWinner=null;
      activeDomain=null; domainFlash=0;
            p1Confirmed=false; p2Confirmed=false;
      p1SelectDown=false; p2SelectDown=false; p1ConfirmDown=false; p2ConfirmDown=false;
      phase='modeSelect'; homeT=0; modeSelectDown=true;
    }
  }

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
